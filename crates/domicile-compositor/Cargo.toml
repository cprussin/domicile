[package]
name = "domicile-compositor"
description = "Domicile Smithay backend: a Wayland protocol frontend that drives the host brain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "domicile-compositor"
path = "src/main.rs"

[dependencies]
domicile-host = { path = "../domicile-host" }
domicile-protocol = { path = "../domicile-protocol" }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Only the Wayland protocol frontend is needed: in Domicile the web engine is the
# renderer, so we deliberately do NOT pull Smithay's GL renderer, winit, or DRM
# backends. Smithay's job here is accepting clients and managing their surfaces.
[dependencies.smithay]
version = "0.7"
default-features = false
features = ["wayland_frontend"]
