[package]
name = "wc-compositor"
description = "Loom Smithay backend: a Wayland protocol frontend that drives the host brain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "loom-compositor"
path = "src/main.rs"

[dependencies]
wc-host = { path = "../wc-host" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Only the Wayland protocol frontend is needed: in Loom the web engine is the
# renderer, so we deliberately do NOT pull Smithay's GL renderer, winit, or DRM
# backends. Smithay's job here is accepting clients and managing their surfaces.
[dependencies.smithay]
version = "0.7"
default-features = false
features = ["wayland_frontend"]
