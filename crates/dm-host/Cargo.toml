[package]
name = "dm-host"
description = "Domicile host orchestrator: ties the Wayland world to the scene model and chrome protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dm-scene = { path = "../dm-scene" }
dm-protocol = { path = "../dm-protocol" }
thiserror.workspace = true
serde.workspace = true
serde_json = "1"

# The Smithay Wayland-server backend lives behind this feature so the
# orchestrator (this crate's default build) stays testable in the core shell
# without the heavy graphics toolchain.
[features]
default = []
smithay-backend = []
