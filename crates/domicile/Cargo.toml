[package]
name = "domicile"
description = "The Domicile host daemon: boots from config and serves the chrome protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "domicile"
path = "src/main.rs"

[lib]
name = "domicile"
path = "src/lib.rs"

[dependencies]
dm-host = { path = "../dm-host" }
dm-config = { path = "../dm-config" }

[dev-dependencies]
tempfile.workspace = true
