name: Engine release

# A patched Chromium somebody can run without building one.
#
# The engine workflow proves a change; this publishes the result of it. They
# are separate because they want different builds: that one is a component
# build with no symbols, which is small and fast and links to several hundred
# .so files in a tree nobody can move. This is `is_component_build = false`,
# which is the shape you can put in a tarball.
#
# IT SHARED engine.yml's CONCURRENCY GROUP, AND THAT WAS THE WRONG MECHANISM.
# Both do reset /build/chromium/src to the pin and apply the series over it,
# and two of them in that tree at once is a `git reset --hard` under a running
# `git am` — but the thing that prevents it is `crux` having one job slot, held
# from checkout to the `if: always()` drop. A shared group did not add to that;
# it only meant this workflow's queued run could be evicted by an unrelated
# push to a branch, because a group holds one pending run and the newest
# arrival wins. A release thrown away by somebody's README-adjacent push is not
# a queue, and it is silent. See engine.yml's own note and
# scripts/test-engine-concurrency.sh.
on:
  push:
    tags: [engine-v*]
  workflow_dispatch:

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: false

# To create the release and upload to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, crux]
    timeout-minutes: 600

    env:
      # Who holds the tree lock, in words a person reading a held-lock message
      # can act on. See engine.yml.
      LOCK_OWNER: engine-release.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

      # `git am` refuses to write a commit without an identity, and this unit
      # has no ~/.gitconfig: its HOME is the work directory, which is deleted
      # on every start. See engine.yml, where this failed the apply step in
      # zero seconds and looked like the patches not applying.
      GIT_AUTHOR_NAME: domicile CI
      GIT_AUTHOR_EMAIL: ci@domicile.invalid
      GIT_COMMITTER_NAME: domicile CI
      GIT_COMMITTER_EMAIL: ci@domicile.invalid
      # Its own output directory, kept warm between releases for the same
      # reason out/Domicile is: a clean Chromium build is four hours. It is the
      # second one on a 200G quota whose first is already 97G, hence the space
      # check below — an overrun should fail this job with a sentence, not fill
      # the dataset the machine's other work lives on.
      OUT: out/Release

    steps:
      - uses: actions/checkout@v7

      # WHICH TREE THIS RUN OWNS, taken and locked in one step. See engine.yml,
      # which explains the pool; the difference here is that this job always
      # resets and always compiles, so it always takes the compile slot too.
      #
      # `$CHROMIUM` and `$STAGE` come from the pool rather than from this
      # file's env, because there is no one tree any more.
      #
      # WHICH MEANS `out/Release` IS PER TREE, ~40G OF IT, where it used to be
      # one directory in whichever tree carried main's pin. That is in the
      # quota chromium-build.nix refuses a deploy under, and the `Room to build
      # in` check below is the runtime half: a release that will not fit
      # reclaims what it owns and then refuses, rather than filling the dataset
      # the machine's own work lives on.
      - name: Take a tree
        run: |
          set -euo pipefail
          tree="$(.github/scripts/engine-tree-pool.sh pick \
            "$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')" \
            "$LOCK_OWNER")"
          echo "this release is built in $tree"
          echo "CHROMIUM=$tree" >>"$GITHUB_ENV"
          echo "STAGE=$(dirname "$tree")/engine-release" >>"$GITHUB_ENV"

      # 62G and no swap: one cold Chromium build at a time on this machine,
      # whichever workflow is running it.
      # See .github/scripts/engine-compile-slot.sh.
      - name: Take the compile slot
        run: .github/scripts/engine-compile-slot.sh take "$LOCK_OWNER"

      # AFTER THE LOCK AND AFTER THE TREE IS CHOSEN, AND BOTH HALVES OF THAT
      # ORDER ARE LOAD-BEARING. This used to be the job's first step, because
      # measuring free space needs nothing and could therefore refuse a doomed
      # run before anything else happened.
      #
      # Measuring still needs nothing. RECLAIMING needs the lock, because two
      # of the three things it removes are inside the checkout and a delete
      # landing in somebody else's build is the silent corruption the lock is
      # for. And it needs the tree to have been picked, because `$CHROMIUM` is
      # a path through a symlink the pool swaps: run before that step, the
      # reclaim empties `out/Release` out of whichever tree the LAST run left
      # the path pointing at, which is by construction not the one this run is
      # about to build in. So the check moved behind both rather than the
      # reclaim moving in front of them.
      #
      # It stopped run 35552629257 in two seconds with 54G free, printed the
      # remedy — remove $CHROMIUM/$OUT, a cache and nothing else — and then did
      # not apply it. Nobody can log into `crux` from CI, so that sentence was
      # the end of the release. The floor is unchanged and still refuses a
      # build that cannot finish; what is new is that it first drops what this
      # workflow owns, the builds in trees no run holds and the compiler cache,
      # measuring again after each.
      - name: Room to build in
        run: .github/scripts/engine-release-room.sh "$CHROMIUM" "$OUT" "$STAGE" "$LOCK_OWNER"

      # The same scripts engine.yml resets and syncs with, because it is the
      # same tree, the same reset and the same pin. The reset used to be a
      # second copy of it here, already drifted in the order of its steps.
      - name: Reset the checkout to the pin, sync its DEPS and apply the series
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')"
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-reset.sh "$CHROMIUM"
          # The DEPS, which the reset does not move. A no-op unless the pin
          # changed; see engine.yml, where the cost of it is written down.
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-sync.sh "$CHROMIUM"
          # Directly, not through Chromium's shell: apply.sh needs no host
          # tool, and the sandbox swallowed both its exit status and its
          # output. See engine.yml.
          packages/domicile-engine/scripts/apply.sh "$CHROMIUM"
          [ "$(git -C "$CHROMIUM" rev-parse HEAD)" != "$pin" ] || {
            echo "::error::the checkout is still at the pin, so no patch was applied" >&2
            exit 1
          }

      # Not build.sh: that one is the measured configuration and should stay
      # the thing a person runs by hand. This is the shippable one, and the
      # only differences that matter are is_component_build and the crashpad
      # handler coming with it.
      # The shell has to prove it ran the command, and the command is a path
      # rather than a string: see engine.yml, where NIX_SHELL_RUN returned
      # success having built nothing, and where a composed command came out the
      # far end of three layers of quoting as `looked: command not found`.
      - name: Build
        run: |
          set -euo pipefail
          done=/tmp/domicile-release-build-ran
          rm -f "$done"

          # tools/nix/shell.nix imports <nixpkgs>, and a systemd service has no
          # NIX_PATH. From the registry, which is what pins it on this machine.
          nixpkgs="$(nix eval --raw --impure --expr '(builtins.getFlake "nixpkgs").outPath')"
          export NIX_PATH="nixpkgs=$nixpkgs"

          cat > /tmp/domicile-release-build <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/engine-release-build.sh" "$CHROMIUM" "$OUT"
          touch "$done"
          EOF
          chmod +x /tmp/domicile-release-build

          # As noise: a latency guard on the other runner waits it out.
          if NIX_SHELL_RUN=/tmp/domicile-release-build \
               "$GITHUB_WORKSPACE/.github/scripts/engine-render-node-lock.sh" noisy "$LOCK_OWNER" -- \
               nix-shell "$CHROMIUM/tools/nix/shell.nix" >/tmp/domicile-shell.log 2>&1; then
            echo "the shell exited 0"
          else
            echo "the shell exited $?"
          fi
          # A compiler error is *above* siso's summary, never in it: the
          # summary says how many steps failed and not which line of which
          # file. Twenty-five lines caught the tail of the progress spinner and
          # the resource table, so a build failure cost a whole cycle on the
          # shared tree to learn nothing — which is what it just did.
          #
          # The diagnostics first, so they are at the top of the group whatever
          # the tail holds, then the tail for context. `|| true` because grep
          # finding nothing is not this step's failure; the build already
          # failed and `set -e` would swallow the tail below.
          grep -aE 'error:|FAILED:|ninja: build stopped|Error:' /tmp/domicile-shell.log |
            tail -40 | sed 's/^/  E /' || true
          tail -120 /tmp/domicile-shell.log | sed 's/^/  | /'

          [ -e "$done" ] || {
            echo "::error::Chromium's shell did not run the build; its last words are above" >&2
            exit 1
          }

      - name: Package
        id: package
        run: |
          set -euo pipefail
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-release-package.sh "$CHROMIUM" "$OUT" "$STAGE"

      # The release artifact is asserted by the same pixel guard that asserts
      # the dev build: the tarball is unpacked back into the checkout as an out
      # directory of its own and the guard is pointed at it with OUT. An
      # artifact that cannot show a client's window is not a release, and
      # nothing else here would have noticed a file left out of the manifest.
      - name: The packaged build passes the guard
        run: |
          set -euo pipefail
          rm -rf "$CHROMIUM/out/Release-staged"
          mkdir -p "$CHROMIUM/out/Release-staged"
          tar -xf "$STAGE/${{ steps.package.outputs.tarball }}" \
            -C "$CHROMIUM/out/Release-staged" --strip-components=1
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- \
            nix develop .#full --command cargo build -p domicile-compositor
          # `DOMICILE_GUARD_CONTROL=0` for the reason pinned-engine.yml sets
          # it: the check runs its control by default and this caller does not
          # want the second run. engine.yml is where that guard is shown to be
          # able to fail.
          DOMICILE_CHROMIUM="$CHROMIUM" DOMICILE_ENGINE_OUT=out/Release-staged \
            DOMICILE_GUARD_CONTROL=0 \
            .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- \
            nix develop .#full --command ./scripts/engine-guard-client-window.sh

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          .github/scripts/engine-release-publish.sh "$STAGE" "$TARBALL"

      - name: What the guard wrote down
        if: ${{ failure() }}
        run: |
          for log in /tmp/domicile-under-wayland.log \
                     /tmp/domicile-client-window-compositor.log; do
            echo "::group::$log"
            tail -200 "$log" 2>&1 || true
            echo "::endgroup::"
          done
          df -h /build || true

      # Only if it is still ours, and only if the pool got us one — see
      # engine.yml.
      - name: Drop the tree
        if: ${{ always() && env.CHROMIUM != '' }}
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"

      - name: Drop the compile slot
        if: ${{ always() }}
        run: .github/scripts/engine-compile-slot.sh drop "$LOCK_OWNER"
