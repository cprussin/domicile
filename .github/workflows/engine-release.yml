name: Engine release

# Build and publish the production engine, so users can run a patched
# Chromium without building one. It is an official build (PGO, ThinLTO, no
# DCHECKs; see engine-release-build.sh). See
# packages/domicile-engine/docs/RELEASES.md.
#
# - Nightly, plus on dispatch. Main runs the checked engine until the official
#   one is pinned (engine-pin.nix), so no merge needs its own build. The
#   concurrency group keeps one running and one pending run, and a newer
#   pending run replaces an older one, so a running build (maybe mid-publish)
#   is never canceled. See scripts/test-engine-release-coalesces.sh.
# - Yields the compile slot to pull requests: engine-yielding-build.sh pauses
#   the build while anyone waits and resumes it incrementally after.
# - Publishes as `engine-official-`, beside engine.yml's releases, then opens
#   a pull request to pin `engine-official.nix` (engine-official-repin.sh).
# - A separate workflow from engine.yml because it needs a different build:
#   `is_component_build = false` produces something that fits in a tarball;
#   engine.yml's component build links to hundreds of .so files.
#
# Concurrency is per ref, not shared with engine.yml: `crux`'s single job slot
# and the tree lock keep the two out of each other's trees, and a shared group
# would let unrelated pushes evict a pending release. See
# scripts/test-engine-concurrency.sh.
on:
  push:
    tags: [engine-v*]
  # 09:17 UTC, night in the Americas, when fewest pull requests want the
  # compile slot. Off the hour, where scheduled runs are delayed most.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: false

# To create the release and upload to it. The pull request that pins it is
# DOMICILE_WRITEBACK_TOKEN's, not this token's.
permissions:
  contents: write
  # The compile slot asks whether its holder's run is over.
  actions: read

jobs:
  release:
    runs-on: [self-hosted, crux]
    # The same limit as engine.yml. A cold official build is long.
    timeout-minutes: 1200

    env:
      # The tree lock holder, named so a person can find the run. See
      # engine.yml.
      LOCK_OWNER: engine-release.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

      # The lowest rank at the compile slot, so this build yields to every
      # other compile, including engine.yml's cold one (rank 1). See
      # engine-compile-slot.sh.
      DOMICILE_COMPILE_SLOT_RANK: 0

      # `git am` needs an identity, and this unit's HOME is deleted on every
      # start. See engine.yml.
      GIT_AUTHOR_NAME: domicile CI
      GIT_AUTHOR_EMAIL: ci@domicile.invalid
      GIT_COMMITTER_NAME: domicile CI
      GIT_COMMITTER_EMAIL: ci@domicile.invalid
      # Kept warm between releases, since a clean build takes four hours. It
      # shares a 200G quota with the 97G checkout, hence the space check below.
      # Not out/Release, the checked build engine.yml keeps warm in the same
      # trees; sharing it would make each build cold for the other.
      OUT: out/Official
      DOMICILE_ENGINE_BUILD: official
      # Ten hours: this waits behind whatever it yielded to, which can be a
      # pull request's cold repin.
      DOMICILE_COMPILE_SLOT_WAIT: 36000

    steps:
      - uses: actions/checkout@v7

      # TMPDIR for every later step, dropped at the end so nix's leftovers go
      # too. See engine.yml.
      - name: A temp directory for this job
        run: |
          set -euo pipefail
          dir="$(.github/scripts/engine-job-tmp.sh make)"
          echo "TMPDIR=$dir" >>"$GITHUB_ENV"
          echo "DOMICILE_JOB_TMP=$dir" >>"$GITHUB_ENV"

      # Take and lock a tree from the pool; see engine.yml. This job always
      # resets and compiles, so it always takes the compile slot too.
      #
      # `$CHROMIUM` and `$STAGE` come from the pool. Each tree has its own ~3G
      # `out/Release`, which the "Room to build in" step accounts for.
      - name: Take a tree
        run: |
          set -euo pipefail
          tree="$(.github/scripts/engine-tree-pool.sh pick \
            "$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')" \
            "$LOCK_OWNER")"
          echo "this release is built in $tree"
          echo "CHROMIUM=$tree" >>"$GITHUB_ENV"
          echo "STAGE=$(dirname "$tree")/engine-release" >>"$GITHUB_ENV"

      # 62G and no swap: one cold Chromium build at a time on this machine.
      # See .github/scripts/engine-compile-slot.sh.
      - name: Take the compile slot
        env:
          # A holder whose run is over holds nothing (crux-run-finished.sh).
          DOMICILE_COMPILE_SLOT_HOLDER_DONE: '.github/scripts/crux-run-finished.sh "$HOLDER"'
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/engine-compile-slot.sh take "$LOCK_OWNER"

      # Must run after the lock and the tree pick. Reclaiming space deletes
      # inside the checkout, so it needs the lock, and `$CHROMIUM` is a symlink
      # the pool swaps, so before the pick it points at another run's tree.
      #
      # Frees space cheapest first (stale temp directories, published and
      # unpacked tarballs, old compiler cache entries, builds in trees no run
      # holds), never this run's own build, then refuses below a 15G floor.
      # See engine.yml.
      - name: Room to build in
        run: .github/scripts/engine-release-room.sh "$CHROMIUM" "$OUT" "$STAGE" "$LOCK_OWNER"

      # The same reset and sync scripts as engine.yml, on the same tree and pin.
      - name: Reset the checkout to the pin, sync its DEPS and apply the series
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')"
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-reset.sh "$CHROMIUM"
          # The reset does not move DEPS. A no-op unless the pin changed.
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-sync.sh "$CHROMIUM"
          # Not through Chromium's shell, whose sandbox hides apply.sh's exit
          # status and output. See engine.yml.
          packages/domicile-engine/scripts/apply.sh "$CHROMIUM"
          [ "$(git -C "$CHROMIUM" rev-parse HEAD)" != "$pin" ] || {
            echo "::error::the checkout is still at the pin, so no patch was applied" >&2
            exit 1
          }

      # Not build.sh, which is the measured configuration a person runs by
      # hand. This build differs in is_component_build and the crashpad
      # handler that comes with it.
      # The shell must prove it ran the command (a sentinel file), and the
      # command is a script path rather than a string; see engine.yml.
      - name: Build
        run: |
          set -euo pipefail
          done=/tmp/domicile-release-build-ran
          rm -f "$done"

          # tools/nix/shell.nix imports <nixpkgs>, and a systemd service has no
          # NIX_PATH, so take nixpkgs from this machine's flake registry.
          nixpkgs="$(nix eval --raw --impure --expr '(builtins.getFlake "nixpkgs").outPath')"
          export NIX_PATH="nixpkgs=$nixpkgs"

          cat > /tmp/domicile-release-build <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/engine-release-build.sh" "$CHROMIUM" "$OUT"
          touch "$done"
          EOF
          chmod +x /tmp/domicile-release-build

          # Under the render node lock as `noisy`, so the other runner's latency
          # guard waits for it. Yields the compile slot to any run that wants
          # it; see the header.
          if NIX_SHELL_RUN=/tmp/domicile-release-build \
               "$GITHUB_WORKSPACE/.github/scripts/engine-yielding-build.sh" "$LOCK_OWNER" -- \
               "$GITHUB_WORKSPACE/.github/scripts/engine-render-node-lock.sh" noisy "$LOCK_OWNER" -- \
               nix-shell "$CHROMIUM/tools/nix/shell.nix" >/tmp/domicile-shell.log 2>&1; then
            echo "the shell exited 0"
          else
            echo "the shell exited $?"
          fi
          # Compiler errors appear above siso's summary, which only counts
          # failed steps. Print matching lines first, then the tail for
          # context. `|| true` so a grep with no matches does not stop the tail
          # under `set -e`.
          grep -aE 'error:|FAILED:|ninja: build stopped|Error:' /tmp/domicile-shell.log |
            tail -40 | sed 's/^/  E /' || true
          tail -120 /tmp/domicile-shell.log | sed 's/^/  | /'

          [ -e "$done" ] || {
            echo "::error::Chromium's shell did not run the build; its last words are above" >&2
            exit 1
          }

      # Nothing below compiles Chromium; see the same step in engine.yml.
      - name: Drop the compile slot, the compile is done
        run: .github/scripts/engine-compile-slot.sh drop "$LOCK_OWNER"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-release-package.sh "$CHROMIUM" "$OUT" "$STAGE"

      # Run the dev build's pixel guard against the unpacked tarball, so a file
      # missing from the manifest fails the release.
      - name: The packaged build passes the guard
        run: |
          set -euo pipefail
          rm -rf "$CHROMIUM/$OUT-staged"
          mkdir -p "$CHROMIUM/$OUT-staged"
          tar -xf "$STAGE/${{ steps.package.outputs.tarball }}" \
            -C "$CHROMIUM/$OUT-staged" --strip-components=1
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- \
            nix develop .#full --command cargo build -p domicile-compositor
          # `DOMICILE_GUARD_CONTROL=0` skips the guard's control run, as in
          # pinned-engine.yml. engine.yml shows the guard can fail.
          DOMICILE_CHROMIUM="$CHROMIUM" DOMICILE_ENGINE_OUT="$OUT-staged" \
            DOMICILE_GUARD_CONTROL=0 \
            .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- \
            nix develop .#full --command ./scripts/engine-guard-client-window.sh

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          .github/scripts/engine-release-publish.sh "$STAGE" "$TARBALL"

      # Only from main: a tag's release is pinned by hand, and a dispatch on a
      # branch is not what main runs.
      - name: Point main's flake at this engine
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          # GITHUB_TOKEN may not open the pull request, and one it opened would
          # run no checks. See packages/domicile-engine/docs/RELEASES.md.
          DOMICILE_WRITEBACK_TOKEN: ${{ secrets.DOMICILE_WRITEBACK_TOKEN }}
        run: |
          set -euo pipefail
          identity="$(.github/scripts/engine-series-stamp.sh identity)"
          DOMICILE_ENGINE_TAG="engine-official-s${identity:0:12}" \
            .github/scripts/engine-official-repin.sh

      - name: What the guard wrote down
        if: ${{ failure() }}
        run: |
          for log in /tmp/domicile-under-wayland.log \
                     /tmp/domicile-client-window-compositor.log; do
            echo "::group::$log"
            tail -200 "$log" 2>&1 || true
            echo "::endgroup::"
          done
          df -h /build || true

      - name: Drop this job's temp directory
        # Only if the step above got as far as making one.
        if: ${{ always() && env.DOMICILE_JOB_TMP != '' }}
        run: .github/scripts/engine-job-tmp.sh drop "$DOMICILE_JOB_TMP"

      # Only if this run still holds it; see engine.yml.
      - name: Drop the tree
        if: ${{ always() && env.CHROMIUM != '' }}
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"

      - name: Drop the compile slot
        if: ${{ always() }}
        run: .github/scripts/engine-compile-slot.sh drop "$LOCK_OWNER"
