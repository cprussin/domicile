name: Cargo test
on:
  pull_request:
  push:
    branches: [main]

# Superseded pushes shouldn't keep a full build running.
concurrency:
  group: cargo-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # The pure-logic crates: everything in the cargo workspace's `default-members`.
  # No graphics or Wayland stack needed, so this stays fast.
  core:
    runs-on: ubuntu-latest
    # A job with no ceiling sits on a wedged runner until GitHub's six-hour
    # default, which reads as "still running" rather than as a failure.
    # Neither of these takes two minutes when the network is well.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Formatting is checked once, here, for the whole workspace — including
      # the crates the compositor job builds.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # domicile-compositor is excluded from `default-members` because it pulls
  # Smithay; it gets its own job so a failure here is distinguishable from a
  # core-logic failure. Only libxkbcommon is needed to link — Domicile
  # deliberately does not build Smithay's GL/DRM/winit backends, since the web
  # engine is the renderer.
  compositor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # libxkbcommon links the seat; the wayland and X11 client libraries are
      # for Smithay's winit backend, which is how the compositor presents.
      # No GL stack here on purpose — the tests needing one are `#[ignore]`d
      # and run from `scripts/e2e-compose.sh`.
      #
      # Retried, with a deadline on each attempt. A stalled apt mirror is the
      # commonest way this job fails and it fails by *hanging*, so a plain
      # `apt-get` can burn the whole job budget getting nowhere.
      #
      # Five minutes an attempt, not one or two: this step is usually 11-13s
      # but its tail is heavy, and runs taking 1m45s, 2m41s and 7m36s have all
      # *succeeded*. A deadline inside that distribution trades a rare hang for
      # a regular red build, and retrying does not help a merely-slow mirror —
      # each attempt starts `apt-get update` again from nothing.
      #
      # `--kill-after` because `timeout` alone does not guarantee its own
      # deadline: it sends TERM and then waits for the process to go, forever
      # if the process does not. Real apt honours TERM, but a wedged one on
      # dead network storage is the case this exists for.
      #
      # Three attempts at five minutes plus backoff is 15m15s, or 15m45s if
      # every attempt has to be killed — the grace is added to the deadline,
      # not taken out of it. Both sit inside the 20-minute job cap, which is
      # the real backstop.
      - name: Install the libraries the compositor links
        run: |
          install() {
            sudo apt-get update \
              && sudo apt-get install -y \
                libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
                libxrandr-dev libxi-dev
          }
          for attempt in 1 2 3; do
            if timeout --kill-after=10 300 bash -c "$(declare -f install); install"; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out" >&2
            # Not after the last one: a total outage should say so rather than
            # sit idle for fifteen seconds first.
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::apt did not succeed in three attempts" >&2
          exit 1
      - run: cargo clippy -p domicile-compositor --all-targets -- -D warnings
      # No separate build of the Wayland client these tests start: the
      # `domicile-test-client` binary is a target of `domicile-compositor`
      # (its code is still `domicile-test-client`'s), so cargo builds it with
      # the tests that spawn it. It used to be asked for on a line of its own,
      # which meant `cargo test -p domicile-compositor` failed for anyone who
      # ran only that.
      - run: cargo test -p domicile-compositor
