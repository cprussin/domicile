name: Cargo test

# The cargo workspace: `fmt`, `clippy -D warnings` and `test`, which is what
# /docs/guidelines/RUST.md names as the required checks and what
# `./scripts/check.sh rust` runs.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cargo-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Nothing in this group may skip: the toolchain is installed below and the
  # libraries the compositor links are installed with it, so a skip here is a
  # check that stopped running rather than a fact about the runner.
  DOMICILE_CHECK_STRICT: "1"

jobs:
  # ONE JOB, WHERE THIS WAS TWO. The split was `core` over the workspace's
  # `default-members` and `compositor` over the one crate left out of them,
  # because only that crate needs `libxkbcommon` and `libwayland` and installing
  # them for the rest was a minute nobody needed. What it cost was a third
  # definition of "the Rust checks" — `check.sh rust` runs `--workspace`, these
  # two ran `default-members` and then `-p domicile-compositor`, and whether the
  # three agreed was something a person had to work out by reading all of them.
  #
  # `--workspace` needs the libraries, so the libraries are installed once here
  # and the parallelism goes. That is wall-clock on a runner nobody is waiting
  # for, against one list instead of three.
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the libraries the compositor links
        run: .github/scripts/apt-install.sh libxkbcommon-dev libwayland-dev

      # `check.sh` installs no node_modules for this group, because nothing in
      # it reads one — which is why there is no bun set up above.
      - run: ./scripts/check.sh rust
