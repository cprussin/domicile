name: Cargo test

# The cargo workspace's required checks (`fmt`, `clippy -D warnings`, `test`;
# see /docs/guidelines/RUST.md), as `./scripts/check.sh rust` runs them.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cargo-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Nothing in this group may skip: the toolchain and libraries are installed
  # below.
  DOMICILE_CHECK_STRICT: "1"

jobs:
  # One job over `--workspace`, so CI runs the same checks as
  # `check.sh rust`. That needs the compositor's libraries for every crate.
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Mesa's EGL and libgbm: `shm_upload`'s test draws on llvmpipe, and
      # `gbm`'s loads the real libgbm. Neither needs a GPU. `wl-clipboard`: the
      # selection tests run `wl-copy` and `wl-paste`.
      - name: Install the libraries the compositor links and loads
        run: .github/scripts/apt-install.sh libxkbcommon-dev libwayland-dev libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libgbm1 wl-clipboard

      # This group needs no node_modules, so bun is not set up.
      - run: ./scripts/check.sh rust
