name: Distro packages

# Build the Debian, RPM and Arch packages (`distro/build.sh`) and their signed
# repositories (`distro/repo.sh`), install each from its repository in its
# distribution's container (`./scripts/check.sh distro`), and publish them
# as a release when stable.yml calls this for a commit it promoted.
#
# On pull requests, only those that touch the packaging or the pins it reads.
# The other workflows build the code itself.
on:
  pull_request:
    paths:
      - distro/**
      - flake.nix
      - flake.lock
      - packages/domicile-engine/engine-*.nix
      - scripts/check.sh
      - packages/check-runner/**
      - packages/distro-checks/**
      - .github/scripts/distro-packages-publish.sh
      - .github/workflows/distro-packages.yml
  workflow_call:
    inputs:
      ref:
        description: The commit to package
        type: string
        required: true
      publish:
        description: Publish the packages as a release
        type: boolean
        default: false
      release:
        description: Version the packages as changesets did, not by commit time
        type: boolean
        default: false
      prerelease:
        description: Version the packages as a prerelease of what changesets gave them
        type: boolean
        default: false
  # To publish again after a failure: the commit stable.yml promoted, and
  # `publish`.
  workflow_dispatch:
    inputs:
      ref:
        description: The commit to package
        type: string
        required: true
      publish:
        description: Publish the packages as a release
        type: boolean
        default: false
      release:
        description: Version the packages as changesets did, not by commit time
        type: boolean
        default: false
      prerelease:
        description: Version the packages as a prerelease of what changesets gave them
        type: boolean
        default: false

concurrency:
  group: distro-packages-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # In Debian 12, so the binaries need glibc 2.36 at most. The engine needs
  # 2.25.
  binaries:
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 45
    steps:
      - name: Install the build tools and the headers the compositor builds against
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libpipewire-0.3-dev libclang-dev libgstreamer1.0-dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: distro/binaries.sh binaries
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: binaries/

  packages:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: binaries/
      - run: distro/build.sh binaries distro-out
        env:
          DOMICILE_RELEASE: ${{ inputs.release && '1' || '' }}
          DOMICILE_PRERELEASE: ${{ inputs.prerelease && '1' || '' }}
      # The installs check the repositories, signed with a key made here.
      # Releases sign with the real key.
      - name: Make the signed repositories
        run: |
          mapfile -t tools < <(sed -n 's/^\([a-z]\)/nixpkgs#\1/p' distro/repo-tools)
          nix shell --inputs-from . "${tools[@]}" --command sh -c \
            'DOMICILE_SIGNING_KEY="$(distro/repo-test-key.sh)" distro/repo.sh distro-out distro-repo'
      - uses: actions/upload-artifact@v7
        with:
          name: repo
          path: distro-repo/
          compression-level: 0
      # Already compressed.
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: distro-out/
          compression-level: 0

  installs:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, debian-12, ubuntu, ubuntu-22.04, fedora, opensuse, arch]
    env:
      # Docker is on the runner, so the check must run.
      DOMICILE_CHECK_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: distro-repo/
      - uses: oven-sh/setup-bun@v2
      # Absolute: turbo runs the check from its package.
      - run: ./scripts/check.sh distro
        env:
          DOMICILE_DISTRO_REPO: ${{ github.workspace }}/distro-repo
          DOMICILE_DISTROS: ${{ matrix.distro }}

  publish:
    needs: installs
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: distro-out/
      - run: .github/scripts/distro-packages-publish.sh distro-out
        env:
          GH_TOKEN: ${{ github.token }}
