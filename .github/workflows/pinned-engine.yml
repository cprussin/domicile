name: Pinned engine

# Checks that the engine this checkout pins works with the compositor this
# checkout builds.
#
# Other jobs check one half each: `nix-build.yml` never starts a desktop, and
# engine.yml's pixel guard runs the engine it built from `patches/`, not the
# published tarball. A C ABI change merged without a repin passed both and
# aborted the compositor (#411, #413).
#
# - Cheap: `nix build .#engine` fetches the tarball named in
#   `engine-release.nix` (~210MB), so no Chromium tree or tree lock is
#   involved. That is why it is a separate workflow from engine.yml.
# - No `paths:` filter: the compositor's side of the ABI
#   (`packages/domicile-compositor/src/engine.rs`), the shared header and the
#   pin can each break the pair.
# - Runs on main as well as pull requests: a `pull_request` run tests against
#   main as it was when the event fired, so a repin and an ABI change open at
#   once pass alone and break together.
on:
  pull_request:
  push:
    branches: [main]

# Keyed by ref, as scripts/test-engine-concurrency.sh requires of every
# workflow on this machine.
#
# Unlike the others, this one cancels in progress. They must not because a
# killed Chromium link leaves a half-linked out directory. This job only
# fetches a tarball, builds the compositor in its own directory and runs a
# guard, so a cancel leaves nothing behind, and on `crux-light` a superseded
# run only delays newer runs of this job.
#
# Comments here must not name Chromium's build tools:
# scripts/test-the-pinned-engine-meets-the-compositor.sh greps the whole file
# for them.
concurrency:
  group: pinned-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    # The dmabuf import needs a DRM render node, which `ubuntu-latest` lacks.
    #
    # `crux-light`, not `crux`: both are job slots on the same machine
    # (cprussin/dotfiles: config/machines/crux/domicile-ci.nix). `crux` holds
    # the Chromium checkout and is busy with engine.yml for ~29 minutes at a
    # time. This job uses none of the checkout, and sharing that slot queued
    # it for hours.
    runs-on: [self-hosted, crux-light]

    # A warm run takes about two minutes, so a run at half an hour is stuck.
    # The two legitimate waits fit inside it and report what they waited for:
    # the render node lock (gives up after 20 minutes) and the guard's draw
    # poll (up to four minutes).
    timeout-minutes: 30

    env:
      # The render node holder, named so a person can find the run.
      CARD_OWNER: pinned-engine.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7

      # /tmp belongs to the runner service, which outlives each job, so the
      # failure dump below would otherwise print the last run's logs.
      - name: Forget the last run's logs
        run: rm -f /tmp/domicile-*.log

      # The published engine, as a user gets it. The store path names the
      # engine version in the log.
      - name: Fetch the engine this checkout pins
        run: |
          set -euo pipefail
          ENGINE="$(nix build --no-link --print-out-paths .#engine)"
          echo "the pin resolves to $ENGINE"
          echo "ENGINE=$ENGINE" >> "$GITHUB_ENV"

      # The compositor from this tree, the other half of the pair.
      #
      # Under the render node lock as `noisy`, so engine.yml's latency guard
      # waits for it.
      - name: Build the compositor this checkout carries
        run: .github/scripts/engine-render-node-lock.sh noisy "$CARD_OWNER" -- nix develop .#full --command cargo build -p domicile-compositor

      # One job at a time on the render node, held only around the guard.
      # Other work on the card only slows a pixel comparison, but engine.yml's
      # `guard-latency.sh` cannot tell a second client from a latency
      # regression. Holding it for the whole job would put the two back in
      # one queue. Unlike the tree lock, which fails when held, this lock
      # waits for the holder; see the script's header for why that is safe.
      - name: Take the render node
        run: .github/scripts/engine-render-node-lock.sh take "$CARD_OWNER"

      # The guard `check.sh engine` runs, pointed at the store path.
      # - `.#full`, not Chromium's toolchain shell: `engineRuntimeLibs` in
      #   flake.nix provides both the GL stack (for client dmabufs) and
      #   Chromium's runtime libraries (for `libdomicile_engine.so`).
      # - `DOMICILE_ENGINE_OUT=.`: the store path is itself the out directory.
      #   `scripts/lib/engine-guard.sh` reads both variables.
      # - `DOMICILE_GUARD_CONTROL=0`: engine.yml already runs the guard with
      #   `NEGATIVE=1` to show it can fail.
      #
      # An ABI mismatch aborts the compositor when it reads the engine's
      # display list, before any frame, so the guard reports a compositor that
      # did not start. The panic is in the log the next step prints.
      - name: The pinned engine draws a client's window on the page
        run: |
          set -euo pipefail
          DOMICILE_CHROMIUM="$ENGINE" DOMICILE_ENGINE_OUT=. \
            DOMICILE_GUARD_CONTROL=0 \
            nix develop .#full --command ./scripts/engine-guard-client-window.sh

      # Always, including on cancel, so a canceled run does not leak the lock.
      # `drop` is a no-op unless this run holds it.
      - name: Drop the render node
        if: ${{ always() }}
        run: .github/scripts/engine-render-node-lock.sh drop "$CARD_OWNER"

      - name: What the guard wrote down
        if: ${{ failure() }}
        run: |
          for log in /tmp/domicile-under-wayland.log \
                     /tmp/domicile-client-window-compositor.log \
                     /tmp/domicile-client-window-engine.log; do
            echo "::group::$log"
            tail -200 "$log" 2>&1 || true
            echo "::endgroup::"
          done
