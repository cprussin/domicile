name: Publish packages

# Publish every public `@domicile-desktop/*` package to npm as
# `0.0.0-alpha-<sha>`. See .github/scripts/publish-packages.sh.
#
# Uses trusted publishing: npm accepts this workflow's OIDC token for packages
# whose trusted publisher on npmjs.com names this repository and file, and adds
# provenance. A package without a trusted publisher refuses the publish. npm
# attaches one only to an existing package, so a new package is first claimed
# by hand with a placeholder version and given its trusted publisher there.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time and none thrown away: each run publishes its own commit.
concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # npm 11.5.1 is the first that publishes with an OIDC token.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: .github/scripts/publish-packages.sh
