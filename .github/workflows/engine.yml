name: Engine

# The Chromium fork, built and asserted on the one machine that can.
#
# `packages/domicile-engine` carries a patch series against a pinned Chromium.
# A clean build of it is 4h16m and 97G; an incremental one against a warm tree
# is 65s. No GitHub-hosted runner can hold that tree — the Actions cache is 10G
# per repository and the runners' disks are smaller than the checkout — so this
# job runs on `crux`, which has the tree, the GPU and the render node.
#
# Everything else in this repository still runs on `ubuntu-latest`. This job is
# the exception, and it builds only when a change touches what the engine build
# reads, so that an ordinary change never waits on it.
#
# IT RUNS IN THE MERGE QUEUE, AND ONLY THERE. It used to run on the pull
# request and again on the push to main, and the pull request run was the one
# that could not be trusted. A `pull_request` run builds `refs/pull/N/merge`:
# the head merged into main AS MAIN WAS WHEN THE EVENT FIRED, and main moving
# does not fire it again. This build queues for hours on one machine, so by
# the time it started main had usually moved, and what this job builds is
# `patches/` applied with `git am` over a fixed `CHROMIUM_PIN` -- two
# patch-series branches that are each green alone can refuse to apply
# together, or apply and not compile. On the night the old version of this
# comment was written #379, #380 and #381 were open at once and landed within
# three hours; each one's green run had never seen the other two.
#
# THE QUEUE BUILDS WHAT IT IS ABOUT TO MERGE. A `merge_group` run is the base
# with every change queued ahead of this one and this one on top, and the
# ruleset lets one group build at a time, so the tree this job proves is the
# tree main becomes. That makes the other two runs redundant rather than
# merely expensive:
#
#   - the PULL REQUEST gets the `ubuntu-latest` checks and no Chromium build.
#     The trigger stays, unfiltered, because `engine` is a required check and
#     a pull request cannot enter the queue until it reports. The job skips
#     itself there, and GitHub reports a job skipped by its `if:` as a
#     success. A `paths:` filter would not do: a workflow a filter skips
#     reports NOTHING, and a required check that never reports holds the pull
#     request out of the queue forever.
#   - MAIN is not built again. With the queue required, main only receives
#     commits the queue already built, so a `push` run is the same tree twice.
#     The old reason to keep it -- a direct push, an admin merge, a merge where
#     this check was absent rather than red -- is what the ruleset forbids
#     now; anybody who bypasses it can dispatch this workflow on main, which is
#     what `workflow_dispatch` is kept for.
#
# `merge_group` TAKES NO `paths:`. GitHub does not filter that event, so which
# changes build is decided by the `gate` job below, on `ubuntu-latest`, with
# the same list the filter used -- see .github/scripts/engine-inputs.sh. A
# merge group that touches none of it skips this job, and that skip reports
# as a success to the required check the same way the pull request's does.
#
# The ruleset carries the rest and is not in this repository: `engine`
# required, one group building at a time, and a 360-minute check timeout. See
# `timeout-minutes` below for what that timeout means for a pin roll, and
# scripts/test-engine-runs-in-the-merge-queue.sh, which asserts this shape.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_dispatch:

# Per ref, and never canceled mid-flight.
#
# THE LOCKS ARE THE QUEUE, NOT THIS. Two runs of this workflow can run at
# once now — `crux` has two heavy runners and a pool of trees — and what keeps
# them apart is per-tree: `engine-tree-pool.sh pick` hands each run a tree
# nothing else holds, and `engine-compile-slot.sh` keeps the cold builds among
# them down to one. The queue in front of those is GitHub's runner queue:
# unbounded, FIFO, and it never throws a run away.
#
# A CONCURRENCY GROUP IS NOT THAT QUEUE, WHICH IS WHY THIS IS KEYED BY REF. A
# group holds exactly ONE pending run and evicts it when a newer run arrives.
# Shared across refs — as this was, with `group: engine`, together with
# engine-release.yml — that makes every branch able to discard every other
# branch's queued run: runs 176 and 177 were each canceled seconds after they
# were created, by a push to a different branch, and one branch lost two runs
# before it got a result. Keyed by ref, the only run a push can evict is the
# pending run for the same ref, which is the one it supersedes.
#
# IN THE QUEUE EVERY RUN IS ITS OWN REF. A merge group is built from a
# `gh-readonly-queue/main/pr-N-<sha>` branch of its own, so no group can evict
# another's pending run; what keeps them to one build at a time is the
# ruleset's build concurrency, not this.
#
# `cancel-in-progress: false` stays, and is the half that group name never
# provided: a canceled `autoninja` leaves a half-linked `out/Release` that
# the next run inherits, and the failure it produces looks like a code error
# rather than an interrupted build. Waiting is cheaper than that.
#
# What still keeps CI out of a person's build in that tree is
# .github/scripts/engine-tree-lock.sh, and it refuses rather than waits — it
# has to, because a waiter would hold the one slot the holder needs in order to
# finish. See scripts/test-engine-concurrency.sh, which asserts all of this.
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false

# `write`, and the reason is the whole of what this workflow now does beyond
# proving a change. An engine change used to be two pull requests: this one,
# and a second one moving `engine-release.nix` onto the tarball a manually
# dispatched release produced. The second one is what got forgotten, so
# changes that needed a release shipped without one.
#
# The release is built and published here now -- a tag and a release, which
# is what the token needs `contents: write` for, along with the proof tag the
# last step pushes. `engine-release.nix` is NOT written here any more: the
# queue's branch is deleted once it merges, so a commit on it would go with
# it. engine-repin.yml writes it onto main after the merge instead. See
# `.github/scripts/engine-release-needed.sh`.
permissions:
  contents: write

jobs:
  # WHETHER THIS RUN BUILDS AT ALL, decided off crux so it costs no slot.
  #
  # Two questions. Does the merge group touch anything the engine build reads
  # -- the `paths:` filter this workflow used to carry, which `merge_group`
  # does not support -- and has this exact tree already passed, which a group
  # re-queued with nothing new under it has.
  #
  # Not on a pull request, where the build never runs: the engine job skips
  # itself there without asking.
  gate:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.proof.outputs.key }}
      proved: ${{ steps.proof.outputs.proved }}
      touched: ${{ steps.inputs.outputs.touched }}
    steps:
      - uses: actions/checkout@v7

      # Against the merge group's BASE, not the pull request's: the head
      # carries every change queued ahead of this one, and if any of them
      # touches the engine this tree is one the engine has not built.
      #
      # The base is fetched by id because the checkout is one commit deep, and
      # a diff needs both trees. A dispatch has no merge group and always
      # builds, so it never gets here.
      - id: inputs
        if: ${{ github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "$BASE_SHA"
          .github/scripts/engine-inputs.sh gate "$BASE_SHA" "$HEAD_SHA"

      - id: proof
        run: .github/scripts/engine-proof.sh gate

  # `engine` IS THE REQUIRED CHECK, BY THIS KEY. A job's check is named by
  # its `name:` when it has one and by its id when it does not, and the
  # ruleset names `engine` -- so no `name:` here.
  engine:
    needs: gate
    # WHEN IT BUILDS, and each condition fails toward building.
    #
    # Never on a pull request: that is the queue's job now, and a job skipped
    # here reports as a success, which is what lets the pull request enter the
    # queue at all. A merge group that touches no engine input, or a tree that
    # already passed, skips the same way, and the queue reads that as green.
    #
    # `!cancelled()` because without a status function GitHub adds an implicit
    # `success()`, and a gate that FAILED would then skip this job -- and a
    # skipped required check passes. With it, a gate that failed before it
    # answered leaves that output empty, the comparison below it is not met,
    # and the build runs.
    if: >-
      ${{ !cancelled()
          && github.event_name != 'pull_request'
          && needs.gate.outputs.touched != 'false'
          && needs.gate.outputs.proved != 'true' }}
    # `crux` is a label, not the runner's name. Both are set in
    # cprussin/dotfiles: config/machines/crux/domicile-ci.nix.
    #
    # SECURITY, and it is not enforceable here: this runner executes as a real
    # user on a machine in a house, and this repository is public and forkable.
    #
    # THE CONTROL IS WHO CAN QUEUE A CHANGE, NOT WHO CAN OPEN ONE. No pull
    # request reaches this runner any more; a merge group does, and a merge
    # group runs in THIS repository's context with THIS workflow's
    # `contents: write` token whatever branch or fork the change came from.
    # Only somebody with write access can add a pull request to the queue, so
    # queueing is the approval -- and it is the whole of it: Settings ->
    # Actions -> "Require approval for all external contributors" guarded the
    # `pull_request` run, which no longer builds. A fork's change is reviewed
    # before it is queued, or it runs as a real user on this machine with a
    # token that can push tags and releases.
    #
    # Checked before it merges, still, which is what the advice in
    # domicile-ci.nix to build only after a merge would have lost: a merge
    # group is not on main until this check passes.
    runs-on: [self-hosted, crux]

    # An incremental build is ~1m and the guards a few minutes more. The budget
    # is for the case this exists to survive: a pin roll, where the series
    # lands on a fresh upstream revision and NEITHER build is incremental.
    #
    # IT WAS 360 AND THAT HELD ONE OF THE TWO. Run 35714578006, the pull
    # request that rolled `CHROMIUM_PIN` to `86298bb`:
    #
    #   set up, reset, sync, apply, stamp  13:13:01 -> 13:14:56   1m55s
    #   Build (out/Domicile, cold)         13:14:56 -> 18:22:13   5h07m
    #   The engine's checks                18:22:13 -> 18:31:13   9m
    #   Build the release configuration    18:31:13 -> 19:18:35   KILLED 47m in
    #   package / guard / publish / repin                         SKIPPED
    #
    # Six hours and five minutes of the one slot for nothing: no tarball, no
    # release, and `engine-release.nix` never written back — which is the step
    # that turns a repin pull request green, so the branch stayed red for the
    # absence of what the run was killed before producing. The budget has to
    # hold BOTH compiles, because the steps below are both of them.
    #
    # 720 AGAINST A MEASURED 9h09m. The second half is `engine-release.yml`'s
    # own number for the same `engine-release-build.sh` into the same
    # `out/Release` after a pin moved — 3h46m on run 35559130923, 3h25m on run
    # 35620485558 — so a finished version of the run above is 1m55s + 5h07m +
    # 9m + 3h46m + ~4m of package, guard, publish and write-back. The headroom
    # over that is deliberate and not round-number padding: the same cold
    # `out/Domicile` has measured 4h16m on a quiet machine and 5h07m here, and
    # `crux` also serves its owner's interactive builds. 600 would leave 51
    # minutes over the only cold repin anybody has timed, and being an hour
    # short costs the whole nine and publishes nothing.
    #
    # THE QUEUE WAITS 360 MINUTES, AND THIS JOB MAY TAKE 720. The ruleset's
    # check timeout is counted from when the merge group asks for checks, queue
    # time on `crux` included, and it fails the group whatever this job is
    # doing -- so a cold pin roll, which is most of the budget below, does not
    # fit in the queue. A pin roll is PRE-WARMED instead: dispatch this
    # workflow on the pull request's branch before queueing it. That run builds
    # a tree at the new pin and publishes the series' release, so the queue's
    # run finds a warm tree (the pool prefers one at this pin) and a published
    # release, and is the ~11m case. The budget stays for that dispatch, which
    # no queue is timing.
    #
    # WHAT THE LARGER NUMBER COSTS is that a WEDGED job holds the one slot for
    # twelve hours rather than six. That is the right trade and not a close
    # one: the failure this repository has actually had is a working job killed
    # at its budget, which wastes the slot for the full budget AND produces
    # nothing, where a wedge wastes the same slot and was never going to
    # produce anything either. A budget is a ceiling, not a spend — the ~11m
    # run that most merge groups get is unchanged.
    #
    # IT CANNOT DIFFER PER CASE. `timeout-minutes` is fixed before the job
    # starts, and which case a run is in — does the checkout carry this series,
    # does this series still owe a release — is decided by `steps.series` and
    # `steps.release` INSIDE it. So one number, and it has to be the expensive
    # run's. See scripts/test-the-engine-budget-holds-both-builds.sh, which
    # asserts this against that measurement and against
    # `engine-release.yml`'s budget for the strictly smaller job.
    timeout-minutes: 720

    env:
      # Who holds the tree and the compile slot, in words a person reading a
      # held-lock message can act on: it names the workflow to look at and the
      # run to open. The
      # attempt is in it because a re-run is a different holder — the first
      # attempt's `drop` and the second's `take` must not be able to agree.
      LOCK_OWNER: engine.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

      # And who holds the render node, which is a different lock over a
      # different thing and is why it has a name of its own. The tree lock
      # keeps two writers out of one checkout; this one keeps two clients off
      # the card while something is being timed. They are held over different
      # spans and released by different steps.
      CARD_OWNER: engine.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

      # The one build: what ships, and what the checks run against. ~40G, kept
      # warm because a clean Chromium build is four hours.
      OUT_RELEASE: out/Release

      # `apply.sh` ends in `git am`, which writes commits, and git refuses to
      # write one without an identity. The runner's HOME is the work directory
      # — deleted and recreated on every start — so there is no ~/.gitconfig
      # and never will be, and the tree's own config has none either: it was
      # first patched by hand, by a person who had one.
      #
      # These are the env vars git reads before it looks at any config, so
      # nothing has to be written into a checkout that gets reset every run.
      GIT_AUTHOR_NAME: domicile CI
      GIT_AUTHOR_EMAIL: ci@domicile.invalid
      GIT_COMMITTER_NAME: domicile CI
      GIT_COMMITTER_EMAIL: ci@domicile.invalid

    steps:
      - uses: actions/checkout@v7

      # /tmp is this unit's, not this job's: PrivateTmp is per-service, and the
      # runner service outlives every job it runs. So a guard's log from the
      # last run is still there when the next one starts, and the failure dump
      # below will happily print it — which it did, for three reads of a job
      # that had failed before any guard ran. Numbers from a previous run are
      # worse than no numbers.
      # AND THE CONTROL BUDGETS, which are not logs and are the same hazard.
      # A guard writes down how long it waited so that its control can watch
      # for a multiple of that rather than a constant; the runner is not
      # ephemeral, so a number from the last job is sitting there. The library
      # ignores a note older than ten minutes for exactly this, and a clock is
      # a worse guarantee than an empty directory. See lib-control-budget.sh.
      #
      # Beside the logs and for the same reason: /tmp is what the steps of one
      # job share. This used to read `${TMPDIR:-/tmp}` and so emptied a third
      # directory again — `nix develop` gives every `--command` a $TMPDIR of
      # its own, so no step of this job has the one this step does.
      - name: Forget the last run's logs
        run: |
          rm -f /tmp/domicile-*.log
          rm -rf /tmp/domicile-control-budgets

      # WHICH TREE THIS RUN OWNS. Picking and locking are one step because
      # they cannot be two: a tree chosen and then locked is a tree another run
      # can take in between.
      #
      # `crux` keeps N Chromium checkouts. This takes the first one this run
      # can lock, preferring one already at this pin — which makes the stamp
      # below answer `carries=true` and skips the reset, the sync, the apply
      # and the compile, the ~1m case for a pin that would otherwise cost 4h.
      #
      # IT WRITES `$CHROMIUM` RATHER THAN READING IT, and that is the change
      # that lets two runs build at once. /build/chromium is still a symlink
      # and it is a person's bookmark now: a job that reached its tree through
      # one shared path could not have another job in another tree beside it.
      #
      # WHY THIS EXISTS AT ALL: moving `CHROMIUM_PIN` invalidates out/Release
      # in both directions, so two branches on different pins taking turns in
      # one tree is that 4h EVERY TURN — a dispatch pre-warming a pin roll
      # beside merge groups still on the old pin is exactly that, on the one
      # slot everything else queues behind.
      #
      # `$STAGE` goes with it. `engine-release-room.sh` does `rm -rf` on that
      # directory, so two runs sharing one would delete each other's tarball
      # mid-package. Per tree rather than per run because the tree is the thing
      # this run holds exclusively, and because the tarballs are worth keeping
      # between runs.
      #
      # It does not look inside a tree. Whether the one it took really holds
      # this series is the stamp's question, asked next.
      # See .github/scripts/engine-tree-pool.sh.
      - name: Take a tree
        run: |
          set -euo pipefail
          tree="$(.github/scripts/engine-tree-pool.sh pick \
            "$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')" \
            "$LOCK_OWNER")"
          echo "this run builds in $tree"
          echo "CHROMIUM=$tree" >>"$GITHUB_ENV"
          echo "STAGE=$(dirname "$tree")/engine-release" >>"$GITHUB_ENV"

      # ASKED HERE, BEFORE ANYTHING IS BUILT OR PROVED, FOR TWO REASONS.
      #
      # It is a decision and not an action: it reads this checkout's series and
      # asks GitHub whether that series is published, and it touches neither
      # the tree nor the engine. Nothing below it is skipped or run differently
      # because it ran early — the steps that act on its answer are still after
      # the guards, where a release may only be published by a build that
      # passed them.
      #
      # WHAT IT BUYS IS THAT A GUARD FAILURE NO LONGER HIDES IT. Every step
      # between here and there can go red, and on a flaky one they have; with
      # the decision down beside the steps it gates, a run that never reached
      # it left no record of what this change owed, and the answer `build=false,
      # write=false` — the one almost every run gets — had never once been
      # printed in CI. It also fails fast: a change that moves the fork learns
      # in the first minute that it is buying a release build, rather than in
      # the eleventh.
      # AND MOST RUNS DO NONE OF IT. `engine-release-needed.sh` answers
      # `build=false, write=false` whenever `engine-release.nix` already names
      # this series, which is every merge group that touches this package
      # without moving the fork — a script, a BUILD arg, this workflow.
      - name: Does this series still owe a release?
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/engine-release-needed.sh

      # In a script, and shared with engine-release.yml, which resets the same
      # tree for the same reason. The two copies of this had already drifted in
      # the order of their steps; a third copy is what the script prevents. It
      # also carries the diagnostic for a tree that is still dirty afterward,
      # which is long because the cause is not visible from the symptom.
      # IS ANY OF THE NEXT THREE STEPS WORTH DOING?
      #
      # The reset puts every patched file back to upstream and `git am` patches
      # it again, so a series that has not moved still comes out of those two
      # steps with every file rewritten — same bytes, new mtimes — and the
      # build behind them is the most expensive thing in this repository.
      #
      # This asks whether the checkout is already carrying exactly this pin,
      # these patches and these laid-down files, and whether it is still in the
      # state a finished apply leaves. When it is, the reset, the apply and the
      # compile have nothing to do and are skipped; the guards below still run,
      # against the build that is already there.
      #
      # WHEN IT SAYS YES. A merge group that touches this package without
      # touching the series — a script, a BUILD arg, this workflow — and the
      # queue's run of a pin roll that a dispatch already pre-warmed, which
      # would otherwise be a full build of a tree `crux` compiled hours earlier.
      # When two branches with different series interleave on the one tree, it
      # says no, and no is what every run costs today.
      #
      # THE RISK IS ENTIRELY ON THE `true` SIDE, which is why the script checks
      # the tree rather than believing the file: a wrong `true` builds
      # something other than this pull request and reports it as this pull
      # request. See .github/scripts/engine-series-stamp.sh and its test, which
      # spends eleven of thirteen cases on exactly that.
      - name: Is the checkout already carrying this series?
        id: series
        run: .github/scripts/engine-series-stamp.sh carries "$CHROMIUM"

      # THE MEMORY THE POOL CANNOT SPLIT. Two trees is two runs; 62G with no
      # swap is one cold Chromium build, and two of them is an OOM kill on the
      # machine that serves the house its DNS.
      #
      # Only a run that is going to compile takes it, which is the half that
      # makes the pool worth having: a warm run compiles nothing and must not
      # queue behind a repin. Warm means out/Release too, not just the
      # checkout: a tree can carry the series with a cold out/Release. See .github/scripts/engine-compile-slot.sh.
      - name: Is out/Release already built from this?
        id: warm
        run: .github/scripts/engine-compile-slot.sh warm "$CHROMIUM"

      - name: Take the compile slot
        if: ${{ steps.series.outputs.carries != 'true' || steps.warm.outputs.warm != 'true' || steps.release.outputs.build == 'true' }}
        run: .github/scripts/engine-compile-slot.sh take "$LOCK_OWNER"

      - name: Reset the checkout to the pin
        if: ${{ steps.series.outputs.carries != 'true' }}
        run: .github/scripts/engine-reset.sh "$CHROMIUM"

      # A REPIN NEEDS NOBODY ON `crux`, and this step is the half of that which
      # costs anything. The reset above fetches the revision and puts the tree
      # on it; every third-party checkout under it is still at the previous
      # pin's revisions until `gclient sync` moves them, and a tree half-rolled
      # like that does not build. Both used to be a person's job: this step and
      # the one above it were a check that stopped with "roll the checkout
      # forward by hand".
      #
      # ON AN ORDINARY RUN IT IS ONE `cat`. The pin the DEPS were last synced
      # to is written down beside the checkout, and a run whose pin matches it
      # does not start `gclient` at all — which matters because this machine
      # has one job slot and an incremental build in it is ~1m. The run that
      # does pay is the repin, which is rebuilding most of Chromium anyway.
      # See .github/scripts/engine-sync.sh and scripts/test-engine-sync.sh.
      - name: Sync the checkout's DEPS to the pin
        run: .github/scripts/engine-sync.sh "$CHROMIUM"

      # In a script, which is where the reason it does NOT enter Chromium's
      # shell is written down, along with the HEAD check that says the series
      # actually went on. See .github/scripts/engine-apply.sh.
      - name: Apply the series
        if: ${{ steps.series.outputs.carries != 'true' }}
        run: .github/scripts/engine-apply.sh "$CHROMIUM"

      # AFTER THE APPLY AND BEFORE THE BUILD, so that a run which dies in the
      # build leaves a stamp describing a tree that is genuinely carrying the
      # series — which it is, whatever the compiler then said about it. The
      # next run skips the reset and compiles what is left, which is what an
      # incremental build is for.
      #
      # It refuses rather than writes when the tree is not what the apply
      # should have left. A stamp is only worth what the run that wrote it
      # checked, and the place to find out is here rather than in the next
      # run's skip.
      - name: Write down what the checkout is carrying
        if: ${{ steps.series.outputs.carries != 'true' }}
        run: .github/scripts/engine-series-stamp.sh record "$CHROMIUM"


      # A cold out/Release is ~40G, and a release owed is when it is likeliest
      # to be cold.
      - name: Room to build in
        if: ${{ steps.release.outputs.build == 'true' }}
        run: |
          free_gb=$(df -BG --output=avail /build | tail -1 | tr -dc '0-9')
          echo "/build has ${free_gb}G free"
          [ "$free_gb" -ge 60 ] || {
            echo "::error::only ${free_gb}G free on /build; a cold out/Release needs ~40G. Reclaim it by removing $CHROMIUM/$OUT_RELEASE, which is a cache." >&2
            exit 1
          }

      # out/Release, the shipped configuration, with everything the checks load
      # -- see .github/scripts/engine-build.sh.
      #
      # Unconditional, where the three steps above are not. A series that has
      # not moved leaves nothing for the compiler to do and this is ~65s of
      # siso deciding so; a series that HAS moved was just applied. What the
      # skip above saves is the reset and the apply rewriting every patched
      # file, which is what makes this expensive.
      - name: Build
        run: .github/scripts/engine-build-in-shell.sh "$CHROMIUM"

      - name: Write down what out/Release was built from
        run: .github/scripts/engine-compile-slot.sh built "$CHROMIUM"

      # EVERY ASSERTION THIS JOB MAKES, IN ONE COMMAND, and none of them
      # defined here. `scripts/check.sh engine` runs the artifact check, the two
      # gtest suites and the fourteen guard checks with their twelve controls,
      # in that order and stopping at the first failure — which is what the
      # thirty steps this replaced achieved by aborting the job, and is worth
      # keeping because `crux` has one tree slot and the guards are most of the
      # eleven minutes an engine run takes when the pin has not moved.
      #
      # THE POINT OF THE CHANGE IS THAT THIS IS RUNNABLE. A person on `crux`
      # with the tree warm types the same command and gets the same suite;
      # before, the only definition of it was this file, and
      # `guard-css-and-resize.sh` had never been run by anything but a person
      # retyping forty lines of YAML by hand. The floors for the DRM suites
      # were written out twice, here and in engine-drm-probe.yml, and the two
      # copies had parted — `DrmScreenTest:26` against `:18` — which is what
      # that costs.
      #
      # `.#full` once, around the group, rather than once per check: it is the
      # shell every one of them needs, and thirty entries into it were thirty
      # shell startups. The one check that needs Chromium's
      # toolchain shell instead enters it itself, and says why in its own
      # header.
      #
      # THE RENDER NODE IS TAKEN INSIDE THE LATENCY CHECK, not around this
      # step. Holding the card for the whole group would be most of ten minutes
      # of guards that do not need it, which is the one-queue arrangement the
      # second job slot exists to leave — see
      # .github/scripts/engine-render-node-lock.sh. `scripts/engine-guard-latency.sh`
      # takes it around its own measurement and its control and drops it from a
      # trap, which is this job's `if: always()` expressed where the lock now
      # lives.
      #
      # `DOMICILE_CHECK_STRICT=1` because on this machine there is nothing a
      # check here may legitimately skip: the tree is warm, the GPU is real and
      # the render node is there. A skip is a check that stopped running, and
      # this is the one runner where that can be said without exceptions.
      - name: The engine's checks
        env:
          # `$CHROMIUM` rather than a path written again: which tree this run
          # holds is the pool's answer, and a second copy of it is a second
          # thing to keep true.
          DOMICILE_CHROMIUM: ${{ env.CHROMIUM }}
          DOMICILE_ENGINE_OUT: ${{ env.OUT_RELEASE }}
          # Per runner: kept across runs, and never rebuilt under another run.
          DOMICILE_CARGO_TARGET: /build/cargo-target/${{ runner.name }}
          DOMICILE_CHECK_STRICT: "1"
          # Where a failing check's whole log is kept, named because $TMPDIR in
          # there is nix's and nothing else in this job has it — the same reason
          # the cleanup step above stopped using $TMPDIR. /tmp is what the steps
          # of one job share, which is where `engine-diagnostics.sh` already
          # reads the guards' own logs from.
          DOMICILE_CHECK_LOG_DIR: /tmp
        run: nix develop .#full --command ./scripts/check.sh engine

      # ===================================================================
      # THE RELEASE, WHICH IS WHY AN ENGINE CHANGE IS ONE PULL REQUEST NOW
      # ===================================================================
      #
      # Everything above proves the change. What follows publishes it, and
      # engine-repin.yml then writes `engine-release.nix` onto main once the
      # queue has merged it — so the pull request that moves the fork is also
      # the pull request that repins it, and merging it is sufficient.
      #
      # IT WAS TWO PULL REQUESTS AND A MANUAL STEP. This workflow proved a
      # change on the pull request and again on the merge; a release was
      # `engine-release.yml`, dispatched by hand; and moving
      # `engine-release.nix` onto what that produced was a second pull
      # request, which ran this job twice more. Four engine builds and a
      # manual step for one change — and the manual step is the one that got
      # skipped. It had been skipped twice when this was written: #470 and
      # #482 each rolled `CHROMIUM_PIN` with no release behind either, so main
      # named an engine built at Chromium `3d77360` while the pin said
      # `fa0ce55`, and #487 was the third pull request that had to be opened
      # by hand to say so.
      #
      # WHAT MADE IT TWO was `engine-release.nix` holding a url and a hash.
      # The url named the domicile commit, which does not exist until the
      # branch merges. The hash is of the tarball, and Chromium does not build
      # byte-for-byte twice, so it cannot be predicted from source at all.
      # Naming releases after the SERIES — the pin, `patches/` and `src/`
      # hashed by content — fixes the first: that value is computable from the
      # branch and is identical to what the merge would produce. The second is
      # not fixable and does not need to be, because the build happens here.
      #
      # WHAT IS LEFT HERE IS THE ACTING. The deciding is step 5, up beside the
      # tree, and `steps.release.outputs` is what every `if:` below reads.

      - name: Package the release
        id: package
        if: ${{ steps.release.outputs.build == 'true' }}
        run: .github/scripts/engine-release-package.sh "$CHROMIUM" "$OUT_RELEASE" "$STAGE"

      # THE ARTIFACT IS ASSERTED, NOT ASSUMED. The guards above ran against
      # out/Release itself; nothing in them would notice a file left out of
      # the release manifest.
      # So the tarball is unpacked back into the checkout as an output
      # directory of its own and the same pixel guard is pointed at it. An
      # artifact that cannot show a client's window is not a release.
      #
      # AFTER THE RENDER NODE IS DROPPED, AND THAT IS RIGHT. The card lock is
      # held around `guard-latency.sh` alone, because timing is the one thing
      # a second client on the node makes WRONG rather than merely slower.
      # This is a did-the-color-land guard, which is the kind that survives
      # sharing — see `scripts/engine-guard-latency.sh`, which is where that
      # lock is taken now, and engine-release.yml, which runs this same guard
      # holding nothing.
      #
      # THROUGH THE CHECK RATHER THAN THE GUARD, like every other caller.
      # `DOMICILE_ENGINE_OUT` is how a caller says which build to read, and is
      # the whole reason `scripts/lib/engine-guard.sh` takes it: the tarball
      # unpacked here is a third engine beside the dev build and the pinned one.
      #
      # AND WITH ITS CONTROL, unlike `engine-release.yml` and
      # `pinned-engine.yml`, which each say in prose that a second run would buy
      # nothing and spend the slot twice. Two reasons this one keeps it. The
      # cheap one: this step is reached only by a run that is already spending
      # four hours on a release build, so twenty-five seconds is not a cost
      # anybody can measure. The one that matters: no step of THIS workflow may
      # set `DOMICILE_GUARD_CONTROL`, because this is the job whose controls are
      # the point, and `scripts/test-the-workflows-delegate-their-checks.sh`
      # reads the file rather than the step. A per-step exception would be a
      # door into the file that owns the rule, for a saving of twenty-five
      # seconds.
      - name: The packaged release passes the guard
        if: ${{ steps.release.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          rm -rf "$CHROMIUM/out/Release-staged"
          mkdir -p "$CHROMIUM/out/Release-staged"
          tar -xf "$STAGE/${{ steps.package.outputs.tarball }}" \
            -C "$CHROMIUM/out/Release-staged" --strip-components=1
          nix develop .#full --command cargo build -p domicile-compositor
          DOMICILE_CHROMIUM="$CHROMIUM" DOMICILE_ENGINE_OUT=out/Release-staged \
            nix develop .#full --command ./scripts/engine-guard-client-window.sh

      - name: Publish the release
        if: ${{ steps.release.outputs.build == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: .github/scripts/engine-release-publish.sh "$STAGE" "$TARBALL"

      # NO WRITE-BACK HERE, WHERE THERE USED TO BE ONE. This job pushed the
      # regenerated `engine-release.nix` onto the pull request's branch. In a
      # merge group there is no such branch to push to: the group's own
      # `gh-readonly-queue/...` branch is deleted once it merges, and the pull
      # request's branch is already merged by then. So the release is published
      # here, from the tree that merges, and engine-repin.yml writes the pin
      # onto main on the push that follows -- where the published release is
      # already waiting for it.
      #
      # WHICH IS WHY THE PIN'S OWN CHECKS STAY OUT OF THE QUEUE.
      # `scripts/test-the-pinned-engine-is-this-series.sh` and
      # `pinned-engine.yml` are red on a change that moves the fork until that
      # push lands, so neither runs on `merge_group`; a required check that
      # can only pass after the merge would hold every such change out of it.
      # scripts/test-engine-runs-in-the-merge-queue.sh asserts that.

      # Last, so a proof means the release was published too.
      - name: Record the proof
        if: ${{ needs.gate.outputs.key != '' }}
        env:
          KEY: ${{ needs.gate.outputs.key }}
        run: .github/scripts/engine-proof.sh record "$KEY"

      # In a script, not inline. GitHub echoes every step's script into the
      # log before running it, so forty lines of dump here is forty lines
      # between a failure and the end of the log — which is exactly where a
      # failure gets read from, and it cost four fetches to notice.
      # Everything the guards write down, because none of it is on stdout.
      #
      # `under-wayland.sh` sends sway's output to a file and then says only "no
      # compositor came up"; `guard-client-window.sh` keeps the compositor's
      # log because it is the only place that says which app id a surface was
      # brokered under, and a failure there is usually a mismatch. Under
      # `PrivateTmp=true` both are inside the runner unit's own /tmp, so they
      # are unreachable once the job ends — they have to be printed here or
      # they are lost.
      - name: What the guards wrote down
        if: ${{ failure() }}
        run: .github/scripts/engine-diagnostics.sh

      # Even when something above failed, and *only* if it is still ours: the
      # step that fails because the lock is held by somebody else reaches here
      # too, and an unconditional `rm` there would release their tree in the
      # middle of their build.
      - name: Drop the tree
        # `env.CHROMIUM != ''` because the pool writes it: a run that found
        # every tree held never got one, and `drop` with no path is a usage
        # error printed over the message that says what actually happened.
        if: ${{ always() && env.CHROMIUM != '' }}
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"

      - name: Drop the compile slot
        if: ${{ always() }}
        run: .github/scripts/engine-compile-slot.sh drop "$LOCK_OWNER"
