name: Engine

# Builds the Chromium fork and runs its checks on `crux`.
#
# A clean build needs ~4h and 97G, more than a GitHub-hosted runner holds, so
# this workflow runs on `crux`, which has the tree, the GPU and the render node.
# It runs only on paths that can affect the engine. See
# packages/domicile-engine/docs/BUILD-MACHINE.md.
#
# It runs on the merge as well as the pull request. A `pull_request` run builds
# the head merged into main as main was when the run started. Two patch-series
# branches can each pass alone and fail to apply or build together, and the
# merge is the first tree that has both. No other workflow builds main.
on:
  push:
    branches: [main]
    # `.github/scripts/engine-*.sh` and these `scripts/` files are the steps
    # and checks of this job, so a change to them must run it. Listed by name:
    # the rest of `scripts/` runs on `ubuntu-latest` and must not take `crux`.
    # Written out twice because GitHub does not resolve YAML anchors.
    #
    # Markdown is excluded because prose cannot change the build. The exclusion
    # comes after the include it narrows, since the later pattern wins.
    #
    # `engine-release.nix` and `engine-official.nix` are excluded because this
    # job never reads them: it builds `CHROMIUM_PIN` plus `patches/`.
    # nix-build.yml fetches the tarball they name and so checks a repin.
    # scripts/test-engine-path-filter.sh asserts that nix-build.yml keeps
    # running on every change.
    paths:
      - packages/domicile-engine/**
      - "!packages/domicile-engine/**/*.md"
      - "!packages/domicile-engine/engine-release.nix"
      - "!packages/domicile-engine/engine-official.nix"
      - .github/workflows/engine.yml
      - .github/scripts/engine-*.sh
      - scripts/check.sh
      - scripts/engine-*.sh
      - scripts/lib/engine-guard.sh
  pull_request:
    paths:
      - packages/domicile-engine/**
      - "!packages/domicile-engine/**/*.md"
      - "!packages/domicile-engine/engine-release.nix"
      - "!packages/domicile-engine/engine-official.nix"
      - .github/workflows/engine.yml
      - .github/scripts/engine-*.sh
      - scripts/check.sh
      - scripts/engine-*.sh
      - scripts/lib/engine-guard.sh
  workflow_dispatch:

# Keyed by ref, so a push can evict only the pending run it supersedes. A
# group without `queue: max` keeps one pending run and evicts it when a newer
# one arrives. Shared across refs, it would let one branch discard another's
# runs.
#
# Never canceled in progress: publishing, the write-back and recording the
# proof cannot be safely repeated. engine-cancel-stale.yml stops a replaced
# commit's run only in steps that can be.
#
# Runs are kept apart on `crux` by `engine-tree-pool.sh pick`,
# `engine-compile-slot.sh` and `engine-tree-lock.sh`, not by this group.
# scripts/test-engine-concurrency.sh asserts this.
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false

# `contents: write` lets the engine job push `engine-release.nix` back onto the
# branch. See packages/domicile-engine/docs/RELEASES.md.
#
# `actions: write` lets a run cancel itself when its commit was replaced.
permissions:
  contents: write
  actions: write

env:
  # Names who holds the tree and the compile slot, readable in a held-lock
  # message. The attempt is included because a re-run is a different holder.
  #
  # Set for the whole workflow because three jobs share one tree, and `drop`
  # compares owners.
  LOCK_OWNER: engine.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

  # The build that ships and that the checks run against. Kept warm because a
  # clean build takes hours.
  OUT_RELEASE: out/Release

jobs:
  # Skips a tree that already passed, such as the write-back push. Runs off
  # `crux`, so it costs no slot.
  gate:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.proof.outputs.key }}
      proved: ${{ steps.proof.outputs.proved }}
    steps:
      - uses: actions/checkout@v7
      - id: proof
        run: .github/scripts/engine-proof.sh gate

  # Decides whether this run will compile, before the build job takes a runner.
  #
  # `crux` and `crux-two` share one compile slot. A run that will compile waits
  # in the build job's concurrency group, which holds no runner, instead of
  # holding a runner idle while it waits for the slot.
  #
  # `cold=false` means ccache covers the compile. Warm and cold compiles queue
  # separately so a warm one is not stuck behind a cold build. A wrong guess
  # only picks the wrong queue. See `engine-tree-pool.sh compiles`.
  plan:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.proved != 'true' }}
    runs-on: [self-hosted, crux]
    # A checkout and a few stamp reads.
    timeout-minutes: 10
    outputs:
      compile: ${{ steps.pool.outputs.compile }}
      cold: ${{ steps.pool.outputs.cold }}
    steps:
      - uses: actions/checkout@v7
      - name: Would this run compile?
        id: pool
        run: |
          .github/scripts/engine-tree-pool.sh compiles \
            "$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')"

  # Takes a tree, applies this series, builds out/Release, and hands the tree
  # to the engine job still locked. Only the compile runs in the compile queue.
  build:
    needs: [gate, plan]
    # `!cancelled()`, so a gate that errors runs the engine rather than
    # skipping it.
    if: ${{ !cancelled() && needs.gate.outputs.proved != 'true' }}
    # Passed to the engine job so it acts on this job's decisions instead of
    # making its own.
    outputs:
      chromium: ${{ steps.tree.outputs.chromium }}
      stage: ${{ steps.tree.outputs.stage }}
      build: ${{ steps.release.outputs.build }}
      write: ${{ steps.release.outputs.write }}
      tag: ${{ steps.release.outputs.tag }}
    # A per-run group (no queue) only when the plan said this run compiles
    # nothing; the warm queue only when it said warm. A failed plan queues as
    # cold. Released when this job ends. `queue: max` keeps every pending run
    # (up to 100) in order; the default keeps one and cancels the rest.
    concurrency:
      group: ${{ needs.plan.outputs.compile == 'false' && format('crux-warm-{0}-{1}', github.run_id, github.run_attempt) || needs.plan.outputs.cold == 'false' && 'crux-compile' || 'crux-compile-cold' }}
      queue: max
      cancel-in-progress: false
    # `crux` is a label, set in cprussin/dotfiles:
    # config/machines/crux/domicile-ci.nix.
    #
    # Security: this runner executes as a real user on a home machine, and the
    # repository is public. It is safe only while fork pull requests need
    # approval (Settings -> Actions -> "Require approval for all external
    # contributors"). Forks get a read-only token, and the write-back refuses
    # other repositories.
    #
    # It runs on `pull_request` so an engine change is checked before it merges.
    runs-on: [self-hosted, crux]

    # Sized for a pin roll plus a wait for the compile slot. A pin roll is two
    # cold builds (~9h measured), and the slot wait can be another run's pin
    # roll. Under 24h because GITHUB_TOKEN expires then. `timeout-minutes` is
    # fixed before the job knows which case it is in, so it covers the worst.
    # scripts/test-the-engine-budget-holds-both-builds.sh asserts this.
    timeout-minutes: 1200

    env:
      # `git am` needs an identity, and the runner has no ~/.gitconfig. Git
      # reads these before any config.
      GIT_AUTHOR_NAME: domicile CI
      GIT_AUTHOR_EMAIL: ci@domicile.invalid
      GIT_COMMITTER_NAME: domicile CI
      GIT_COMMITTER_EMAIL: ci@domicile.invalid

      # A cold build's rank at the compile slot; unset for a warm one. See
      # engine-compile-slot.sh.
      DOMICILE_COMPILE_SLOT_RANK: ${{ needs.plan.outputs.cold != 'false' && '1' || '' }}

    steps:
      - uses: actions/checkout@v7

      # A per-job TMPDIR. `nix-shell` and `nix develop` leave directories in
      # TMPDIR, and the last step drops this one. See
      # .github/scripts/engine-job-tmp.sh.
      - name: A temp directory for this job
        run: |
          set -euo pipefail
          dir="$(.github/scripts/engine-job-tmp.sh make)"
          echo "TMPDIR=$dir" >>"$GITHUB_ENV"
          echo "DOMICILE_JOB_TMP=$dir" >>"$GITHUB_ENV"

      # Picks and locks a tree in one step, so no other run can take it in
      # between. Prefers a tree already at this pin, which skips the reset,
      # apply and compile. Sets `$CHROMIUM` and `$STAGE` for later steps.
      # `$STAGE` is per tree because `engine-release-room.sh` deletes it.
      #
      # The tree stays locked when this job ends, for the engine job. See
      # .github/scripts/engine-tree-pool.sh.
      - name: Take a tree
        id: tree
        env:
          # A run waiting for a tree asks this as the compile slot's does.
          DOMICILE_TREE_STILL_WANTED: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name == github.repository
                && '.github/scripts/crux-still-head.sh "$HEAD_REF" "$HEAD_SHA"'
                || github.event_name == 'push' && '.github/scripts/crux-still-latest.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"'
                || '' }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tree="$(.github/scripts/engine-tree-pool.sh pick \
            "$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')" \
            "$LOCK_OWNER")"
          stage="$(dirname "$tree")/engine-release"
          echo "this run builds in $tree"
          echo "CHROMIUM=$tree" >>"$GITHUB_ENV"
          echo "STAGE=$stage" >>"$GITHUB_ENV"
          echo "chromium=$tree" >>"$GITHUB_OUTPUT"
          echo "stage=$stage" >>"$GITHUB_OUTPUT"

      # Decided early so a failing check later cannot hide the answer. It
      # touches neither the tree nor the engine; the steps that publish still
      # run only after the checks pass. Most runs get `build=false,
      # write=false` because `engine-release.nix` already names this series.
      - name: Does this series still owe a release?
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/engine-release-needed.sh

      # The reset and apply rewrite every patched file, which forces an
      # expensive rebuild. When the tree already carries this pin and series,
      # the reset, apply and compile are skipped; the checks still run.
      #
      # A wrong `true` would test a different build than this change, so the
      # script checks the tree rather than trusting the stamp. See
      # .github/scripts/engine-series-stamp.sh.
      - name: Is the checkout already carrying this series?
        id: series
        run: .github/scripts/engine-series-stamp.sh carries "$CHROMIUM"

      # Only a compiling run takes the compile slot: the machine has memory for
      # one cold build. A tree can carry the series with a stale out/Release, so
      # this checks the build too. See .github/scripts/engine-compile-slot.sh.
      - name: Is out/Release already built from this?
        id: warm
        run: .github/scripts/engine-compile-slot.sh warm "$CHROMIUM"

      # The compile group is the main queue; this wait is a backstop for a run
      # the plan guessed wrong or a compile from engine-release.yml. It waits
      # rather than fails, because a refused run needs a manual re-run.
      #
      # It gives up when its commit is replaced, since nobody will read the
      # result: on a pull request when the branch moves (crux-still-head.sh),
      # on main when a newer push started its own run (crux-still-latest.sh).
      # Checked before taking the slot and while waiting, never once it is
      # held. Not checked for forks, whose branch is not on origin.
      - name: Take the compile slot
        id: slot
        if: ${{ steps.series.outputs.carries != 'true' || steps.warm.outputs.warm != 'true' || steps.release.outputs.build == 'true' }}
        env:
          DOMICILE_COMPILE_SLOT_WAIT: 36000
          # A holder whose run is over holds nothing (crux-run-finished.sh).
          DOMICILE_COMPILE_SLOT_HOLDER_DONE: '.github/scripts/crux-run-finished.sh "$HOLDER"'
          GH_TOKEN: ${{ github.token }}
          DOMICILE_COMPILE_SLOT_STILL_WANTED: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name == github.repository
                && '.github/scripts/crux-still-head.sh "$HEAD_REF" "$HEAD_SHA"'
                || github.event_name == 'push' && '.github/scripts/crux-still-latest.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"'
                || '' }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/engine-compile-slot.sh take "$LOCK_OWNER"

      # Cancels rather than fails, since the commit is not wrong, only replaced.
      # The sleep keeps the step alive until the cancel lands. The `always()`
      # drops below still run on a canceled job.
      - name: Cancel this run, its commit was replaced
        if: ${{ failure() && (steps.slot.outputs.superseded == 'true' || steps.tree.outputs.superseded == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          sleep 120
          echo "::error::asked GitHub to cancel run ${{ github.run_id }} and it has not" >&2
          exit 1

      - name: Reset the checkout to the pin
        if: ${{ steps.series.outputs.carries != 'true' }}
        run: .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-reset.sh "$CHROMIUM"

      # Moves third-party checkouts to the pin's DEPS; a half-rolled tree does
      # not build. A no-op when the pin matches the last sync. See
      # .github/scripts/engine-sync.sh.
      - name: Sync the checkout's DEPS to the pin
        run: .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-sync.sh "$CHROMIUM"

      # See .github/scripts/engine-apply.sh.
      - name: Apply the series
        if: ${{ steps.series.outputs.carries != 'true' }}
        run: .github/scripts/engine-apply.sh "$CHROMIUM"

      # Before the build, so a run that fails to compile still leaves a correct
      # stamp and the next run builds incrementally. Refuses if the tree is not
      # what the apply should have left.
      - name: Write down what the checkout is carrying
        if: ${{ steps.series.outputs.carries != 'true' }}
        run: .github/scripts/engine-series-stamp.sh record "$CHROMIUM"


      # A build needs 15G. Frees space on the shared /build disk, cheapest
      # first, and never this run's own build. Refuses if it is still short.
      # Runs after the tree is taken so it knows which build to keep.
      - name: Room to build in
        if: ${{ steps.release.outputs.build == 'true' }}
        run: .github/scripts/engine-release-room.sh "$CHROMIUM" "$OUT_RELEASE" "$STAGE" "$LOCK_OWNER"

      # Builds out/Release and everything the checks load. Always runs; with
      # nothing changed it takes about a minute. See
      # .github/scripts/engine-build.sh.
      #
      # Marked noisy so another run's latency guard waits for it.
      #
      # A cold build that holds the slot yields it to a waiting warm compile or
      # latency guard, then resumes incrementally. The stopped build is killed
      # before the handover, so two compiles never hold the slot. See
      # .github/scripts/engine-yielding-build.sh.
      #
      # engine-cancel-stale.yml stops this step by its name, `Build`.
      - name: Build
        env:
          STEP_ASIDE: ${{ needs.plan.outputs.cold != 'false' && steps.slot.outcome == 'success' }}
          # Taking it back waits as long as the first take did.
          DOMICILE_COMPILE_SLOT_WAIT: 36000
        run: |
          set -euo pipefail
          build=(.github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-build-in-shell.sh "$CHROMIUM")
          if [ "$STEP_ASIDE" = true ]; then
            .github/scripts/engine-yielding-build.sh "$LOCK_OWNER" -- "${build[@]}"
          else
            "${build[@]}"
          fi

      - name: Write down what out/Release was built from
        run: .github/scripts/engine-compile-slot.sh built "$CHROMIUM"

      # Nothing after this compiles Chromium, so the slot is released for
      # other runs. `drop` is a no-op on a slot already dropped. See
      # scripts/test-the-compile-slot-covers-only-the-compile.sh.
      - name: Drop the compile slot, the compile is done
        run: .github/scripts/engine-compile-slot.sh drop "$LOCK_OWNER"

      - name: Drop this job's temp directory
        # `env.DOMICILE_JOB_TMP != ''` because a job that failed before
        # making one has none to drop.
        if: ${{ always() && env.DOMICILE_JOB_TMP != '' }}
        run: .github/scripts/engine-job-tmp.sh drop "$DOMICILE_JOB_TMP"

      # Only when this job failed; otherwise the engine job drops it. `drop`
      # checks the owner, so a tree another run holds is left alone.
      - name: Drop the tree, the build did not finish
        # `env.CHROMIUM != ''` because a run that never got a tree has none
        # to drop.
        if: ${{ (failure() || cancelled()) && env.CHROMIUM != '' }}
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"

      - name: Drop the compile slot
        if: ${{ always() }}
        run: .github/scripts/engine-compile-slot.sh drop "$LOCK_OWNER"

  # Runs the checks, publishes a release and writes it back, outside the
  # compile queue. Named `engine` because branch protection checks that name.
  #
  # Works in the tree the build job left locked. `crux` and `crux-two` share
  # /build, so either runner can reach it.
  engine:
    needs: [gate, build]
    # Runs when the build failed, so the check is red rather than skipped.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: [self-hosted, crux]

    # Most of this is the latency guard's wait for a quiet machine, which can
    # be another run's cold build.
    timeout-minutes: 720

    env:
      # The build job's tree and stage, still locked by this run.
      CHROMIUM: ${{ needs.build.outputs.chromium }}
      STAGE: ${{ needs.build.outputs.stage }}

      # Who holds the render node. Separate from the tree lock: this one keeps
      # other clients off the GPU while a measurement runs.
      CARD_OWNER: engine.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

    steps:
      - name: The build passed
        if: ${{ needs.build.result != 'success' }}
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "::error::the build job ended '$RESULT', so there is nothing to check" >&2
          exit 1

      - uses: actions/checkout@v7

      # The runner service's /tmp outlives jobs, so old guard logs and control
      # budgets would be read as this run's. See lib-control-budget.sh.
      #
      # /tmp, not $TMPDIR: each `nix develop --command` gets its own $TMPDIR.
      - name: Forget the last run's logs
        run: |
          rm -f /tmp/domicile-*.log
          rm -rf /tmp/domicile-control-budgets

      # A per-job TMPDIR, as in the build job.
      - name: A temp directory for this job
        run: |
          set -euo pipefail
          dir="$(.github/scripts/engine-job-tmp.sh make)"
          echo "TMPDIR=$dir" >>"$GITHUB_ENV"
          echo "DOMICILE_JOB_TMP=$dir" >>"$GITHUB_ENV"

      # A tree someone took since the build may have been reset, and checking
      # it would prove nothing.
      - name: This run still holds its tree
        run: .github/scripts/engine-tree-lock.sh holds "$CHROMIUM" "$LOCK_OWNER"

      # All of this job's checks, defined in `scripts/check.sh engine` so a
      # person on `crux` can run the same suite. Stops at the first failure.
      # See packages/domicile-engine/docs/TESTING.md.
      #
      # The latency guard takes the render node itself, only around its
      # measurement. See .github/scripts/engine-render-node-lock.sh.
      #
      # Strict, because on `crux` no check has a reason to skip.
      - name: The engine's checks
        env:
          # The tree the pool picked for this run.
          DOMICILE_CHROMIUM: ${{ env.CHROMIUM }}
          DOMICILE_ENGINE_OUT: ${{ env.OUT_RELEASE }}
          # Per runner: kept across runs, and never rebuilt under another run.
          DOMICILE_CARGO_TARGET: /build/cargo-target/${{ runner.name }}
          DOMICILE_CHECK_STRICT: "1"
          # The compile slot's wait, since the compile it waits out can be a
          # cold build. See scripts/test-the-engine-budget-holds-both-builds.sh.
          DOMICILE_RENDER_NODE_QUIET_WAIT: 36000
          # Where a failing check's full log goes. /tmp because $TMPDIR inside
          # `nix develop` is per command; `engine-diagnostics.sh` reads it.
          DOMICILE_CHECK_LOG_DIR: /tmp
        run: nix develop .#full --command ./scripts/check.sh engine

      # ===================================================================
      # Release
      # ===================================================================
      #
      # Publishes the build and writes `engine-release.nix` back onto the
      # branch, so the pull request that changes the fork also repins it.
      # Releases are named after the series, which is computable from the
      # branch. See packages/domicile-engine/docs/RELEASES.md.
      #
      # The build job decided what to do; the `if:`s below read
      # `needs.build.outputs`.

      - name: Package the release
        id: package
        if: ${{ needs.build.outputs.build == 'true' }}
        run: .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-release-package.sh "$CHROMIUM" "$OUT_RELEASE" "$STAGE"

      # The checks ran against out/Release, so a file missing from the release
      # manifest would go unnoticed. This unpacks the tarball and runs the
      # pixel guard against it.
      #
      # It does not hold the render node: only timing needs that.
      #
      # It keeps its control, because no step of this workflow may set
      # `DOMICILE_GUARD_CONTROL`. See
      # scripts/test-the-workflows-delegate-their-checks.sh.
      - name: The packaged release passes the guard
        if: ${{ needs.build.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          rm -rf "$CHROMIUM/out/Release-staged"
          mkdir -p "$CHROMIUM/out/Release-staged"
          tar -xf "$STAGE/${{ steps.package.outputs.tarball }}" \
            -C "$CHROMIUM/out/Release-staged" --strip-components=1
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- \
            nix develop .#full --command cargo build -p domicile-compositor
          DOMICILE_CHROMIUM="$CHROMIUM" DOMICILE_ENGINE_OUT=out/Release-staged \
            .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- \
            nix develop .#full --command ./scripts/engine-guard-client-window.sh

      - name: Publish the release
        if: ${{ needs.build.outputs.build == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: .github/scripts/engine-release-publish.sh "$STAGE" "$TARBALL"

      # Only for a pull request from this repository: this job never commits to
      # main, and a fork's branch is not writable. On main,
      # scripts/test-the-pinned-engine-is-this-series.sh fails instead.
      #
      # Commits onto the branch tip, not the merge ref, so main is not merged
      # into the branch. If main changed the series during the run, this
      # writes the merge's series, so the check goes red and the next run
      # corrects it. A force-push over it is harmless: the next run finds the
      # release published and writes the same file.
      - name: Write engine-release.nix back onto this branch
        if: >-
          ${{ needs.build.outputs.write == 'true'
              && github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This series' tag; `engine-nightly` may be a different series.
          DOMICILE_ENGINE_TAG: ${{ needs.build.outputs.tag }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Optional; without it the write-back's CI waits for an approval.
          DOMICILE_WRITEBACK_TOKEN: ${{ secrets.DOMICILE_WRITEBACK_TOKEN }}
        run: .github/scripts/engine-release-repin.sh "$HEAD_REF"

      # Last, so a proof means the write-back landed too. The run it triggers
      # waits on this one's concurrency group, so it sees the tag.
      - name: Record the proof
        if: ${{ needs.gate.outputs.key != '' }}
        env:
          KEY: ${{ needs.gate.outputs.key }}
        run: .github/scripts/engine-proof.sh record "$KEY"

      # Prints the guards' logs, which are not on stdout and are lost when the
      # runner unit's private /tmp goes. In a script so the log does not echo
      # a long dump before the failure. Skipped when the build failed, since
      # no guard ran.
      - name: What the guards wrote down
        if: ${{ failure() && needs.build.result == 'success' }}
        run: .github/scripts/engine-diagnostics.sh

      - name: Drop this job's temp directory
        # `env.DOMICILE_JOB_TMP != ''` because a job that failed before
        # making one has none to drop.
        if: ${{ always() && env.DOMICILE_JOB_TMP != '' }}
        run: .github/scripts/engine-job-tmp.sh drop "$DOMICILE_JOB_TMP"

      # Always, even after a failure. `drop` checks the owner, so a tree
      # another run took is left alone.
      - name: Drop the tree
        # `env.CHROMIUM != ''` because a build job that never got a tree
        # handed none over, and `drop` with no path is a usage error.
        if: ${{ always() && env.CHROMIUM != '' }}
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"

  # Drops the tree when the engine job did not, for example when the run was
  # canceled between jobs. `always()` makes it run on a canceled run, and
  # `drop` checks the owner.
  drop-tree:
    needs: [build, engine]
    if: ${{ always() && needs.build.outputs.chromium != '' && needs.engine.result != 'success' }}
    runs-on: [self-hosted, crux]
    # A checkout and an `rm`.
    timeout-minutes: 10
    env:
      CHROMIUM: ${{ needs.build.outputs.chromium }}
    steps:
      - uses: actions/checkout@v7
      - name: Drop the tree
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"
