name: Engine

# The Chromium fork, built and asserted on the one machine that can.
#
# `packages/domicile-engine` carries a patch series against a pinned Chromium.
# A clean build of it is 4h16m and 97G; an incremental one against a warm tree
# is 65s. No GitHub-hosted runner can hold that tree — the Actions cache is 10G
# per repository and the runners' disks are smaller than the checkout — so this
# job runs on `crux`, which has the tree, the GPU and the render node.
#
# Everything else in this repository still runs on `ubuntu-latest`. This job is
# the exception, and it is scoped to the paths that can affect the engine so
# that an ordinary change never waits on it.
on:
  push:
    branches: [main]
    # `.github/scripts/engine-*.sh` because the steps below are those scripts.
    # Without them a change to the reset, the lock or the diagnostics is a
    # change to this job that this job does not run on, and the first thing to
    # find out would be a release. Written out twice rather than anchored:
    # GitHub's workflow parser does not resolve YAML anchors.
    #
    # AND MARKDOWN UNDER THAT PACKAGE IS EXCLUDED, because prose cannot affect
    # a build and this job is the most expensive thing in the repository: it
    # takes the tree on `crux`, waits behind whatever else holds it, and can
    # queue for hours. A README fix should never be in that queue. The
    # exclusion is written after the include it narrows — a later pattern wins
    # for a file both match — so a change touching a patch *and* a README still
    # runs.
    paths:
      - packages/domicile-engine/**
      - "!packages/domicile-engine/**/*.md"
      - .github/workflows/engine.yml
      - .github/scripts/engine-*.sh
  pull_request:
    paths:
      - packages/domicile-engine/**
      - "!packages/domicile-engine/**/*.md"
      - .github/workflows/engine.yml
      - .github/scripts/engine-*.sh
  workflow_dispatch:

# Serialised, and never cancelled mid-flight.
#
# One runner is one job at a time, so this mostly queues rather than overlaps —
# but a cancelled `autoninja` leaves a half-linked `out/Domicile` that the next
# run inherits, and the failure it produces looks like a code error rather than
# an interrupted build. Waiting is cheaper than that.
concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  engine:
    # `crux` is a label, not the runner's name. Both are set in
    # cprussin/dotfiles: config/machines/crux/domicile-ci.nix.
    #
    # SECURITY, and it is not enforceable here: this runner executes as a real
    # user on a machine in a house, and this repository is public and forkable.
    # It is safe only while fork pull requests cannot run on it — Settings ->
    # Actions -> "Require approval for all external contributors".
    # Same-repository branches are the intended case and are what makes an
    # engine change reviewable before it merges — which is why this is on
    # `pull_request` and not only `push`, against the more cautious advice in
    # domicile-ci.nix. A pixel assertion that only runs after a merge is not a
    # check on the change, and the approval gate is the control either way.
    runs-on: [self-hosted, crux]

    # An incremental build is ~1m and the guard a few minutes more. The budget
    # is for the case this exists to survive: a pin roll, where the series
    # lands on a fresh upstream revision and the build is not incremental at
    # all.
    timeout-minutes: 360

    env:
      # The warm tree. Outside the workspace on purpose, and for a stronger
      # reason than "Actions wipes `_work` between runs": the runner unit's own
      # ExecStartPre deletes the whole work directory on every start, so
      # nothing that lives under the checkout survives a restart or a deploy.
      # Re-creating 97G is what this job is built to avoid.
      CHROMIUM: /build/chromium/src

      # Who holds the tree lock, in words a person reading a held-lock message
      # can act on: it names the workflow to look at and the run to open. The
      # attempt is in it because a re-run is a different holder — the first
      # attempt's `drop` and the second's `take` must not be able to agree.
      LOCK_OWNER: engine.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

      # `apply.sh` ends in `git am`, which writes commits, and git refuses to
      # write one without an identity. The runner's HOME is the work directory
      # — deleted and recreated on every start — so there is no ~/.gitconfig
      # and never will be, and the tree's own config has none either: it was
      # first patched by hand, by a person who had one.
      #
      # These are the env vars git reads before it looks at any config, so
      # nothing has to be written into a checkout that gets reset every run.
      GIT_AUTHOR_NAME: domicile CI
      GIT_AUTHOR_EMAIL: ci@domicile.invalid
      GIT_COMMITTER_NAME: domicile CI
      GIT_COMMITTER_EMAIL: ci@domicile.invalid

    steps:
      - uses: actions/checkout@v4

      # /tmp is this unit's, not this job's: PrivateTmp is per-service, and the
      # runner service outlives every job it runs. So a guard's log from the
      # last run is still there when the next one starts, and the failure dump
      # below will happily print it — which it did, for three reads of a job
      # that had failed before any guard ran. Numbers from a previous run are
      # worse than no numbers.
      - name: Forget the last run's logs
        run: rm -f /tmp/domicile-*.log

      # TWO SHELLS, AND WHICH ONE A STEP NEEDS IS NOT A DETAIL.
      #
      # Chromium's own toolchain shell (`$CHROMIUM/tools/nix`) supplies the
      # host tools `gn` probes for, and applying and building need it.
      #
      # Domicile's full shell (`.#full`) is what the pixel guard needs, and it
      # is not a superset: `engineRuntimeLibs` in flake.nix puts Chromium's
      # runtime libraries beside the GL stack, and the guard needs both. The GL
      # stack, or no client can hand the compositor a dmabuf at all; Chromium's,
      # or libdomicile_engine.so will not load. `guard-client-window.sh` says
      # so in its own header.
      #
      # `--command` does not work with Chromium's shell: upstream's is a
      # buildFHSEnv whose shellHook execs bwrap before nix's appended `exec` is
      # reached, so you land in an interactive bash having run nothing.
      # `NIX_SHELL_RUN` is upstream's own escape hatch for scripting it.
      # Domicile's shell is an ordinary mkShell, so `--command` is fine there.
      # See cprussin/dotfiles chromium-build.nix, which measured all of this.

      # ONE WRITER AT A TIME IN THAT CHECKOUT, and the reason is not the
      # obvious one. A reset that clobbers somebody's uncommitted work is loud,
      # and the reset step's diagnostic explains it. A reset that lands *during
      # their build* is silent: siso carries on and links a binary compiled
      # from two different trees. Taken here rather than around the reset,
      # because the tree stays ours until the last step that reads it.
      #
      # Nothing enforces this. It works because both writers take it. See
      # .github/scripts/engine-tree-lock.sh, which is also what a person on
      # `crux` runs before building in that tree by hand.
      - name: Take the tree
        run: .github/scripts/engine-tree-lock.sh take "$CHROMIUM" "$LOCK_OWNER"

      - name: Check the tree is at the pin this series expects
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')"
          echo "series expects $pin"
          git -C "$CHROMIUM" cat-file -e "$pin^{commit}" 2>/dev/null || {
            echo "::error::$CHROMIUM has no commit $pin. Roll the checkout forward by hand:" >&2
            echo "  git -C $CHROMIUM fetch origin && gclient sync" >&2
            exit 1
          }

      # In a script, and shared with engine-release.yml, which resets the same
      # tree for the same reason. The two copies of this had already drifted in
      # the order of their steps; a third copy is what the script prevents. It
      # also carries the diagnostic for a tree that is still dirty afterwards,
      # which is long because the cause is not visible from the symptom.
      - name: Reset the checkout to the pin
        run: .github/scripts/engine-reset.sh "$CHROMIUM"

      # NOT through Chromium's shell, and that was a mistake worth naming.
      #
      # This step used to enter it with NIX_SHELL_RUN, copied from the build
      # step below without asking whether it needed to. `apply.sh` is `git`,
      # `grep`, `cp` and `find` — every one of them already on this unit's
      # PATH, and not one of them a Chromium host tool. What the wrapper bought
      # was a sandbox that swallowed the script's exit status AND its output:
      # five runs failed here saying nothing, and three more were spent
      # building instruments to find out what.
      #
      # Run directly, the exit status is this step's and the error is in this
      # log. The HEAD check stays anyway: `git am` commits each patch, so a
      # HEAD still at the pin means the series did not go on, and that is worth
      # asserting rather than inferring from an exit code.
      - name: Apply the series
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')"
          packages/domicile-engine/scripts/apply.sh "$CHROMIUM"
          [ "$(git -C "$CHROMIUM" rev-parse HEAD)" != "$pin" ] || {
            echo "::error::apply.sh succeeded but the checkout is still at the pin, so no patch was applied" >&2
            exit 1
          }
          echo "series applied: $(git -C "$CHROMIUM" log --oneline "$pin..HEAD" | wc -l) patches"

      # `build.sh` builds `chrome` and the spike's submitter. The guard also
      # needs `libdomicile_engine.so` — the compositor dlopens it by name — and
      # the step below needs `components_unittests`, so both are named here
      # rather than in `build.sh`, which is what a person runs by hand and
      # should stay the small thing.
      #
      # `components_unittests` is a large link. Domicile's tests are a
      # `source_set` that patch 0001 registers into it, which is Chromium's own
      # convention for a component's tests; the alternative is a `test()` target
      # of our own, and that is worth doing only if this link turns out to
      # dominate the run.
      # THE SHELL HAS TO PROVE IT RAN THE COMMAND.
      #
      # `NIX_SHELL_RUN` is upstream's documented escape hatch for scripting
      # this shell, and it was measured working — by a person, at a terminal.
      # In CI this step returned success in one second, which is not a Chromium
      # build of any kind, and the artifact check below is what noticed. A
      # shell that silently runs nothing is the same failure as the apply step
      # above, one layer along.
      #
      # So the command writes a sentinel and the step checks for it. If the
      # documented mechanism did not run, the commands are piped in on stdin
      # instead — which is what reaches a `runScript` that turned out to be
      # a plain bash — and the sentinel is checked again. Whichever worked,
      # the artifact check after this is still the thing that decides.
      - name: Build
        run: |
          set -euo pipefail
          done=/tmp/domicile-build-ran
          rm -f "$done"

          # `<nixpkgs>` has to resolve or the shell builds nothing:
          # tools/nix/shell.nix imports it, and a systemd service has no
          # NIX_PATH — that is something NixOS arranges for an interactive
          # user, and this unit is not one. Without it nix-shell says "uses
          # bash from your environment" and hands the script an ambient shell
          # with no toolchain in it.
          #
          # From the flake registry rather than written down, because the
          # registry is what pins nixpkgs on this machine and a second copy of
          # that pin here would be a second thing to keep true.
          nixpkgs="$(nix eval --raw --impure --expr '(builtins.getFlake "nixpkgs").outPath')"
          echo "nixpkgs is $nixpkgs"
          export NIX_PATH="nixpkgs=$nixpkgs"

          # `nix-shell` with the shell.nix, which is the form under-wayland.sh
          # and guard-client-window.sh use and the only one that has ever run
          # on this machine. `nix develop path:` wants a flake.nix and this
          # directory ships a shell.nix; it entered nothing and exited 0, which
          # was indistinguishable from success until the sentinel existed.
          #
          # A path, not a command: everything in NIX_SHELL_RUN is re-quoted
          # twice on its way in.
          if NIX_SHELL_RUN="$GITHUB_WORKSPACE/.github/scripts/engine-build.sh $CHROMIUM $done" \
               nix-shell "$CHROMIUM/tools/nix/shell.nix" >/tmp/domicile-shell.log 2>&1; then
            echo "the shell exited 0"
          else
            echo "the shell exited $?"
          fi
          tail -25 /tmp/domicile-shell.log | sed 's/^/  | /'

          [ -e "$done" ] || {
            echo "::error::Chromium's shell did not run the build; its last words are above" >&2
            exit 1
          }

      # WHETHER THE BUILD ABOVE ACTUALLY BUILT, asked out here rather than
      # trusted from in there.
      #
      # `nix develop` is entered with NIX_SHELL_RUN because upstream's shell is
      # a buildFHSEnv whose shellHook execs bwrap — and a command run that way
      # does not reliably carry its exit status back out. A failed `autoninja`
      # can therefore leave this step green, and what runs next is then the
      # previous build: the guards load a `libdomicile_engine.so` that is
      # older than the source they were changed to test.
      #
      # That is not a hypothetical. It is what happened: the two-window guard
      # spent five runs reporting that nothing drew, because the library it
      # loaded had been built before the probe grew a coordinate, and the
      # compositor's `dlsym` for the new entry point returned nothing.
      #
      # The symbols are matched as bytes rather than with `nm`, which is not on
      # this unit's PATH out here. A name absent from the file is certainly not
      # exported from it, which is the direction that matters.
      - name: The build produced what the guards load
        run: |
          set -euo pipefail
          out="$CHROMIUM/out/Domicile"
          for artefact in chrome libdomicile_engine.so components_unittests \
                          domicile_css_parity; do
            [ -e "$out/$artefact" ] || {
              echo "::error::the build produced no $artefact" >&2
              exit 1
            }
          done
          ls -l "$out/chrome" "$out/libdomicile_engine.so"

          missing=""
          for symbol in domicile_engine_connect \
                        domicile_engine_spike_sample_window_center \
                        domicile_engine_spike_sample_pixel \
                        domicile_engine_spike_find_colour; do
            grep -qa "$symbol" "$out/libdomicile_engine.so" || missing="$missing $symbol"
          done
          [ -z "$missing" ] || {
            echo "::error::libdomicile_engine.so is missing:$missing — it is older than the source. The build did not fail loudly enough." >&2
            exit 1
          }
          echo "libdomicile_engine.so exports what the compositor looks up"

      # The browser's own unit tests. These are the cheapest thing that can
      # fail and the only ones that exercise the broker's bookkeeping directly
      # — a surface brokered per app, an embed held for the app it names — so
      # they run before the pixel assertion, which takes longer and says less
      # about why.
      #
      # Filtered rather than run whole: `components_unittests` is every
      # component's tests, and the rest of them are upstream's business.
      #
      # From the full shell and from inside the out directory, for the same two
      # reasons: this is a component build, so the binary loads its own .so
      # files from beside it, and the shell is where Chromium's runtime
      # libraries are. `#full` is spelled against $GITHUB_WORKSPACE rather than
      # `.` because this step is not in the workspace.
      - name: The engine's unit tests
        working-directory: /build/chromium/src/out/Domicile
        run: |
          set -euo pipefail
          filter='FrameSinkBrokerTest.*:WindowDiffTest.*:EngineEventQueueTest.*'
          # `--gtest_filter` matching nothing exits 0, so a suite that was
          # renamed or never linked would be a silent pass. Test names are the
          # indented lines of --gtest_list_tests; suite names are not.
          count=$(nix develop "$GITHUB_WORKSPACE#full" --command \
            ./components_unittests --gtest_filter="$filter" --gtest_list_tests |
            grep -cE '^  ' || true)
          echo "$count tests match $filter"
          # 11 in FrameSinkBrokerTest alone at the time of writing.
          [ "$count" -ge 11 ] || {
            echo "::error::only $count tests matched; the suites were renamed or did not link" >&2
            exit 1
          }
          nix develop "$GITHUB_WORKSPACE#full" --command \
            ./components_unittests --gtest_filter="$filter"

      # The guard's producer. Built here rather than by the script, which only
      # checks for it — and the runner deletes its work directory when the
      # unit starts, so the first job after every restart or deploy finds no
      # `target/` at all. Later jobs in the same session do reuse it.
      - name: Build the compositor
        run: nix develop .#full --command cargo build -p domicile-compositor

      # The guard. A real Wayland client draws a colour, the compositor submits
      # its buffer to the engine, and the page's canvas is read back — the one
      # check that says a client's own pixels reach the page.
      #
      # `under-wayland.sh` starts a headless wlroots compositor for the engine
      # to be a client of, because `--ozone-platform=headless` cannot import a
      # dmabuf at all.
      - name: A client's window on the page
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-client-window.sh "$CHROMIUM"

      # A guard that cannot fail is not a guard. The same run with no client
      # must report that nothing drew.
      - name: The guard can still fail
        env:
          NEGATIVE: "1"
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-client-window.sh "$CHROMIUM"

      # Two clients, two windows, one page — the claim the broker's unit tests
      # cannot make for themselves. They assert that two apps get two sinks;
      # whether viz then resolves two SurfaceDrawQuads in one aggregation is a
      # different question, and a shell is a desktop of windows.
      - name: Two clients' windows on one page
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-two-windows.sh "$CHROMIUM"

      # Its control is sharper than the one above, and it is the one that would
      # have caught the heuristic this replaced: with a single client running,
      # the second canvas must show its own fallback rather than the first
      # client's window. A broker that dispatched on nothing would pass the
      # two-client run and fail this.
      - name: The second window is not the first
        env:
          NEGATIVE: "1"
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-two-windows.sh "$CHROMIUM"

      # And the thing all of the above is for. Every guard before it drives a
      # page written for the guard; this one drives shell-simple, built by its
      # own vite config, joined to the compositor by the SDK's own
      # `connectToHost` over a WebSocket to the bridge serving it, and
      # mounting a `<domicile-app>` for a window it learned about from the
      # host. Three things that have each failed on their own, and none of
      # which any other guard touches.
      #
      # It asserts that the client's colour is somewhere in the browser's
      # window rather than at a point, because the shell decides where its
      # windows go and a coordinate here would be asserting shell-simple's CSS.
      - name: A shell on the fork, showing a real client's window
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-shell.sh "$CHROMIUM"

      # Its control: the same run with the client drawing a different colour.
      # Not "no client", because the probe only runs when a client commits, so
      # a run with nothing to submit would pass while measuring nothing.
      - name: The shell guard is looking at the client's pixels
        env:
          NEGATIVE: "1"
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-shell.sh "$CHROMIUM"

      # The other shell, and the reason it is here rather than assumed: nothing
      # about `simple` passing says `manganese` does. It is the desktop this
      # project is actually for, and it is built from a different page — a
      # component library consumed as source, with its own panda codegen — so
      # `build:vite`'s `^prepare` edge is load-bearing for it in a way it is
      # not for `simple`. A shell that fails to build is a shell that shows
      # nothing.
      #
      - name: The desktop this is for, on the fork
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-shell.sh "$CHROMIUM" manganese

      # AND ITS OWN CONTROL, which the first version of this argued was not
      # needed because a control is a property of the guard and `simple`'s
      # establishes it for both. That is wrong, and it is wrong in the
      # direction that matters. `engine found` is satisfied by a single pixel
      # of the colour anywhere in the browser's window, so what a control
      # actually establishes is a joint fact about the guard AND the page under
      # it: that this page does not paint the search colour by itself.
      # `simple`'s page is a bare desktop and cannot; manganese's is a whole
      # component library with tokens derived by `color-mix`, and a run where
      # the client's window never lands but one chrome pixel matches is green
      # with nothing measured. This is the step that says otherwise, and it is
      # not interchangeable with the other one.
      - name: The manganese guard is looking at the client's pixels
        env:
          NEGATIVE: "1"
        run: |
          set -euo pipefail
          nix develop .#full --command \
            packages/domicile-engine/scripts/under-wayland.sh "$CHROMIUM" \
            packages/domicile-engine/scripts/guard-shell.sh "$CHROMIUM" manganese

      # REQUIREMENT 2, WHICH NOTHING HAS RUN SINCE IT WAS WRITTEN. An <app> has
      # to behave like any other replaced element, and `guard-css-and-resize.sh` is what
      # measures that: six CSS properties applied to an <app> and to an
      # ordinary <div> laid out identically beside it, and then a resize, which
      # gets a page of its own because it moves the LocalSurfaceId every
      # element in a document shares. It has only ever been run by hand.
      #
      # Inside Chromium's own toolchain shell, not `nix develop .#full`, and
      # that is what `spike.sh` documents: a component build links against that
      # shell's glibc. The sentinel is the Build step's, for the reason the
      # Build step has one — this shell has swallowed an exit status before,
      # and a step that believed it would report a measurement nobody took.
      #
      # Headless and software-composited, which is `spike.sh`'s default and
      # needs no nested compositor: what it compares is what the display
      # compositor drew for two elements on one page, and neither needs a GPU
      # to be laid out. ENGINE-FORK.md's `--disable-gpu` table is the one this
      # step reproduces — six cells bit-exact, `transform` differing on 285
      # edge pixels and 0 interior ones, which is two software raster passes
      # disagreeing in the last bit. The verdict is on interior pixels for
      # exactly that reason, so those 285 are a pass here and every cell is 0
      # on the GPU. Which is what makes a failure the seam rather than the
      # hardware, and the only reading that makes the step worth having.
      - name: An <app> is a replaced element, and a resize reaches the producer
        run: |
          set -euo pipefail
          done=/tmp/domicile-step4-ran
          rm -f "$done"
          nixpkgs="$(nix eval --raw --impure --expr '(builtins.getFlake "nixpkgs").outPath')"
          export NIX_PATH="nixpkgs=$nixpkgs"

          cat > /tmp/domicile-step4 <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          "$GITHUB_WORKSPACE/packages/domicile-engine/scripts/guard-css-and-resize.sh" "$CHROMIUM"
          touch "$done"
          EOF
          chmod +x /tmp/domicile-step4

          if NIX_SHELL_RUN=/tmp/domicile-step4 \
               nix-shell "$CHROMIUM/tools/nix/shell.nix" >/tmp/domicile-step4-shell.log 2>&1; then
            echo "the shell exited 0"
          else
            echo "the shell exited $?"
          fi
          # Not 60. A clean run is about that long on its own — a header, one
          # `embedded` line per canvas, the per-property table, the latency
          # block, then the whole resize run again — so any chatter from the
          # shell pushes the table, which is the only place the verdict lives,
          # off the top of what gets printed.
          tail -200 /tmp/domicile-step4-shell.log | sed 's/^/  | /'

          [ -e "$done" ] || {
            # `guard-css-and-resize.sh` says which half failed and why, because it
            # is the thing that knows: it holds the two exit statuses and each
            # half's own log. Three versions of this step tried to work that
            # out here instead, from one grep over the pair, and review found
            # each of them naming the wrong end — including `grep -v … |
            # grep -q …` losing to SIGPIPE under `pipefail` past about 128 KB
            # of log and routing a real cell failure to the catch-all. So this
            # quotes rather than classifies, and the only sentence it owns is
            # the one for a run that never got as far as saying anything.
            #
            # `|| :` because this step runs under `set -euo pipefail` and a
            # grep that matches nothing exits 1 — which killed the shell here,
            # on the assignment, before the `if` below could print the one
            # sentence this step owns. That is the same class of mistake as the
            # SIGPIPE one above, one line lower down, and it made the fallback
            # unreachable: a run that said nothing got no annotation at all.
            said="$( { grep -a '^step 4 failed:' /tmp/domicile-step4-shell.log ||
                         :; } | tail -1)"
            if [ -n "$said" ]; then
              echo "::error::$said" >&2
            else
              echo "::error::step 4 never reached its own verdict — the producer did not finish, or the shell around it did not start. Its last words are above" >&2
            fi
            exit 1
          }

      # Everything the guard writes down, because none of it is on stdout.
      #
      # `under-wayland.sh` sends sway's output to a file and then says only "no
      # compositor came up"; `guard-client-window.sh` keeps the compositor's
      # log because it is the only place that says which app id a surface was
      # brokered under, and a failure there is usually a mismatch. Under
      # `PrivateTmp=true` both are inside the runner unit's own /tmp, so they
      # are unreachable once the job ends — they have to be printed here or
      # they are lost.
      # In a script, not inline. GitHub echoes every step's script into the
      # log before running it, so forty lines of dump here is forty lines
      # between a failure and the end of the log — which is exactly where a
      # failure gets read from, and it cost four fetches to notice.
      - name: What the guard wrote down
        if: ${{ failure() }}
        run: .github/scripts/engine-diagnostics.sh

      # Even when something above failed, and *only* if it is still ours: the
      # step that fails because the lock is held by somebody else reaches here
      # too, and an unconditional `rm` there would release their tree in the
      # middle of their build.
      - name: Drop the tree
        if: ${{ always() }}
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"
