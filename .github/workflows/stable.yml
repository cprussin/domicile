name: Stable

# Move `stable` to the newest main that runs the official engine, so
# `nix run github:cprussin/domicile/stable#manganese` never gets the checked
# engine. See .github/scripts/promote-stable.sh. engine-release.yml's official
# pin lands on main as its own merge, which runs this too.
#
# Each commit stable moves to is packaged for other distributions and
# released (distro-packages.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, so two pushes never race for the ref. The newest pending run
# is kept, and it promotes the newest main.
concurrency:
  group: stable
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      # The whole history, so stable can be checked as an ancestor of main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: promote
        run: .github/scripts/promote-stable.sh

  packages:
    needs: promote
    if: needs.promote.outputs.promoted != ''
    uses: ./.github/workflows/distro-packages.yml
    with:
      ref: ${{ needs.promote.outputs.promoted }}
      publish: true
