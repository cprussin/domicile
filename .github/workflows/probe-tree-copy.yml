# Temporary: removes the partial copy the tree-copy probe left on crux.
name: probe tree copy cleanup
on:
  push:
    branches: [claude/project-thread-04t7b9]
permissions:
  contents: read
jobs:
  clean:
    strategy:
      matrix:
        n: [1, 2]
    runs-on: [self-hosted, crux]
    timeout-minutes: 30
    steps:
      - name: Remove the partial copy
        run: |
          rm -rf /build/trees/tree-0/.probe /build/trees/tree-1/.probe
          df -h /build
