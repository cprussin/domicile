name: Nix build
on:
  pull_request:
  push:
    branches: [main]

# A full Electron and mesa closure per run; a superseded push should not keep
# fetching one.
concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only check that builds what a *user* installs.
  #
  # Every other job here is the checkout arrangement: `cargo test` and `turbo
  # test` against the working tree, `e2e` driving scripts out of it. None of
  # them would notice the flake breaking, and two things in it are guaranteed
  # to break on their own schedule rather than when someone edits them:
  #
  #  - `nodeModules`'s `outputHash` goes stale the next time `bun.lock` moves,
  #    and nothing in a checkout build reads it. Without this job the first
  #    person to find out is whoever ran `nix profile install`.
  #  - `bun install` is not deterministic, which is why that derivation
  #    normalises its tree before hashing. A regression there is a hash that is
  #    right most of the time — exactly the shape that reaches a user rather
  #    than a reviewer.
  #
  # It is also the only check that runs an installed shell at all — bundles
  # with no `node_modules` beside them, found through the stub's own idea of
  # where it lives. That takes actually starting one, which is what the
  # `DOMICILE_COMPOSITOR=/bin/false` step below is for: a build that succeeds
  # says the derivation ran, and file existence says what it wrote, but
  # neither would notice a bundle that cannot resolve its own imports.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Named rather than `nix build` on its own: there is no default output,
      # and that is the subject of this job as much as anything else — a
      # `packages.default` appearing would make `nix build` build something,
      # which is the arrangement this flake exists to refuse.
      - name: Build both shells
        run: nix build --print-build-logs .#manganese .#simple

      # After the build, which is what gives this something to compare
      # against: `--check` rebuilds an existing output, and errors rather
      # than building one that is not there yet.
      #
      # The one derivation whose output is not a function of its inputs, so
      # the only one where "it built" is not evidence it builds. `bun install`
      # is not deterministic — it was measured at about one differing run in
      # six before its tree was normalised — and one build per push would
      # notice a regression one time in six. `--check` rebuilds it and
      # compares, which is the thing that actually fails.
      - name: The dependency tree is reproducible
        run: |
          set -eu
          drv="$(nix path-info --derivation .#simple)"
          nix-store --realise --check \
            "$(nix-store -qR "$drv" | grep 'domicile-node-modules.*\.drv$' | head -1)"

      # WHAT AN INSTALLED DESKTOP HAS TO CONTAIN, and this changed shape with
      # the packages themselves. It used to assert the four Electron bundles
      # and a launcher that refused arguments, because that is what a desktop
      # was: an Electron application. It is a runner now — the page, the
      # engine, the compositor and the bridge, handed to `run-engine.sh` — and
      # a check still asserting `launch.js` would be asserting the thing that
      # was removed.
      #
      # What it asserts instead is that every store path the runner names is
      # really there. That is the failure this replaces: a derivation that
      # stopped being referenced, or one referenced by a path that does not
      # exist, produces a desktop that starts and then dies on whichever of the
      # four it reaches first — which reads as the seam rather than as wiring.
      - name: Check what was installed
        run: |
          set -eu
          for name in manganese simple; do
            out="$(nix build --no-link --print-out-paths ".#$name")"
            [ -x "$out/bin/$name" ] || {
              echo "$name: no bin/$name in $out"
              exit 1
            }
            # Every `/nix/store/...` the wrapper names, which is the four
            # inputs and whatever they are reached through. The closing brace
            # and the colon are in the stop set because these sit inside
            # `${VAR:-/nix/store/...}` and on `PATH`, and without them the
            # first version of this check read the brace as part of the path
            # and reported every one of them missing. `sort -u` because the
            # same path is named more than once.
            paths="$(grep -oE '/nix/store/[a-z0-9]{32}-[^"'"'"'}: ]*' \
                       "$out/bin/$name" | sort -u)"
            [ -n "$paths" ] || {
              echo "$name: names no store paths at all, so it cannot be a"
              echo "  desktop — it has nothing to start"
              exit 1
            }
            for path in $paths; do
              [ -e "$path" ] || {
                echo "$name: names $path, which is not in the store"
                exit 1
              }
            done
            # The four by role, so a missing one says which. `DOMICILE_ENGINE`
            # has to be a directory with a `chrome` in it; the others are
            # checked by the derivations that build them.
            for want in DOMICILE_PAGE DOMICILE_ENGINE DOMICILE_COMPOSITOR \
                        DOMICILE_BRIDGE; do
              grep -q "$want=" "$out/bin/$name" || {
                echo "$name: does not set $want, so run-engine.sh would build"
                echo "  or look for that one itself"
                exit 1
              }
            done
          done

      # The assertion that needs the bundles to actually load.
      #
      # Everything above is `[ -e ]` and a stub that exits in `/bin/sh` before
      # Node starts. This runs the launcher for real and lets it fail on the
      # *compositor* — which it only reaches by resolving every import in
      # `launch.js` with no `node_modules` anywhere near it. A dependency left
      # external instead of bundled dies before this message, which is exactly
      # the bug that shipped once already.
      - name: An installed shell loads its own bundles
        run: |
          set -eu
          for name in manganese simple; do
            out="$(nix build --no-link --print-out-paths ".#$name")"
            DOMICILE_COMPOSITOR=/bin/false "$out/bin/$name" 2>&1 |
              grep -q "the compositor never published a session" || {
                echo "$name: the launcher did not get as far as its compositor"
                exit 1
              }
          done
