name: Nix build

# Build everything the flake produces.
#
# No `paths:` filter. engine.yml ignores changes to
# `packages/domicile-engine/engine-release.nix`, because a repin cannot change
# what it builds. This job covers a repin instead: `nix build .#manganese
# .#simple` fetches the url and hash in that file, so a deleted tag or bad hash
# fails here in minutes. `packages/ci/tests/test-engine-path-filter.sh` fails if this job
# gains a `paths:` filter.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nix is installed below, so a skip means a `test:nix` check broke.
  # No skips are expected.
  DOMICILE_CHECK_STRICT: "1"

jobs:
  packages:
    runs-on: ubuntu-latest
    # Includes the tty VM test (`tty-on-a-card-with-no-3d` in flake.nix).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The runner's /dev/kvm is root's. Opened before nix is installed, so
      # nix sees the `kvm` feature the VM test asks for.
      - name: Let the VM test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # The assertions are `distro-checks`' `test:nix`, so they can also be run
      # from a checkout. Bun is here only to run turbo; a nix build has its own
      # node_modules.
      - uses: oven-sh/setup-bun@v2
      - run: ./scripts/check.sh nix
