name: Nix build
on:
  pull_request:
  push:
    branches: [main]

# A full engine and mesa closure per run; a superseded push should not keep
# fetching one.
concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only check that builds what a *user* installs.
  #
  # Every other job here is the checkout arrangement: `cargo test` and `turbo
  # test` against the working tree, `e2e` driving scripts out of it. None of
  # them would notice the flake breaking, and two things in it are guaranteed
  # to break on their own schedule rather than when someone edits them:
  #
  #  - `nodeModules`'s `outputHash` goes stale the next time `bun.lock` moves,
  #    and nothing in a checkout build reads it. Without this job the first
  #    person to find out is whoever ran `nix profile install`.
  #  - `bun install` is not deterministic, which is why that derivation
  #    normalises its tree before hashing. A regression there is a hash that is
  #    right most of the time — exactly the shape that reaches a user rather
  #    than a reviewer.
  #
  # It is also the only check that runs an installed desktop at all. A build
  # that succeeds says the derivation ran, and file existence says what it
  # wrote — neither would notice a `domicile` that cannot find the three
  # programs laid out beside it. The steps below are what start one.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Named rather than `nix build` on its own: there is no default output,
      # and that is the subject of this job as much as anything else — a
      # `packages.default` appearing would make `nix build` build something,
      # which is the arrangement this flake exists to refuse.
      - name: Build both shells
        run: nix build --print-build-logs .#manganese .#simple

      # After the build, which is what gives this something to compare
      # against: `--check` rebuilds an existing output, and errors rather
      # than building one that is not there yet.
      #
      # The one derivation whose output is not a function of its inputs, so
      # the only one where "it built" is not evidence it builds. `bun install`
      # is not deterministic — it was measured at about one differing run in
      # six before its tree was normalised — and one build per push would
      # notice a regression one time in six. `--check` rebuilds it and
      # compares, which is the thing that actually fails.
      - name: The dependency tree is reproducible
        run: |
          set -eu
          drv="$(nix path-info --derivation .#simple)"
          nix-store --realise --check \
            "$(nix-store -qR "$drv" | grep 'domicile-node-modules.*\.drv$' | head -1)"

      # WHAT AN INSTALLED DESKTOP HAS TO CONTAIN, and this changed shape with
      # the packages themselves. It used to assert four environment variables
      # in a generated shell script, because that is what a desktop was: a
      # wrapper that named the page, the engine, the compositor and the bridge
      # and handed them to a script. It is `domicile` with a page for an
      # argument now, and `domicile` finds the other three beside itself — so
      # what has to be checked is the layout rather than a wrapper's text.
      #
      #   bin/domicile
      #   bin/domicile-compositor
      #   libexec/domicile/engine     the Chromium tree, `chrome` inside it
      #   libexec/domicile/bridge     the page server
      #
      # THE ONE THAT IS NOT A TAUTOLOGY: `bin/domicile` must be a *copy*.
      # `current_exe` reads `/proc/self/exe`, which resolves symlinks, so a
      # `bin/domicile` symlinked into the Rust derivation would report that
      # derivation's path — where there is no `libexec` and never will be. It
      # builds, it installs, and it refuses to start. `ln -s` instead of `cp`
      # is one character and nothing else here would see it.
      - name: Domicile is laid out so it can find the rest of itself
        run: |
          set -eu
          out="$(nix build --no-link --print-out-paths .#domicile)"
          [ -x "$out/bin/domicile" ] || {
            echo "domicile: no bin/domicile in $out"
            exit 1
          }
          [ ! -L "$out/bin/domicile" ] || {
            echo "domicile: bin/domicile is a symlink, so \`current_exe\` will"
            echo "  resolve it into a derivation with no libexec beside it and"
            echo "  the desktop will refuse to start. Copy it."
            exit 1
          }
          [ -x "$out/bin/domicile-compositor" ] || {
            echo "domicile: no bin/domicile-compositor beside the binary"
            exit 1
          }
          [ -x "$out/libexec/domicile/engine/chrome" ] || {
            echo "domicile: libexec/domicile/engine holds no chrome"
            exit 1
          }
          [ -x "$out/libexec/domicile/bridge" ] || {
            echo "domicile: libexec/domicile/bridge is not something that runs"
            exit 1
          }

      # And a desktop is that, with the page already chosen. Every
      # `/nix/store/...` the wrapper names has to be in the store: the binary
      # it `exec`s and the page it hands over, and nix checks a path rather
      # than what is in it.
      - name: Check what was installed
        run: |
          set -eu
          for name in manganese simple; do
            out="$(nix build --no-link --print-out-paths ".#$name")"
            [ -x "$out/bin/$name" ] || {
              echo "$name: no bin/$name in $out"
              exit 1
            }
            # The closing brace and the colon are in the stop set because these
            # sit inside shell expansions and on `PATH`, and without them the
            # first version of this check read the brace as part of the path
            # and reported every one of them missing.
            paths="$(grep -oE '/nix/store/[a-z0-9]{32}-[^"'"'"'}: ]*' \
                       "$out/bin/$name" | sort -u)"
            [ -n "$paths" ] || {
              echo "$name: names no store paths at all, so it cannot be a"
              echo "  desktop — it has nothing to start"
              exit 1
            }
            for path in $paths; do
              [ -e "$path" ] || {
                echo "$name: names $path, which is not in the store"
                exit 1
              }
            done
            printf '%s\n' "$paths" | grep -q "domicile-page-$name" || {
              echo "$name: names no page of its own, so it is not a desktop"
              exit 1
            }
          done

      # THE ASSERTIONS THAT NEED THE BINARY TO ACTUALLY RUN, and neither needs
      # a display — because `domicile` resolves its three components before it
      # looks at the page. So a run given a page that cannot exist fails about
      # *the page*, and that failure is the proof the other three were found:
      # a symlinked or mislaid component fails first, and says which.
      - name: An installed Domicile finds its components before its page
        run: |
          set -eu
          out="$(nix build --no-link --print-out-paths .#domicile)"
          said="$("$out/bin/domicile" /there-is-no-such-shell 2>&1 || true)"
          case "$said" in
            (*"no shell at '/there-is-no-such-shell'"*) ;;
            (*) echo "domicile: did not get as far as looking at the page:"
                echo "$said"
                exit 1 ;;
          esac
          # Given nothing at all it says what to type. Asserted because the
          # binary cannot be run where it is written — the flake's own
          # `bun install` derivation needs a network the dev container does not
          # have — so this job is the only place the built thing is started.
          "$out/bin/domicile" 2>&1 | grep -q "which shell?" || {
            echo "domicile: given no shell, it did not say so"
            exit 1
          }

          # And a desktop refuses a word it has nowhere to put. The page is
          # already the argument, so anything the user types arrives as a
          # second one — dropping it hands somebody manganese while they read
          # `simple` on their own command line.
          for name in manganese simple; do
            out="$(nix build --no-link --print-out-paths ".#$name")"
            "$out/bin/$name" --nope 2>&1 | grep -q "too many arguments" || {
              echo "$name: took an argument it has nothing to do with"
              exit 1
            }
          done
