name: Nix build
on:
  pull_request:
  push:
    branches: [main]

# A full engine and mesa closure per run; a superseded push should not keep
# fetching one.
concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only check that builds what a *user* installs.
  #
  # Every other job here is the checkout arrangement: `cargo test` and `turbo
  # test` against the working tree, `e2e` driving scripts out of it. None of
  # them would notice the flake breaking, and two things in it are guaranteed
  # to break on their own schedule rather than when someone edits them:
  #
  #  - `nodeModules`'s `outputHash` goes stale the next time `bun.lock` moves,
  #    and nothing in a checkout build reads it. Without this job the first
  #    person to find out is whoever ran `nix profile install`.
  #  - `bun install` is not deterministic, which is why that derivation
  #    normalises its tree before hashing. A regression there is a hash that is
  #    right most of the time — exactly the shape that reaches a user rather
  #    than a reviewer.
  #
  # It is also the only check that runs an installed desktop at all. A desktop
  # is a wrapper naming four store paths, and a build that succeeds says the
  # derivation ran while file existence says what it wrote — neither would
  # notice a wrapper that names them and still cannot start. The two steps
  # below are what start one: the first that every path it names is in the
  # store, the second that it gets far enough to look for its compositor.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Named rather than `nix build` on its own: there is no default output,
      # and that is the subject of this job as much as anything else — a
      # `packages.default` appearing would make `nix build` build something,
      # which is the arrangement this flake exists to refuse.
      - name: Build both shells
        run: nix build --print-build-logs .#manganese .#simple

      # After the build, which is what gives this something to compare
      # against: `--check` rebuilds an existing output, and errors rather
      # than building one that is not there yet.
      #
      # The one derivation whose output is not a function of its inputs, so
      # the only one where "it built" is not evidence it builds. `bun install`
      # is not deterministic — it was measured at about one differing run in
      # six before its tree was normalised — and one build per push would
      # notice a regression one time in six. `--check` rebuilds it and
      # compares, which is the thing that actually fails.
      - name: The dependency tree is reproducible
        run: |
          set -eu
          drv="$(nix path-info --derivation .#simple)"
          nix-store --realise --check \
            "$(nix-store -qR "$drv" | grep 'domicile-node-modules.*\.drv$' | head -1)"

      # WHAT AN INSTALLED DESKTOP HAS TO CONTAIN, and this changed shape with
      # the packages themselves. It used to assert the four Electron bundles
      # and a launcher that refused arguments, because that is what a desktop
      # was: an Electron application. It is a runner now — the page, the
      # engine, the compositor and the bridge, handed to `run-engine.sh` — and
      # a check still asserting `launch.js` would be asserting the thing that
      # was removed.
      #
      # What it asserts instead is that every store path the runner names is
      # really there. Most of those are near-tautological — a path interpolated
      # into the wrapper is a build-time input `nix build` has already realised
      # — and it is worth saying which two are not: `${self}/scripts/`
      # `run-engine.sh` and `${domicileBridge}/…/main.ts` name *files inside*
      # store paths, and nix checks the path rather than what is in it. A
      # rename on either side leaves a wrapper that starts and dies on
      # whichever it reaches first, which reads as the seam rather than as
      # wiring.
      #
      # What it does not catch, despite an earlier version of this comment: a
      # derivation that stopped being referenced contributes no path, so the
      # loop cannot see one.
      - name: Check what was installed
        run: |
          set -eu
          for name in manganese simple; do
            out="$(nix build --no-link --print-out-paths ".#$name")"
            [ -x "$out/bin/$name" ] || {
              echo "$name: no bin/$name in $out"
              exit 1
            }
            # Every `/nix/store/...` the wrapper names, which is the four
            # inputs and whatever they are reached through. The closing brace
            # and the colon are in the stop set because these sit inside
            # `${VAR:-/nix/store/...}` and on `PATH`, and without them the
            # first version of this check read the brace as part of the path
            # and reported every one of them missing. `sort -u` because the
            # same path is named more than once.
            paths="$(grep -oE '/nix/store/[a-z0-9]{32}-[^"'"'"'}: ]*' \
                       "$out/bin/$name" | sort -u)"
            [ -n "$paths" ] || {
              echo "$name: names no store paths at all, so it cannot be a"
              echo "  desktop — it has nothing to start"
              exit 1
            }
            for path in $paths; do
              [ -e "$path" ] || {
                echo "$name: names $path, which is not in the store"
                exit 1
              }
            done
            # The four by role, so a missing one says which. That each is the
            # right *kind* of thing is the business of the derivation that
            # builds it — `domicileEngine`'s own `installCheckPhase` is what
            # says its output has a `chrome` in it.
            for want in DOMICILE_PAGE DOMICILE_ENGINE DOMICILE_COMPOSITOR \
                        DOMICILE_BRIDGE; do
              grep -q "$want=" "$out/bin/$name" || {
                echo "$name: does not set $want, so run-engine.sh would build"
                echo "  or look for that one itself"
                exit 1
              }
            done
          done

      # THE ASSERTION THAT NEEDS THE WRAPPER TO ACTUALLY RUN.
      #
      # Everything above is `[ -e ]` against a path. This starts the desktop
      # for real and lets it fail on the compositor, which it reaches only by
      # resolving `run-engine.sh` out of the store — so a wrapper that names
      # its four inputs correctly and still cannot start says so here rather
      # than on somebody's machine.
      #
      # A path that cannot exist rather than `/bin/false`, which is a real
      # executable — the runner would start it, watch it exit, and fail further
      # along for a reason this step is not asking about.
      #
      # Reaching the compositor means passing the engine, its library and the
      # page first, so those three are covered here as well as by the `[ -e ]`
      # loop above. The bridge is not, and cannot be: `run-engine.sh` checks it
      # *after* the compositor, so this run has already exited by the time it
      # would matter — and a second run that got past the compositor would
      # start a browser. That the wrapper names a bridge that exists is the
      # `[ -e ]` loop's business; that `run-engine.sh` uses the one it is
      # handed rather than looking for a checkout is
      # `scripts/test-run-engine-inputs.sh`, which is where deleting
      # `DOMICILE_BRIDGE` gets caught.
      - name: An installed desktop starts and reaches its compositor
        run: |
          set -eu
          for name in manganese simple; do
            out="$(nix build --no-link --print-out-paths ".#$name")"
            DOMICILE_COMPOSITOR=/nix/store/there-is-no-such-compositor \
              "$out/bin/$name" 2>&1 |
              grep -q "no compositor at /nix/store/there-is-no-such-compositor" || {
                echo "$name: did not get as far as looking for its compositor"
                exit 1
              }
            # And that it refuses a word it has nowhere to put. The desktop is
            # chosen by which app you run, so the wrapper passes its own name
            # and anything the user typed arrives as a third argument —
            # dropping it hands somebody manganese while they read `simple` on
            # their own command line. The refusal replaced a launcher's own
            # `takes no arguments`, and went uncovered when it did: deleted
            # whole, every other check in this repository stayed green.
            "$out/bin/$name" --nope 2>&1 | grep -q "too many arguments" || {
              echo "$name: took an argument it has nothing to do with"
              exit 1
            }
          done

          # And Domicile itself, which is the opposite refusal: the desktops
          # have their page chosen and take no argument, this one *is* the
          # argument. Asserted because the wrapper cannot be run where it is
          # written — the flake's own `bun install` derivation needs a network
          # the dev container does not have — so this job is the only place the
          # built thing is ever started.
          #
          # `run-engine.sh`'s default shell is `simple`, meaning "build
          # packages/shell-simple out of the checkout", and there is no
          # checkout in the store. Without the refusal a bare
          # `nix run github:cprussin/domicile` fails somewhere further in,
          # about a workspace directory the person never mentioned.
          out="$(nix build --no-link --print-out-paths .#domicile)"
          [ -x "$out/bin/domicile" ] || {
            echo "domicile: no bin/domicile in $out"
            exit 1
          }
          "$out/bin/domicile" 2>&1 | grep -q "which shell?" || {
            echo "domicile: given no shell, it did not say so"
            exit 1
          }
