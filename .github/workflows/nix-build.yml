name: Nix build

# Build everything the flake produces.
#
# No `paths:` filter. engine.yml ignores changes to
# `packages/domicile-engine/engine-release.nix`, because a repin cannot change
# what it builds. This job covers a repin instead: `nix build .#manganese
# .#simple` fetches the url and hash in that file, so a deleted tag or bad hash
# fails here in minutes. `scripts/test-engine-path-filter.sh` fails if this job
# gains a `paths:` filter.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nix is installed below, so a skip means a `scripts/nix-*.sh` check broke.
  # No skips are expected.
  DOMICILE_CHECK_STRICT: "1"

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The assertions live in `scripts/nix-*.sh`, so they can also be run from
      # a checkout. A nix build has its own node_modules, so bun is not set up.
      - run: ./scripts/check.sh nix
