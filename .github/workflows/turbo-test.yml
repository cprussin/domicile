name: Turbo test

# The TypeScript side, which is turbo's own job — `bun run turbo test` is what
# `check.sh typescript` runs, and the cache below is the only reason this is a
# workflow of its own rather than a group in the e2e job.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: turbo-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in this group may skip: bun is set up below and turbo needs nothing
  # else, so a skip here is a task that stopped running.
  DOMICILE_CHECK_STRICT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Through `check.sh` rather than `bun run turbo test` directly, so that
      # what CI checks and what `./scripts/check.sh typescript` checks cannot
      # be two different lists. The cache directory is turbo's own
      # `TURBO_CACHE_DIR`, which is how it reaches turbo without this job
      # knowing the command.
      - env:
          TURBO_CACHE_DIR: .turbo/cache
        run: ./scripts/check.sh typescript

      - name: Save turbo cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
