name: Turbo test

# The TypeScript checks, as `./scripts/check.sh typescript` runs them. A
# separate workflow so it can keep its own turbo cache.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: turbo-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in this group may skip: bun is set up below and turbo needs nothing
  # else.
  DOMICILE_CHECK_STRICT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Through `check.sh` so CI and `./scripts/check.sh typescript` run the
      # same list. `TURBO_CACHE_DIR` points turbo at the restored cache.
      - env:
          TURBO_CACHE_DIR: .turbo/cache
        run: ./scripts/check.sh typescript

      - name: Save turbo cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
