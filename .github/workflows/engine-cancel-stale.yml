name: Cancel a pull request's stale queued engine runs

# Cancel a pull request's runs that hold `crux`'s single job slot for nothing.
# GitHub keeps them queued even after the pull request merges or closes.
#
# - On close (merged or abandoned): cancel runs that have not started.
# - On push (`synchronize`): cancel runs for every commit but the new head.
#   This includes a started run with no job in progress (queued in engine.yml's
#   `crux-compile` group, or between its build and checks) and, for
#   same-repository pull requests, a run in "Build" or "The engine's checks".
#   A stale run that already holds the machine is ended by engine.yml's "Take
#   the compile slot" step.
#
# Canceling a build is safe: lld and clang write through a temp file and
# rename, the next run resumes from the series stamp and out/Release, and
# `if: always()` steps and the drop-tree job release the tree and the compile
# slot. Later steps are never canceled, since the engine-release.nix write-back
# is a push to the branch.
#
# The decisions live in .github/scripts/crux-stale-runs.sh and
# .github/scripts/crux-cancelable-step.sh, tested by
# scripts/test-crux-stale-runs.sh.
#
# Race: a queued run can get a runner between the listing and the cancel. The
# status is read again just before each cancel, and a job that young is still
# in `actions/checkout`; its tree lock is dropped by an `if: always()` step. The
# cost is a wasted checkout.
on:
  pull_request:
    types: [closed, synchronize]

# Per pull request, in order: each pass cancels what the one before it left.
concurrency:
  group: engine-cancel-stale-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  # To list and cancel runs.
  actions: write

jobs:
  cancel:
    # Hosted, so this never waits for the `crux` queue it clears.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Cancel what this branch left waiting for crux
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          # The commit to keep: the new head on a push, none on a close.
          KEEP: ${{ github.event.action == 'synchronize' && github.event.pull_request.head.sha || '' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          api() { curl -sS -f -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" "$@"; }

          # Listed by branch so the filter has little to sort. One branch never
          # has more than 100 runs.
          runs="$(api "$API/actions/runs?branch=$BRANCH&per_page=100")"

          stale="$(printf '%s' "$runs" | .github/scripts/crux-stale-runs.sh "$BRANCH" "$KEEP")"
          # A fork's pull request always exits here: fork runs need engine.yml's
          # approval gate, so they never have a crux run, and their read-only
          # token could not cancel one.
          [ -n "$stale" ] || { echo "nothing of $BRANCH's is waiting for crux"; exit 0; }

          [ -n "$KEEP" ] && moved="moved on to $KEEP" || moved="is closed"
          echo "$BRANCH $moved; these of its runs are stale:"
          printf '%s\n' "$stale" | sed 's/^/  run /'

          # Check the status code. 409 means the run already ended, which is
          # fine. Anything else, such as a 403 from a token without
          # `actions: write`, is an error, so a broken token never reports
          # success. engine.yml's `if: always()` cleanup runs on canceled jobs.
          cancel() {
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "$API/actions/runs/$1/cancel")"
            case "$code" in
              (202) echo "canceled run $1" ;;
              (409) echo "run $1 ended on its own while this decided" ;;
              (*)
                echo "::error::canceling run $1 answered HTTP $code" >&2
                exit 1
                ;;
            esac
          }

          printf '%s\n' "$stale" | while IFS= read -r id; do
            [ -n "$id" ] || continue

            # Read the status again: the run may have started since the
            # listing. A started run gets the checks below instead.
            run="$(api "$API/actions/runs/$id")"
            now="$(printf '%s' "$run" | jq -r '.status')"
            sha="$(printf '%s' "$run" | jq -r '.head_sha')"
            case "$now" in
              (queued|pending) cancel "$id" ;;
              (in_progress)
                # Started runs are canceled only on a push to a same-repository
                # branch; a fork's token could not cancel them anyway.
                if [ -z "$KEEP" ] || [ "$SAME_REPO" != true ]; then
                  echo "run $id has started — left alone"
                  continue
                fi
                # Its commit may be the head again (a revert push, or this pass
                # running after a later one), so ask now.
                if head="$(.github/scripts/crux-still-head.sh "$BRANCH" "$sha")"; then
                  echo "run $id: $head — left alone"
                  continue
                elif [ $? -ne 1 ]; then
                  echo "::error::run $id: $head" >&2
                  exit 1
                fi
                jobs="$(api "$API/actions/runs/$id/jobs")"
                if where="$(printf '%s' "$jobs" | .github/scripts/crux-cancelable-step.sh)"; then
                  echo "run $id is for replaced $sha and $where"
                  cancel "$id"
                elif [ $? -eq 1 ]; then
                  echo "run $id is for replaced $sha but $where"
                else
                  echo "::error::run $id: could not read which step it is in" >&2
                  exit 1
                fi
                ;;
              (*)
                echo "run $id is '$now' now — left alone"
                ;;
            esac
          done
