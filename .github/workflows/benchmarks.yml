name: Benchmarks

# Measures Domicile against other desktops in identical VMs: memory and CPU at
# rest, with Slack and a browser, and with an editor too. Started by hand only,
# as it signs in to the Slack test workspace with this repository's secrets.
# See packages/benchmarks/README.md.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Boots per desktop and workload
        default: "3"
      host:
        description: >-
          github: GitHub's runners, every desktop drawn in software. crux: one
          desktop at a time on crux, drawn on its GPU through virgl, with
          QEMU's CPU and GPU share read on the host.
        type: choice
        options: [github, crux]
        default: github
      desktops:
        description: The desktops to run, as a JSON list
        default: '["console", "domicile", "sway", "hyprland", "gnome", "plasma"]'

permissions:
  contents: read

# One run at a time per host: two on crux would share its CPU and GPU and
# measure each other. A run started while one is going waits for it.
concurrency:
  group: benchmarks-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  desktop:
    # `crux` is a label set in cprussin/dotfiles:
    # config/machines/crux/domicile-ci.nix. Safe only while fork pull
    # requests need approval, and this workflow is started by hand anyway.
    runs-on: ${{ fromJSON(inputs.host == 'crux' && '["self-hosted", "crux"]' || '"ubuntu-latest"') }}
    # 3 workloads x 3 boots x ~10 minutes, plus building the VM.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # On crux, one at a time: two VMs on one machine would share its CPU
      # and GPU, and measure each other.
      max-parallel: ${{ inputs.host == 'crux' && 1 || 6 }}
      matrix:
        desktop: ${{ fromJSON(inputs.desktops) }}
    steps:
      - uses: actions/checkout@v7

      # A VM image of a full desktop's closure doesn't fit beside the
      # runner's preinstalled toolchains.
      - name: Make room for the VM image
        if: inputs.host == 'github'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Let the VM use KVM
        if: inputs.host == 'github'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        if: inputs.host == 'github'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            accept-flake-config = true

      # The NVIDIA card's render node, not vkms's, for virgl to draw on.
      - name: Find the GPU
        if: inputs.host == 'crux'
        run: |
          set -euo pipefail
          for node in /sys/class/drm/renderD*; do
            if [ "$(basename "$(readlink -f "$node/device/driver")")" = nvidia ]; then
              echo "BENCH_RENDER_NODE=/dev/dri/$(basename "$node")" >>"$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no NVIDIA render node under /sys/class/drm" >&2
          exit 1

      - run: nix build --print-build-logs .#benchmarks.${{ inputs.host == 'crux' && 'gpuDrivers' || 'drivers' }}.${{ matrix.desktop }} -o driver

      - run: nix run .#benchmarks.run -- ${{ matrix.desktop }} ./driver results ${{ inputs.runs }}
        env:
          BENCH_SLACK_WORKSPACE: ${{ secrets.BENCH_SLACK_WORKSPACE }}
          BENCH_SLACK_COOKIE: ${{ secrets.BENCH_SLACK_COOKIE }}
          BENCH_SLACK_DEBUG: results/slack-debug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.desktop }}
          path: results

  summary:
    needs: desktop
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: results
      - run: bun packages/benchmarks/src/main.ts results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-summary
          path: results/summary.json
