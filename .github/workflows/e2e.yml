name: End to end
on:
  pull_request:
  push:
    branches: [main]

# Superseded pushes shouldn't keep a full graphics stack running.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Everything is installed, so a skip means a check stopped running.
  DOMICILE_CHECK_STRICT: "1"
  # Expected skips:
  # - `e2e-dmabuf`: `ubuntu-latest` has no DRM render node, so no client can
  #   allocate a dmabuf.
  # - On pull requests, the pinned-engine check while engine.yml's write-back
  #   is still pending. The script skips only while that run is going and the
  #   pin matches the base's; see its header.
  DOMICILE_CHECK_ALLOW_SKIP: ${{ github.event_name == 'pull_request' && 'e2e-dmabuf test-the-pinned-engine-is-this-series' || 'e2e-dmabuf' }}

# `actions: read` so the pinned-engine check can ask whether engine.yml's run
# for this head is still going.
permissions:
  contents: read
  actions: read

jobs:
  # Checks that need the pieces wired together: pixels through a real GLES
  # stack, and a real Wayland client through the compositor to the chrome.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      # The runner's graphics stack, not the flake's: under `nix develop .#full`
      # the compositor finds no EGL renderer and the pixel checks fail. A likely
      # fix is setting `__EGL_VENDOR_LIBRARY_DIRS` and `LIBGL_DRIVERS_PATH` to
      # mesa's store paths in `devShells.full`; it is untested.
      - name: Install the graphics and client stacks
        run: |
          .github/scripts/apt-install.sh \
            libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgbm-dev mesa-utils \
            libgl1-mesa-dri libegl-mesa0 \
            weston wayland-utils wl-clipboard \
            libdrm2 libxkbcommon0


      # Shows which tools arrived, to tell a failing suite from one missing
      # its dependencies.
      - name: What is here
        run: |
          for tool in wayland-info eglinfo wl-copy; do
            printf '%-16s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      # `shell` holds the harness's own tests. It needs no graphics stack, and
      # no other job runs `check.sh`.
      #
      # The pull request's head and base let the pinned-engine check tell a
      # pending write-back from a missing one. They are empty on main, where
      # that check stays strict.
      - run: ./scripts/check.sh shell e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMICILE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOMICILE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
