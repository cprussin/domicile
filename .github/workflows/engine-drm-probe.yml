name: Engine DRM probe

# Checks that the patched tree accepts `ozone_platform_drm = true`, that
# `//ui/ozone` builds with it, and that the DRM platform's tests pass.
#
# This is the only place `DrmScreenTest` runs: it lives in `ozone_unittests`,
# and engine.yml builds only the wayland and headless platforms. Some build
# failures (an `is_chromeos`-conditional header, a `visibility` refusal) only
# show up in a build log; see docs/architecture/A-DESKTOP-ON-A-TTY.md.
#
# Dispatch only. It resets a Chromium tree on `crux`, whose single slot the
# engine guards and release build already share, and its answer only changes
# when the pin does.
on:
  workflow_dispatch:

# Per ref, not shared with engine.yml: `engine-tree-pool.sh pick` and the
# per-tree lock already keep runs out of each other's trees, and a shared group
# evicts pending runs. scripts/test-engine-concurrency.sh requires every
# `self-hosted, crux` workflow to key its group by ref.
#
# Never canceled mid-run: a killed `autoninja` leaves a half-linked output
# directory for the next run.
concurrency:
  group: engine-drm-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The compile slot asks whether its holder's run is over.
  actions: read

jobs:
  drm-probe:
    # `crux` is a label set in cprussin/dotfiles:
    # config/machines/crux/domicile-ci.nix. It is the only machine with the 97G
    # checkout. Safe only while fork pull requests need approval (Settings ->
    # Actions -> "Require approval for all external contributors").
    runs-on: [self-hosted, crux]

    # `out/DrmProbe` starts empty each run, and `//ui/ozone`'s closure is most
    # of base, skia, mojo and gpu. The budget covers that from cold; the cost
    # of `ozone_unittests` on top is unmeasured.
    timeout-minutes: 360

    env:
      # Never `out/Domicile`: `gn gen` would reconfigure it for DRM and cost
      # the guard and release builds their warm tree. Removed again below.
      OUT: out/DrmProbe

      # This run's log and sentinels share this prefix. See
      # engine-drm-probe.sh for why there are two sentinels.
      PROBE: /tmp/domicile-drm-probe

      # The tree lock holder, named so a person can find the run. Includes the
      # attempt so a re-run is a different holder.
      LOCK_OWNER: engine-drm-probe.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}

      # `git am` in apply.sh needs an identity, and this unit's HOME is deleted
      # on every start.
      GIT_AUTHOR_NAME: domicile CI
      GIT_AUTHOR_EMAIL: ci@domicile.invalid
      GIT_COMMITTER_NAME: domicile CI
      GIT_COMMITTER_EMAIL: ci@domicile.invalid

    steps:
      - uses: actions/checkout@v7

      # /tmp belongs to the runner service, which outlives each job, so the
      # last run's log and sentinels are still there.
      - name: Forget the last run's log and sentinels
        run: rm -f "$PROBE"*

      # TMPDIR for every later step, dropped at the end so nix's leftovers go
      # too. See engine.yml.
      - name: A temp directory for this job
        run: |
          set -euo pipefail
          dir="$(.github/scripts/engine-job-tmp.sh make)"
          echo "TMPDIR=$dir" >>"$GITHUB_ENV"
          echo "DOMICILE_JOB_TMP=$dir" >>"$GITHUB_ENV"

      # Take and lock a tree from the pool (see engine.yml). Before the room
      # check, because that checks this run's tree.
      - name: Take a tree
        run: |
          set -euo pipefail
          tree="$(.github/scripts/engine-tree-pool.sh pick \
            "$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')" \
            "$LOCK_OWNER")"
          echo "this probe builds in $tree"
          echo "CHROMIUM=$tree" >>"$GITHUB_ENV"

      # 62G and no swap: one Chromium compile at a time on this machine.
      # See .github/scripts/engine-compile-slot.sh.
      - name: Take the compile slot
        env:
          # A holder whose run is over holds nothing (crux-run-finished.sh).
          DOMICILE_COMPILE_SLOT_HOLDER_DONE: '.github/scripts/crux-run-finished.sh "$HOLDER"'
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/engine-compile-slot.sh take "$LOCK_OWNER"

      - name: Room to build in
        run: |
          set -euo pipefail
          free_gb=$(df -BG --output=avail /build | tail -1 | tr -dc '0-9')
          echo "/build has ${free_gb}G free"
          # //ui/ozone's closure is ~15G of objects, and /build also holds the
          # 97G checkout and the last out/Release. Below 30G a full dataset
          # would also break interactive builds on this machine.
          [ "$free_gb" -ge 30 ] || {
            echo "::error::only ${free_gb}G free on /build; this probe needs ~15G" >&2
            echo "Reclaim it by removing $CHROMIUM/out/Release or $CHROMIUM/$OUT, which are caches and nothing else." >&2
            exit 1
          }

      # The same reset, sync and apply scripts as engine.yml. apply.sh runs
      # outside Chromium's shell, whose sandbox hides its exit status and
      # output.
      - name: Reset the checkout to the pin, sync its DEPS and apply the series
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' packages/domicile-engine/CHROMIUM_PIN | tr -d '[:space:]')"
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-reset.sh "$CHROMIUM"
          # The reset does not move DEPS. A no-op unless the pin changed.
          .github/scripts/engine-render-node-lock.sh noisy "$LOCK_OWNER" -- .github/scripts/engine-sync.sh "$CHROMIUM"
          packages/domicile-engine/scripts/apply.sh "$CHROMIUM"
          [ "$(git -C "$CHROMIUM" rev-parse HEAD)" != "$pin" ] || {
            echo "::error::apply.sh succeeded but the checkout is still at the pin, so no patch was applied" >&2
            exit 1
          }
          echo "series applied: $(git -C "$CHROMIUM" log --oneline "$pin..HEAD" | wc -l) patches"

      # Runs in Chromium's toolchain shell, because gn needs host tools only it
      # supplies. Uses NIX_SHELL_RUN rather than `--command`: the shell's
      # shellHook execs bwrap before nix's `exec` runs, so `--command` would run
      # nothing.
      #
      # Never fails: that shell does not reliably pass exit status through, so
      # the steps below decide from the log and sentinels.
      - name: Probe
        run: |
          set -euo pipefail

          # tools/nix/shell.nix imports <nixpkgs>, and a systemd service has no
          # NIX_PATH, so take nixpkgs from this machine's flake registry.
          nixpkgs="$(nix eval --raw --impure --expr '(builtins.getFlake "nixpkgs").outPath')"
          echo "nixpkgs is $nixpkgs"
          export NIX_PATH="nixpkgs=$nixpkgs"

          # As noise: a latency guard on the other runner waits it out.
          if NIX_SHELL_RUN="$GITHUB_WORKSPACE/.github/scripts/engine-drm-probe.sh $CHROMIUM $PROBE" \
               "$GITHUB_WORKSPACE/.github/scripts/engine-render-node-lock.sh" noisy "$LOCK_OWNER" -- \
               nix-shell "$CHROMIUM/tools/nix/shell.nix" >"$PROBE.log" 2>&1; then
            echo "the shell exited 0"
          else
            echo "the shell exited $?"
          fi

      # Puts the compiler's first error at the top of the report. A script
      # (tested over synthesized logs) because GitHub echoes inline scripts
      # into the log, burying the failure.
      - name: What the probe found
        if: ${{ always() }}
        run: .github/scripts/engine-drm-probe-report.sh "$PROBE.log"

      # Two sentinels tell "Chromium's shell never ran the probe" apart from
      # "the tree did not build".
      - name: The verdict
        run: |
          set -euo pipefail
          [ -e "$PROBE-ran" ] || {
            echo "::error::Chromium's shell did not run the probe; its last words are above" >&2
            exit 1
          }
          [ -e "$PROBE-built" ] || {
            echo "::error::the probe ran and //ui/ozone did not build with ozone_platform_drm = true; the first failure is above" >&2
            exit 1
          }
          [ -e "$PROBE-tested" ] || {
            echo "::error::the probe ran, //ui/ozone built, and ozone_unittests did not; the first failure is above" >&2
            exit 1
          }
          echo "ozone_platform_drm = true configures and //ui/ozone compiles at this pin"

      # The only run of the DRM platform's tests, including `DrmScreenTest`:
      # engine.yml builds only wayland and headless.
      #
      # Run from the domicile dev shell and the out directory, as in
      # engine.yml: a component build loads its .so files from beside the
      # binary, and Chromium's runtime libraries (such as `libglib-2.0.so.0`)
      # are in that shell. Runs before the out directory is removed and the
      # lock dropped.
      - name: The DRM platform's own tests
        env:
          DOMICILE_CHROMIUM: ${{ env.CHROMIUM }}
          DOMICILE_ENGINE_OUT: out/DrmProbe
        run: |
          set -euo pipefail
          # `all` also runs upstream's tests over the DRM platform, which
          # `DrmScreen` is reached through. engine.yml runs the cheaper subset.
          # The test floors are kept in the script.
          nix develop "$GITHUB_WORKSPACE#full" --command \
            "$GITHUB_WORKSPACE/scripts/engine-drm-unit-tests.sh" all

      # Removed while the tree is still locked, and even on failure. Nothing
      # reads it after this job.
      - name: Take out/DrmProbe off the disk again
        if: ${{ always() && env.CHROMIUM != '' }}
        run: |
          rm -rf "${CHROMIUM:?}/${OUT:?}"
          df -BG --output=avail /build | tail -1 | sed 's/^/ free on \/build:/'

      - name: Drop this job's temp directory
        # Only if the step above got as far as making one.
        if: ${{ always() && env.DOMICILE_JOB_TMP != '' }}
        run: .github/scripts/engine-job-tmp.sh drop "$DOMICILE_JOB_TMP"

      # Only if this run still holds it: a step that failed on someone else's
      # lock also reaches here, and dropping it would release their tree
      # mid-build.
      - name: Drop the tree
        if: ${{ always() && env.CHROMIUM != '' }}
        run: .github/scripts/engine-tree-lock.sh drop "$CHROMIUM" "$LOCK_OWNER"

      - name: Drop the compile slot
        if: ${{ always() }}
        run: .github/scripts/engine-compile-slot.sh drop "$LOCK_OWNER"
