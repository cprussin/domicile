<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Domicile — shell</title>
  </head>
  <body>
    <!-- All of this is ordinary web content rendered by the compositor. -->
    <header id="bar">
      <span class="brand">domicile</span>
      <span class="spacer"></span>
      <span id="clock">--:--:--</span>
    </header>

    <!-- The stage is where app portals mount. Each app becomes a real
         <domicile-app> element here, styled entirely with CSS (see style.css). -->
    <main id="stage"></main>

    <div id="empty-hint">No apps yet — launch a Wayland client.</div>

    <script src="/src/renderer.ts" type="module"></script>
  </body>
</html>
