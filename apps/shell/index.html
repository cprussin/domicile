<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Domicile — shell</title>
  </head>
  <body>
    <!-- All of this is ordinary web content rendered by the compositor. -->
    <header id="bar">
      <!-- One tab per open window: Wayland clients and browser windows alike.
           The strip runs the length of the bar, so with nothing open it is also
           what holds the launchers and the clock at the end of it. -->
      <div aria-label="Open windows" id="tabs" role="tablist"></div>

      <button class="launcher" id="launch-browser" type="button">
        + Browser
      </button>
      <button class="launcher" id="launch-terminal" type="button">
        + Terminal
      </button>
      <span id="clock">--:--:--</span>
    </header>

    <!-- The stage shows one window at a time. Each Wayland client is a real
         <domicile-app> element here, styled entirely with CSS (see style.css). -->
    <main id="stage"></main>

    <div id="empty-hint">No windows yet — open one from the bar.</div>

    <script src="/src/renderer.ts" type="module"></script>
  </body>
</html>
