[workspace]
resolver = "2"
members = [
    "crates/dm-config",
    "crates/dm-scene",
    "crates/dm-protocol",
    "crates/dm-host",
    "crates/domicile",
    "crates/dm-bridge",
    "crates/dm-compositor",
]

# dm-compositor pulls Smithay + native Wayland libs, so it is excluded from the
# default set: plain `cargo test` (core shell) stays fast and Smithay-free.
# Build it explicitly in the full shell: `nix develop .#full -c cargo build -p dm-compositor`.
default-members = [
    "crates/dm-config",
    "crates/dm-scene",
    "crates/dm-protocol",
    "crates/dm-host",
    "crates/domicile",
    "crates/dm-bridge",
]

# dm-host's default build (the orchestrator) is pure logic and lives in the
# core shell. Its Smithay Wayland-server backend sits behind the
# `smithay-backend` feature; dm-bridge (CEF FFI) joins once the heavy native
# toolchain lands via `nix develop .#full`.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
notify = "6"
tempfile = "3"
