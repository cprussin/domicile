[workspace]
resolver = "2"
members = [
    "crates/domicile-config",
    "crates/domicile-scene",
    "crates/domicile-protocol",
    "crates/domicile-host",
    "crates/domicile",
    "crates/domicile-bridge",
    "crates/domicile-compositor",
]

# domicile-compositor pulls Smithay + native Wayland libs, so it is excluded from the
# default set: plain `cargo test` (core shell) stays fast and Smithay-free.
# Build it explicitly in the full shell: `nix develop .#full -c cargo build -p domicile-compositor`.
default-members = [
    "crates/domicile-config",
    "crates/domicile-scene",
    "crates/domicile-protocol",
    "crates/domicile-host",
    "crates/domicile",
    "crates/domicile-bridge",
]

# domicile-host's default build (the orchestrator) is pure logic and lives in the
# core shell. Its Smithay Wayland-server backend sits behind the
# `smithay-backend` feature; domicile-bridge (CEF FFI) joins once the heavy native
# toolchain lands via `nix develop .#full`.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
notify = "6"
tempfile = "3"
