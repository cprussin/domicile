[workspace]
resolver = "2"
members = [
    "packages/domicile-config",
    "packages/domicile-scene",
    "packages/domicile-protocol",
    "packages/domicile-host",
    "packages/domicile-launch",
    "packages/domicile-test-chrome",
    "packages/domicile-test-client",
    "packages/domicile-compositor",
]

# domicile-compositor needs Smithay and native Wayland libraries, so plain
# `cargo test` in the core shell skips it. Build it in the full shell:
# `nix develop .#full -c cargo build -p domicile-compositor`.
default-members = [
    "packages/domicile-config",
    "packages/domicile-scene",
    "packages/domicile-protocol",
    "packages/domicile-host",
    "packages/domicile-launch",
    "packages/domicile-test-chrome",
    "packages/domicile-test-client",
]

# domicile-host's Smithay backend is behind the `smithay-backend` feature, so
# its default build needs only the core shell.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
# The oldest rustc the locked dependencies build with (lofty needs 1.89).
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pinned release candidate for `Config::with_event_kinds`. Version 8 watches
# every file open, which overflows the kernel queue on a real home (see
# `domicile_host::home_watch`). Move to 9.0.0 when it is released.
notify = "=9.0.0-rc.5"
# Matches the gitignore-style globs in the config's `[files] omit`.
globset = { version = "0.4", default-features = false }
# Reads audio tags and cover art for launcher previews. The shell page cannot
# read them because it is served from another origin.
lofty = "0.25"
tempfile = "3"
# D-Bus. Pure Rust, so it links nothing. `blocking-api` because nothing here runs
# an async runtime; no default features to avoid tokio.
zbus = { version = "5.0", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
libc = "0.2"
# Encodes screenshots (see `domicile_host::screenshot`).
png = "0.18"
