[workspace]
resolver = "2"
members = [
    "packages/domicile-config",
    "packages/domicile-scene",
    "packages/domicile-protocol",
    "packages/domicile-host",
    "packages/domicile-launch",
    "packages/domicile-test-chrome",
    "packages/domicile-test-client",
    "packages/domicile-compositor",
    "packages/domicile-miracast",
    "packages/domicile-recorder",
]

# domicile-compositor needs Smithay and native Wayland libraries, so plain
# `cargo test` in the core shell skips it. Build it in the full shell:
# `nix develop .#full -c cargo build -p domicile-compositor`.
# domicile-recorder links GStreamer, so it is built there too.
default-members = [
    "packages/domicile-config",
    "packages/domicile-scene",
    "packages/domicile-protocol",
    "packages/domicile-host",
    "packages/domicile-launch",
    "packages/domicile-test-chrome",
    "packages/domicile-test-client",
    "packages/domicile-miracast",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
# The oldest rustc the locked dependencies build with.
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pinned release candidate for `Config::with_event_kinds`. Version 8 watches
# every file open, which overflows the kernel queue on a real home (see
# `domicile_host::home_watch`). Move to 9.0.0 when it is released.
notify = "=9.0.0-rc.5"
# Matches the gitignore-style globs in the config's `[files] omit`.
globset = { version = "0.4", default-features = false }
tempfile = "3"
# D-Bus. Pure Rust, so it links nothing. `blocking-api` because nothing here runs
# an async runtime; no default features to avoid tokio.
zbus = { version = "5.0", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
libc = "0.2"
# Encodes screenshots (see `domicile_host::screenshot`).
png = "0.18"
# The config's JSON Schema, from which the SDK's config types are generated.
schemars = "1"

# The installed binaries (`domicileBinaries` in `flake.nix`). Panics unwind:
# `domicile`'s `Drop`s end the desktop's process groups and its graphical
# session, and a panicking helper thread ends only that thread.
[profile.release]
lto = "thin"
codegen-units = 1

# Smithay 0.7.0 with Smithay/smithay#2217 backported: `wl_keyboard.keymap` is
# sent read-only, so SELinux lets confined clients such as wezterm receive it.
# Branch `domicile-0.7` of the fork. Drop this once a Smithay release contains
# #2217; `a_client_is_handed_a_read_only_keymap` checks the release.
[patch.crates-io]
smithay = { git = "https://github.com/cprussin/smithay", rev = "fb981077def1405300e69a5993e9789768e772aa" }
