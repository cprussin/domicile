[workspace]
resolver = "2"
members = [
    "packages/domicile-config",
    "packages/domicile-scene",
    "packages/domicile-protocol",
    "packages/domicile-host",
    "packages/domicile-launch",
    "packages/domicile-test-chrome",
    "packages/domicile-test-client",
    "packages/domicile-compositor",
]

# domicile-compositor pulls Smithay + native Wayland libs, so it is excluded from the
# default set: plain `cargo test` (core shell) stays fast and Smithay-free.
# Build it explicitly in the full shell: `nix develop .#full -c cargo build -p domicile-compositor`.
default-members = [
    "packages/domicile-config",
    "packages/domicile-scene",
    "packages/domicile-protocol",
    "packages/domicile-host",
    "packages/domicile-launch",
    "packages/domicile-test-chrome",
    "packages/domicile-test-client",
]

# domicile-host's default build (the orchestrator) is pure logic and lives in the
# core shell. Its Smithay Wayland-server backend sits behind the
# `smithay-backend` feature.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The compositor's config file. serde_json stays for the session document and
# the host protocol, which are machine-to-machine; this one a person reads.
toml = { version = "1.0", default-features = false, features = ["parse", "serde"] }
thiserror = "2"
notify = "8"
# `[files] omit` in the compositor's config: gitignore-shaped globs over paths.
globset = { version = "0.4", default-features = false }
tempfile = "3"
libc = "0.2"
