[package]
name = "domicile-compositor"
description = "Domicile Smithay backend: a Wayland protocol frontend that drives the host brain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "domicile-compositor"
path = "src/main.rs"

# The stand-in Wayland client this crate's integration tests open a window
# with, owned here rather than by `domicile-test-client` — which is where all
# of its code still lives.
#
# Cargo builds every binary of the package under test before it runs that
# package's tests, and has no stable way to depend on another package's binary
# (`artifact = "bin"` is still `-Z bindeps`). So a client that lived only in
# its own crate was built by whatever command happened to run first:
# `cargo test --workspace` produced one and `cargo test -p domicile-compositor`
# did not, which made the documented command fail on a clean tree. Declaring
# the target here is what ties the two together — the tests get
# `CARGO_BIN_EXE_domicile-test-client` and cargo keeps its promise about it.
[[bin]]
name = "domicile-test-client"
path = "src/bin/domicile-test-client.rs"

[dependencies]
# The renderer's matrix type, at the version Smithay's own API speaks.
cgmath = "0.18"
domicile-bridge = { path = "../domicile-bridge" }
domicile-config = { path = "../domicile-config" }
domicile-host = { path = "../domicile-host" }
domicile-protocol = { path = "../domicile-protocol" }
domicile-scene = { path = "../domicile-scene" }
domicile-launch = { path = "../domicile-launch" }
# The client above, and a dependency rather than a dev-dependency because a
# `[[bin]]` links against the former. It adds no crate to this tree: Smithay
# already pulls `wayland-client` and `wayland-protocols` for the server side.
domicile-test-client = { path = "../domicile-test-client" }
# Same dlopen crate Smithay uses for EGL, so libEGL can be probed for before
# Smithay loads it (it treats a missing library as fatal).
libloading = "0.8"
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# In Domicile the web engine is the renderer, so we deliberately do NOT pull
# Smithay's winit, DRM or udev backends. Smithay's job here is accepting clients
# and managing their surfaces — plus, for GPU clients, importing the dmabuf they
# hand us. That import is what `backend_egl` + `renderer_gl` are for: they add
# only Rust build-time codegen and a runtime `dlopen` of libEGL/libGLESv2, so the
# crate still links against nothing but libxkbcommon and still builds where there
# is no GPU (the dmabuf global is simply not advertised there).
# Generates server bindings for the vendored protocols in `protocols/` —
# Chromium's own, which nothing packages. See that directory's README.
wayland-scanner = "0.31"
# The generated bindings name it directly; the version is the one Smithay
# already links, so this adds nothing to the tree.
wayland-backend = "0.3"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "wayland_frontend",
    "backend_egl",
    "renderer_gl",
    # Presentation: the compositor draws client surfaces itself, so it needs
    # somewhere to put them. `winit` is the nested output; DRM/KMS follows.
    # This is what pulls in libwayland and the X11 client libraries, which is
    # why CI installs them.
    "backend_winit",
]

[dev-dependencies]
domicile-test-chrome = { path = "../domicile-test-chrome" }
# The fixture reads the published session to learn which display the
# compositor bound, through `domicile-launch`'s own type.
serde_json.workspace = true
tempfile.workspace = true
