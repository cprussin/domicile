[package]
name = "domicile-compositor"
description = "Domicile Smithay backend: a Wayland protocol frontend that drives the host brain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "domicile-compositor"
path = "src/main.rs"

# The Wayland client the integration tests open windows with. Its code lives
# in `domicile-test-client`; the target is declared here because cargo builds a
# package's own binaries before its tests and has no stable way to depend on
# another package's binary (`artifact = "bin"` needs `-Z bindeps`). This makes
# `cargo test -p domicile-compositor` set `CARGO_BIN_EXE_domicile-test-client`.
[[bin]]
name = "domicile-test-client"
path = "src/bin/domicile-test-client.rs"

# A PipeWire consumer for `scripts/e2e-a-window-casts-to-pipewire.sh`. Here so
# the check builds it with the compositor, and links nothing new.
[[bin]]
name = "domicile-test-cast-reader"
path = "src/bin/domicile-test-cast-reader.rs"

# An application and a shell for
# `scripts/e2e-a-screen-cast-through-the-portal.sh`, which drive the ScreenCast
# portal over D-Bus and the chrome socket.
[[bin]]
name = "domicile-test-screencast"
path = "src/bin/domicile-test-screencast.rs"

[dependencies]
# The matrix type Smithay's renderer API uses, at Smithay's version.
cgmath = "0.18"
domicile-config = { path = "../domicile-config" }
domicile-host = { path = "../domicile-host" }
domicile-protocol = { path = "../domicile-protocol" }
domicile-scene = { path = "../domicile-scene" }
domicile-launch = { path = "../domicile-launch" }
# For the test client above. A regular dependency because a `[[bin]]` cannot
# use dev-dependencies. Adds no crates: Smithay already pulls in
# `wayland-client` and `wayland-protocols`.
domicile-test-client = { path = "../domicile-test-client" }
# For the ScreenCast check's binary above, which answers its source picker as
# the shell. Adds no crates.
domicile-test-chrome = { path = "../domicile-test-chrome" }
# Raw syscalls, such as reading a peer's credentials (see
# `src/peer_process.rs`).
libc = "0.2"
# The dlopen crate Smithay uses. Probes for libEGL before Smithay loads it
# (Smithay treats a missing library as fatal), and loads libpam only when the
# lock names a PAM service (see `src/pam.rs`), so neither is linked.
libloading = "0.9"
# Screen casting: a PipeWire video producer per stream (see `src/casting/`).
pipewire = { version = "0.10", features = ["v0_3_34"] }
# Watches the home directory for the file index (see `src/file_indexing.rs`).
notify.workspace = true
# A shell's `options` reach the chrome as JSON (see `src/shell_config.rs`).
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Serves EIS, the emulated input the RemoteDesktop and InputCapture portals
# hand out (see `src/eis.rs`). Its calloop sources run on the Wayland loop.
reis = { version = "0.7", features = ["calloop"] }
# D-Bus, for the settings portal (see `src/appearance.rs`) and logind.
zbus.workspace = true

# The engine renders, so Smithay's winit, DRM and udev backends are left out.
# Smithay accepts clients and manages surfaces. `backend_egl` and `renderer_gl`
# check that a client's dmabuf imports; they `dlopen` libEGL and libGLESv2 at
# runtime, so the crate links only libxkbcommon and builds without a GPU.

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "wayland_frontend",
    "backend_egl",
    "renderer_gl",
]

[dev-dependencies]
# `p2p` serves the portal interfaces over a socket pair in tests, without a
# bus daemon. Adds no crates.
zbus = { workspace = true, features = ["p2p"] }
# The fixture reads the published session file to find the compositor's
# display.
serde_json.workspace = true
tempfile.workspace = true
