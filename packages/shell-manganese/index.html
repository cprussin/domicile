<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Domicile — shell</title>
    <script>
      // Mirror loadPreference/applyPreference so the persisted (or system)
      // theme is applied before the bundle paints — without this a light-mode
      // user sees the default dark background flash to light when the React
      // bundle sets the attribute. Keep the key and the `data-theme` attribute
      // in sync with the component library's ThemeProvider.
      const stored = localStorage.getItem("theme:v1");
      const preference =
        stored === "light" || stored === "dark" || stored === "system"
          ? stored
          : "system";
      const systemTheme = matchMedia("(prefers-color-scheme: light)").matches
        ? "light"
        : "dark";
      const resolved = preference === "system" ? systemTheme : preference;
      if (resolved === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>
  <body>
    <!-- All of this is ordinary web content rendered by the compositor: the
         chrome is a React tree, and each Wayland client on the stage is a real
         <domicile-app> element that takes ordinary CSS. -->
    <div id="root"></div>
    <script src="/src/renderer.tsx" type="module"></script>
  </body>
</html>
