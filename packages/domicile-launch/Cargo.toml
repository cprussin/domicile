[package]
name = "domicile-launch"
description = "The boundary between a shell and the compositor it runs: the command line the compositor is started with, and the session document it publishes once it is up"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
domicile-config = { path = "../domicile-config" }
libc.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Session bus, for reporting a failed reload as a notification. Features match
# the compositor's so the workspace builds zbus once.
zbus = { version = "5.0", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
# `p2p` lets tests serve notifications over a socket pair instead of a bus.
zbus = { version = "5.0", default-features = false, features = [
    "async-io",
    "blocking-api",
    "p2p",
] }
