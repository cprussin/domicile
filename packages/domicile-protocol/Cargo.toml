[package]
name = "domicile-protocol"
description = "Message types shared between the Domicile host and the in-page bridge client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# One value only, and the reason this crate is not serde alone:
# `HostMessage::ShellConfig` carries `[shells.<name>.options]`, which is
# whatever a shell chose to write and has no schema here to derive. A JSON value
# is the honest type for a freeform object on a JSON wire, and it is the format
# this protocol already speaks rather than a second one.
serde_json.workspace = true
thiserror.workspace = true
