[package]
name = "domicile-relay"
description = "Forwards connections for a desk's own address to the desk, without decrypting them, so agents on the web can reach it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# A desk proves it holds the key its address is named for.
ed25519-dalek = { version = "3", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true

[[bin]]
name = "domicile-relay"
path = "src/main.rs"

[lints]
workspace = true
