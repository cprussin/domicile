[package]
name = "domicile-agents"
description = "The agents the desk lets in, such as one connected through `domicile mcp`, and the dialog that asks the user first."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
domicile-host = { path = "../domicile-host" }
domicile-portal = { path = "../domicile-portal" }
domicile-protocol = { path = "../domicile-protocol" }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
zbus.workspace = true

[dev-dependencies]
domicile-portal = { path = "../domicile-portal", features = ["testing"] }
tempfile.workspace = true
zbus = { workspace = true, features = ["p2p"] }

[lints]
workspace = true
