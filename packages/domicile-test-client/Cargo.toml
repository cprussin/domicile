[package]
name = "domicile-test-client"
description = "A stand-in Wayland client: what a test opens a window with, in place of weston's demos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Library only. The executable is a `[[bin]]` of `domicile-compositor` so that
# its tests build it; see `lib.rs`.
[lib]
name = "domicile_test_client"
path = "src/lib.rs"

# Pure-Rust backend (no `system` or `dlopen` feature), so the client builds
# without libwayland on any machine that runs `cargo`. Smithay already pulls
# these crates in, so they add nothing to `Cargo.lock`.
[dependencies]
thiserror.workspace = true
wayland-client = "0.31"
# `staging` and `unstable` for `wp_cursor_shape_v1`, which `tests/input.rs`
# uses to request a named cursor. Smithay already enables both.
wayland-protocols = { version = "0.32", features = [
  "client",
  "staging",
  "unstable",
] }
# `org_kde_kwin_server_decoration`, the decoration request GTK3 makes, for
# `tests/decorations.rs`.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
