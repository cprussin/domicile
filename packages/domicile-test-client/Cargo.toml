[package]
name = "domicile-test-client"
description = "A stand-in Wayland client: what a test opens a window with, in place of weston's demos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Library only. The `domicile-test-client` executable is a `[[bin]]` of
# `domicile-compositor`, because cargo builds a package's binaries whenever it
# builds that package's tests and cannot be told to build another package's —
# see this crate's `lib.rs` and that manifest for the whole of it.
[lib]
name = "domicile_test_client"
path = "src/lib.rs"

# The pure-Rust backend, deliberately: no `system`, no `dlopen`, no
# libwayland. A client that links nothing builds in the core dev shell and on
# any machine that can run `cargo`, which is the whole point of replacing the
# weston demos — those are what made ten checks skip.
#
# Both crates are already in `Cargo.lock`; Smithay pulls them for the
# compositor's own server side, so this adds no new dependency to the tree.
[dependencies]
thiserror.workspace = true
wayland-client = "0.31"
# `staging` and `unstable` for `wp_cursor_shape_v1`, which is how a client asks
# for a named cursor and so how `tests/input.rs` sees one reach the chrome.
# Neither feature reaches the compositor's build as a change: Smithay already
# turns both on for its own server side, so this adds no crate and no code to it.
wayland-protocols = { version = "0.32", features = [
  "client",
  "staging",
  "unstable",
] }
