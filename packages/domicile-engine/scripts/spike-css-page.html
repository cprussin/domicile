<!doctype html>
<!--
  THROWAWAY. The page half of step 4 of the spike in
  docs/architecture/ENGINE-FORK.md: the measurement.

  Every cell is one CSS property, applied identically to the two halves of it.
  The left half holds the fork's native <app> — a cc::SurfaceLayer embedding a
  viz surface a process outside the renderer submits to — and the right half
  holds an ordinary <div> filled with the color that producer submits. Both
  halves are otherwise the same markup at the same offsets, so "does this
  property treat an <app> like a <div>" becomes "is the left half of this cell
  a pixel-for-pixel copy of the right half", which domicile_css_parity answers
  out of the display compositor's own draw.

  THE TAG IS THE POINT AND IT USED NOT TO BE. This page reached a window
  through `canvas`'s own embed method until the table was re-taken, which
  measured a path no shell takes any more: the SDK's <domicile-app> wrapped
  exactly that call, and the wrapper is gone. The canvas path still works and
  the other pages here still use it; this one cannot, because its numbers are
  quoted as what CSS does to the element a shell writes.
  scripts/test-parity-page-uses-the-native-tag.sh is what keeps it that way.

  The last cell is there to be different. A measurement that cannot fail has
  not measured anything, so its control is a color the producer never submits
  and the run fails if the diff does not notice.

  TWO RUNS COME THROUGH HERE, and `?backdrop-filter=` is which. Without it this
  is the table above. With it, a filtering element is stacked over every
  property cell — translucent chrome over a window, which is the case
  WINDOW-COMPOSITING.md leaves open: the filter reads the render pass
  aggregation has already drawn the window's quads into, so an <app> under one
  has to come out the same as a <div> under one, and a window viz had promoted
  to an overlay instead would leave the filter nothing of it to read.

  THE FILTERED RUN HAS ITS OWN NEGATIVE CONTROL, because the plain run's is not
  one here: an unfiltered run of this page is the run above, and it passes.
  So the last cell's ordinary half takes the filter and its <app> half does
  not, with both halves back on the producer's color — which leaves the filter
  as the only thing that can make that cell differ, and the run fails if it
  does not. The two together are the whole assertion: every property cell says
  a filter over an <app> is a filter over a <div>, and the last cell says there
  was a filter.

  THE GEOMETRY HERE MUST MATCH components/domicile/spike/css_parity_layout.h.
  Nothing checks that they agree, and nothing has to: a disagreement misaligns
  both halves of every cell, which reads as everything failing rather than as
  something passing that should not have.
-->
<meta charset="utf-8">
<title>domicile: does CSS treat an &lt;app&gt; like a &lt;div&gt;?</title>
<style>
  /* Must match kPageBackground. The producer finds the top of the viewport by
     looking for the first row of the window that is this color all the way
     across, which is how the measurement locates the page without needing to
     know how tall the browser's own furniture is. kGridTop of margin above the
     first cell is what guarantees such a row exists. */
  html, body {
    background: #101418;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  .cell {                        /* kCellWidth x kCellHeight */
    height: 190px;
    position: absolute;
    width: 560px;
  }

  /* One half of a cell. Isolated so that mix-blend-mode composites against
     this half's own backdrop and not across the two of them. */
  .half {
    height: 190px;
    isolation: isolate;
    position: absolute;
    top: 0;
    width: 280px;              /* kCellHalfWidth */
  }
  .app-half { left: 0; }
  .control-half { left: 280px; }

  /* Something with structure to composite against, so that opacity, blur and
     blend have more to show than one flat color over another. */
  .backdrop {
    background: linear-gradient(135deg, #ff9800 0%, #3f51b5 50%, #4caf50 100%);
    height: 130px;
    left: 60px;
    position: absolute;
    top: 30px;
    width: 160px;
  }

  /* The <app> and its control. kBoxLeft, kBoxTop, kBoxWidth, kBoxHeight. */
  .box {
    display: block;
    height: 90px;
    left: 80px;
    position: absolute;
    top: 50px;
    width: 120px;
  }

  /* The backdrop-filter run's filtering element: chrome over a window. It
     covers most of the box under test — including one of its edges — and runs
     out over the gradient and the page background beside it, so what a run
     reads is a filter over a window's pixels and over ordinary ones at once.
     Its own edges land on none of `.box`'s, which are the only ones the two
     halves of a cell can disagree about.

     It has no paint of its own — no background, no border — and that is what
     makes the last cell a control rather than a decoration: with the filter a
     no-op this element leaves no mark at all, the two halves of that cell come
     out identical, and the run fails. A translucent background would have made
     them differ whether the filter did anything or not. */
  .filter {
    height: 90px;
    left: 60px;
    position: absolute;
    top: 60px;
    width: 160px;
    z-index: 3;                /* over `.over`, the highest thing in a cell */
  }

  /* Ordinary elements for the <app> to stack between. */
  .under, .over {
    height: 90px;
    position: absolute;
    width: 120px;
  }
  .under { background: #e91e63; left: 50px; top: 30px; z-index: 0; }
  .over  { background: #03a9f4; left: 110px; top: 80px; z-index: 2; }

  /* One class per property under test, applied to the <app> and to its
     control alike. */
  .p-zindex        { z-index: 1; }
  .p-transform     { transform: translate(12px, 8px) rotate(12deg) scale(1.15); }
  .p-borderradius  { border-radius: 28px; }
  .p-opacity       { opacity: 0.45; }
  .p-blur          { filter: blur(6px); }
  .p-blend         { mix-blend-mode: multiply; }
</style>
<body></body>
<script>
  // Must match css_parity_layout.h.
  const GRID_LEFT = 16;
  const GRID_TOP = 16;
  const CELL_WIDTH = 560;
  const CELL_HEIGHT = 190;
  const COLUMN_GAP = 24;
  const ROW_GAP = 10;
  const COLUMNS = 2;
  const BOX_WIDTH = 120;
  const BOX_HEIGHT = 90;

  const DEFAULT_COLOR = '00C853';

  // In the order css_parity_layout.h's kCells lists them. `filtered` is which
  // halves the backdrop-filter run stacks its filtering element over, and is
  // read only on that run.
  //
  // The baseline cell never takes one, and the reason is the cell below it in
  // this list rather than the baseline itself: the negative control's <app>
  // half is compared against the baseline's and has to be pixel-identical to
  // it, and that half is unfiltered because the filter has to be the only
  // difference between the control's two halves. It suits the producer's two
  // absolute reads as well — whether a surface arrived at all, and the point
  // the latency loop samples — since both are the center of this cell's <app>
  // and neither means anything through a filter.
  const CELLS = [
    { backdrop: true, controlColor: undefined, filtered: undefined,
      property: undefined, stack: false },
    { backdrop: false, controlColor: undefined, filtered: 'both',
      property: 'p-zindex', stack: true },
    { backdrop: true, controlColor: undefined, filtered: 'both',
      property: 'p-transform', stack: false },
    { backdrop: true, controlColor: undefined, filtered: 'both',
      property: 'p-borderradius', stack: false },
    { backdrop: true, controlColor: undefined, filtered: 'both',
      property: 'p-opacity', stack: false },
    { backdrop: true, controlColor: undefined, filtered: 'both',
      property: 'p-blur', stack: false },
    { backdrop: true, controlColor: undefined, filtered: 'both',
      property: 'p-blend', stack: false },
    // The control the diff has to notice, which each run makes different its
    // own way: a color the producer never submits, or — where that would be no
    // control at all — the filter on one half and not the other. Everything
    // else about it is a baseline cell.
    { backdrop: true, controlColor: '#ff1744', filtered: 'control',
      property: undefined, stack: false },
  ];

  /**
   * The color the producer submits, which every control element is filled
   * with. There is no channel from this page to the producer, so the harness
   * is what makes the two agree.
   *
   * A value this cannot read would compare an <app> against the wrong color
   * and report every cell as a failure, so it throws instead of carrying on
   * with a default.
   */
  const parseColor = (raw) => {
    if (/^[0-9a-fA-F]{6}$/.test(raw)) {
      return '#' + raw;
    } else {
      throw new Error('?color= wants RRGGBB hex, got "' + raw + '"');
    }
  };

  const COLOR = parseColor(
    new URLSearchParams(location.search).get('color') ?? DEFAULT_COLOR);

  // The one window this page measures against, and every element here names
  // it on purpose: the measurement is several <app> elements against ONE
  // producer, laid out beside ordinary elements, so they have to be the same
  // window. Elements naming different apps get different surfaces — see
  // ExternalSurfaceEmbedder's AllocatorForApp.
  //
  // `domicile-spike` is what surface_producer.cc registers, which is the
  // producer every script that drives this page runs. The scripts pass it
  // explicitly anyway: the default is a convenience for opening the page by
  // hand, and a page whose app id is wrong does not fail, it waits — the
  // browser holds an embed until that app has a producer, and an app that
  // never turns up is an embed that never resolves.
  const APP_ID =
    new URLSearchParams(location.search).get('app') ?? 'domicile-spike';

  // Which run this is: the CSS value the filtering element carries, or nothing
  // at all for the plain table. guard-css-and-resize.sh is what passes it.
  const BACKDROP_FILTER =
    new URLSearchParams(location.search).get('backdrop-filter') ?? undefined;

  /**
   * What the ordinary element in a cell is filled with.
   *
   * The producer's color everywhere but the negative control, which the plain
   * run makes different with a color the producer never submits. The
   * backdrop-filter run cannot use that one: a wrong color makes those halves
   * differ whether or not the filter did anything, and that cell is the whole
   * of what says the filter did something. So on that run it goes back to the
   * producer's color and the filter is left as the only difference.
   */
  const controlColorOf = (spec) =>
    BACKDROP_FILTER === undefined ? spec.controlColor ?? COLOR : COLOR;

  /**
   * Whether this half of this cell is one the filtering element goes over.
   *
   * Both halves of every property cell, because the question the run asks is
   * whether an <app> under a filter is a <div> under one; the ordinary half
   * alone of the negative control, because that cell's job is to differ.
   */
  const isFiltered = (spec, side) =>
    BACKDROP_FILTER !== undefined &&
    (spec.filtered === 'both' ||
     (spec.filtered === 'control' && side === 'control-half'));

  /**
   * The filtering element, carrying the value this run was asked for.
   *
   * A value the engine does not parse is dropped on assignment and leaves an
   * element that filters nothing, which is a whole table passing about a
   * filter that was never there — so this reads the property back and throws
   * rather than laying out a run that cannot fail.
   */
  const buildFilter = (value) => {
    const filter = document.createElement('div');
    filter.className = 'filter';
    filter.style.backdropFilter = value;
    if (filter.style.backdropFilter === '') {
      throw new Error(
        '?backdrop-filter= is not a value this engine parses: "' + value + '"');
    } else {
      return filter;
    }
  };

  /**
   * Builds one half of a cell: the backdrop or the stack it composites
   * against, and the element under test.
   *
   * The stacking cell puts the element under test FIRST in document order, so
   * that the two ordinary elements it has to interleave with come after it.
   * That is what makes the cell discriminating: with z-index honored the
   * element paints above `under` and below `over`, and with z-index ignored it
   * would fall back to document order and `under` would cover it. Building it
   * the other way round — the way that reads more naturally — passes whether
   * z-index works or not, because document order already puts it where
   * z-index would.
   */
  const buildHalf = (spec, side, box) => {
    const half = document.createElement('div');
    half.className = 'half ' + side;
    if (spec.backdrop) {
      const backdrop = document.createElement('div');
      backdrop.className = 'backdrop';
      half.append(backdrop);
    }
    box.className =
      'box' + (spec.property === undefined ? '' : ' ' + spec.property);
    half.append(box);
    if (spec.stack) {
      for (const name of ['under', 'over']) {
        const neighbor = document.createElement('div');
        neighbor.className = name;
        half.append(neighbor);
      }
    }
    if (isFiltered(spec, side)) {
      half.append(buildFilter(BACKDROP_FILTER));
    }
    return half;
  };

  /** Builds one cell and returns the <app> in it. */
  const buildCell = (spec, index) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.left =
      GRID_LEFT + (index % COLUMNS) * (CELL_WIDTH + COLUMN_GAP) + 'px';
    cell.style.top =
      GRID_TOP + Math.floor(index / COLUMNS) * (CELL_HEIGHT + ROW_GAP) + 'px';

    // The fork's own element, not a <canvas> with a method on it. `app-id` is
    // a reflected content attribute, so this is the whole of pointing it at a
    // window: there is nothing to call and nothing to await. The box comes
    // from `.box` in the stylesheet, which is also what the producer is
    // configured at — LayoutAppSurface reports the laid-out box and the
    // element re-embeds at it, so BOX_WIDTH and BOX_HEIGHT are the
    // stylesheet's to state and only css_parity_layout.h's to agree with.
    const app = document.createElement('app');
    app.setAttribute('app-id', APP_ID);

    const control = document.createElement('div');
    control.style.background = controlColorOf(spec);

    cell.append(buildHalf(spec, 'app-half', app));
    cell.append(buildHalf(spec, 'control-half', control));
    document.body.append(cell);
    return app;
  };

  const apps = CELLS.map(buildCell);

  // WHAT THE HARNESS READS BACK, and the one thing about this run a table of
  // pixels cannot report. `?backdrop-filter=` is a parameter on the page the
  // plain run also uses, so a page that never read it lays that run out
  // instead: eight cells that pass, about a filter that was never there.
  // guard-css-and-resize.sh greps the engine's log for this line and fails the
  // run without it. Printed after the cells are built and the value has been
  // through the engine's parser, so it reports what is on them rather than
  // what was asked for.
  if (BACKDROP_FILTER !== undefined) {
    console.log('domicile: backdrop-filter ' + BACKDROP_FILTER + ' is over ' +
                'every property cell and over the ordinary half of the ' +
                'negative control.');
  }

  // WHAT A PAGE CAN AND CANNOT SEE THROUGH THE NATIVE TAG. Through the canvas
  // this was a promise, and a rejected one named its own reason. `<app>` has
  // neither: the element asks the browser from layout and the browser holds
  // the reply until a producer has registered that app id, so "embedded",
  // "refused" and "still waiting" are all the same silence from here.
  //
  // Which does not make the diagnostic pointless, it moves it. A wrong app id
  // and a page that never laid out look identical in the pixels — both are a
  // cell with no window in it — and the box is what tells them apart. An <app>
  // with no box never asks at all: `Embed()` returns at its empty-size guard,
  // which is how a window that is never asked for became a window that never
  // arrives, for two days, with nothing logged anywhere. So this reports the
  // boxes and says plainly that the embed is not something it can report.
  const EMBED_DEADLINE_MS = 20_000;

  /** Each <app>'s laid-out box, as `120x90`, in the order the cells are in. */
  const boxes = () =>
    apps
      .map((app) => app.getBoundingClientRect())
      .map((rect) => Math.round(rect.width) + 'x' + Math.round(rect.height))
      .join(' ');

  // `window.HTMLAppElement` rather than `instanceof`, which would throw on the
  // name before it could answer. Outside the fork — or with the feature off —
  // <app> parses as an HTMLUnknownElement that takes a box and shows nothing,
  // so every cell would compare an empty box against a filled one and the
  // whole table would read as a failure of CSS.
  if (window.HTMLAppElement === undefined) {
    console.log('domicile: <app> is not an element this engine knows, so ' +
                'nothing here can embed. Either this is not the fork, or ' +
                'DomicileExternalSurface is off.');
  } else {
    setTimeout(() => {
      console.log('domicile: ' + apps.length + ' <app> elements naming "' +
                  APP_ID + '", boxes ' + boxes() + ', expected ' +
                  BOX_WIDTH + 'x' + BOX_HEIGHT + ' each. Whether the browser ' +
                  'answered any of them is not visible from this page: an ' +
                  '<app> embeds from layout and the browser holds the reply ' +
                  'until that app has a producer. A box of 0x0 is the one ' +
                  'failure this can see — that element never asked.');
    }, EMBED_DEADLINE_MS);
  }
</script>
