<!doctype html>
<title>served</title>
<!-- Served by the guard's own server at http://127.0.0.1/. Asks for
     notifications, then for the location, and says what each answer was.
     The title says everything at once, as the desk may report only its
     last. -->
<script>
  (async () => {
    const notifications = await Notification.requestPermission();
    const location = await new Promise((resolve) => {
      navigator.geolocation.getCurrentPosition(
        () => resolve("position"),
        (error) => resolve(`error ${error.code}`),
        { timeout: 60_000 },
      );
    });
    document.title = ["done", notifications, location].join("|");
  })();
</script>
