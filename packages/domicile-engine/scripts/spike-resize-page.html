<!doctype html>
<!--
  THROWAWAY. The seventh cell of step 4's measurement, on its own page.

  Resize is not a CSS property; it is the lifecycle event underneath one. The
  embedder's box changes, and the producer has to be told to render at the new
  size — which is xdg_toplevel.configure, arriving as a bumped
  parent_sequence_number on the LocalSurfaceId the embedder owns.

  It gets a page to itself because bumping that id is exactly what the other
  seven cells cannot survive: every <app> in a document shares one surface in
  this spike, so reconfiguring one strands the rest.

  The geometry matches the first cell of spike-css-page.html, so the same
  half-against-half comparison in domicile_css_parity reads it.

  NOTHING HERE ASKS TO BE RE-EMBEDDED, AND THAT IS THE CLAIM. Through the
  canvas this page called the embed method a second time after growing the
  box, which measured a method rather than the thing the method was standing in
  for. The fork's <app> has no such method: LayoutAppSurface reports the box
  layout gave it, HTMLAppElement re-embeds at that size, and the only thing
  this page does is change one CSS rule. Which is the sentence the placement
  deletion in ROADMAP.md rests on — an <app>'s layout box *is* the
  xdg_toplevel.configure — now said by the page as well as by the header.
  scripts/test-parity-page-uses-the-native-tag.sh is what keeps it said.
-->
<meta charset="utf-8">
<title>domicile: does an &lt;app&gt; reconfigure when its box does?</title>
<style>
  html, body {
    background: #101418;         /* kPageBackground */
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  .cell {
    height: 190px;               /* kCellHeight */
    left: 16px;                  /* kGridLeft */
    position: absolute;
    top: 16px;                   /* kGridTop */
    width: 560px;                /* kCellWidth */
  }

  .half {
    height: 190px;
    isolation: isolate;
    position: absolute;
    top: 0;
    width: 280px;                /* kCellHalfWidth */
  }
  .app-half { left: 0; }
  .control-half { left: 280px; }

  .backdrop {
    background: linear-gradient(135deg, #ff9800 0%, #3f51b5 50%, #4caf50 100%);
    height: 130px;
    left: 60px;
    position: absolute;
    top: 30px;
    width: 160px;
  }

  .box {
    display: block;
    left: 80px;                  /* kBoxLeft */
    position: absolute;
    top: 50px;                   /* kBoxTop */
  }
</style>
<body>
  <div class="cell">
    <div class="half app-half">
      <div class="backdrop"></div>
      <app app-id="domicile-spike" class="box" id="app"></app>
    </div>
    <div class="half control-half">
      <div class="backdrop"></div>
      <div class="box" id="control"></div>
    </div>
  </div>
</body>
<script>
  // Must match what guard-css-and-resize.sh passes as --resize-from and --resize-to.
  // The producer is told these sizes so that "the box changed and the producer
  // was reconfigured to match" is checked against what the page actually did,
  // rather than against whatever it happened to be told.
  const FROM = { height: 90, width: 120 };
  const TO = { height: 130, width: 180 };

  // How long to hold the first size before growing. Long enough for the
  // producer to have submitted at it; the producer waits for the second
  // configure rather than for a clock, so this is a floor and not a deadline.
  const HOLD_MS = 1500;

  const DEFAULT_COLOR = '00C853';

  /** See spike-css-page.html: the harness is what makes the two agree. */
  const parseColor = (raw) => {
    if (/^[0-9a-fA-F]{6}$/.test(raw)) {
      return '#' + raw;
    } else {
      throw new Error('?color= wants RRGGBB hex, got "' + raw + '"');
    }
  };

  const COLOR = parseColor(
    new URLSearchParams(location.search).get('color') ?? DEFAULT_COLOR);

  const app = document.getElementById('app');
  const control = document.getElementById('control');
  control.style.background = COLOR;

  /** Sizes both boxes, so the two halves stay comparable across the resize. */
  const setSize = (size) => {
    for (const element of [app, control]) {
      element.style.width = size.width + 'px';
      element.style.height = size.height + 'px';
    }
  };

  // The window this page resizes. The markup names the default so that opening
  // the page by hand shows something; this reflects ?app= onto the element for
  // the scripts, because two producers drive this page —
  // `domicile_css_parity` from guard-css-and-resize.sh and
  // `domicile_engine_smoke` from spike-engine.sh — and they register different
  // app ids. `app-id` is a reflected content attribute, so setting it here and
  // writing it above are one operation, and setting it to what it already is
  // costs a re-embed that returns at its own in-flight guard.
  //
  // A wrong id still does not fail: the browser holds an embed until that app
  // has a producer, so it waits forever.
  const APP_ID =
    new URLSearchParams(location.search).get('app') ?? 'domicile-spike';
  app.setAttribute('app-id', APP_ID);

  // WHAT THIS PAGE CAN SEE, WHICH IS NOT THE EMBED. Through the canvas the
  // embed was a promise and a rejection named its own reason. The tag has
  // neither: it asks the browser from layout and the browser holds the reply
  // until a producer registers that app id, so embedded, refused and still
  // waiting are one silence from here.
  //
  // The box is what is left, and it is the more useful half anyway. An <app>
  // with no box never asks at all — `Embed()` returns at its empty-size guard,
  // which is how a window that is never asked for became a window that never
  // arrives, for two days, with nothing logged anywhere.
  const EMBED_DEADLINE_MS = 20_000;
  setTimeout(() => {
    const rect = app.getBoundingClientRect();
    console.log('domicile: <app app-id="' + APP_ID + '"> is laid out at ' +
                Math.round(rect.width) + 'x' + Math.round(rect.height) +
                '. Whether the browser answered is not visible from this ' +
                'page; a box of 0x0 is the one failure that is — that ' +
                'element never asked.');
  }, EMBED_DEADLINE_MS);

  // The whole of the reconfigure. Growing the box is the entire operation:
  // layout reports the new box, the element re-embeds at it, and the producer
  // is told. Nothing is called, which is the difference between this page and
  // the one it replaced.
  setSize(FROM);
  setTimeout(() => {
    setSize(TO);
  }, HOLD_MS);
</script>
