<!doctype html>
<!--
  THROWAWAY. The page half of step 3 of the spike in
  docs/architecture/ENGINE-FORK.md.

  A <canvas> that fills the viewport and, instead of drawing anything, embeds a
  viz surface a producer outside the renderer submits to. That is the whole of
  what the shell SDK's <domicile-app> becomes.

  The background color is the negative control. A canvas that embedded nothing
  is transparent, so what the pixel probe finds at the center of the window is
  this indigo rather than the producer's color — which is how "the canvas
  refused the surface" reads differently from "the producer never submitted".
-->
<meta charset="utf-8">
<title>domicile: embedding an external surface</title>
<style>
  html, body { margin: 0; height: 100%; background: #3f51b5; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas height="480" id="app" width="640" ></canvas>
<script>
  // Which app's window this <app> shows. The broker dispatches on it now — an
  // element asking for the editor is not answered with the terminal — so it
  // has to match the app id the producer created its surface with. The
  // harnesses pass it. The default is 'app-1' and that is a finding rather than
  // a convenience: the id crossing the seam is the compositor's own synthetic
  // one, assigned in the order windows appear, NOT the client's
  // xdg_toplevel.app_id. A shell naming a window has to know which.
  const APP_ID =
    new URLSearchParams(location.search).get('app') ?? 'app-1';

  const canvas = document.getElementById('app');
  if (canvas.embedExternalSurface) {
    // A wrong app id does not fail — the browser holds an embed until that app
    // has a producer, so it waits, and a page that waits forever looks exactly
    // like a seam that is broken. This line is the difference, and a clock is
    // not: WHEN A PRODUCER IS DUE IS A FACT ABOUT THE HARNESS. This page used
    // to count down 20 seconds from load and say nothing had embedded, and a
    // producer cannot exist by then — the guard starts its client after the
    // compositor is up, which on the run this was written against was 60s
    // later. So every passing run printed a line that reads as the reason it
    // failed.
    //
    // Said when the embed is asked for rather than after it: what tells the
    // two cases apart is whether an answer lands UNDER this line, which needs
    // no deadline to read and is true the moment the page has run.
    console.log('domicile: waiting to embed "' + APP_ID + '". The browser ' +
                'holds an embed until that app has a producer, so no answer ' +
                'under this line is either no producer or a different app id.');
    // Resolves only once a producer has been brokered a frame sink, which may
    // be well after load: the browser holds the reply until then, because an
    // <app> element exists before the window behind it does.
    canvas.embedExternalSurface(APP_ID).then(
      () => {
        console.log('domicile: embedded');
      },
      (error) => {
        console.log('domicile: refused: ' + error.message);
      });
  } else {
    // Not "nothing embedded it": the flag being off is an answer, and giving
    // the wrong reason for a failure that already gave its own is what the
    // deadline above did.
    console.log('domicile: embedExternalSurface is not exposed; the runtime ' +
                'flag is off');
  }
</script>
