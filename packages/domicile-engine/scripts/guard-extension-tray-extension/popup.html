<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Domicile tray guard</title>
    <!-- A file rather than inline: an extension page's CSP runs no inline script. -->
    <script src="popup.js"></script>
  </head>
  <!-- Fluid, as Bitwarden's popup is in a tab: nothing fixes the width, and
       two halves of guard-extension-tray.sh's WIDTH sit side by side at its
       HEIGHT. The <webview> must report WIDTH, which they lay out at given
       the room, and not the half its narrowest layout is. No whitespace
       between them, which would widen the line by a space; top-aligned, so
       the text in one does not drop it below the other and deepen the line. -->
  <body style="margin: 0">
    <span style="display: inline-block; width: 115px; height: 170px; vertical-align: top">the tray guard's popup</span><span style="display: inline-block; width: 115px; height: 170px; vertical-align: top"></span>
  </body>
</html>
