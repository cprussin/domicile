<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Domicile tray guard</title>
    <!-- A file rather than inline: an extension page's CSP runs no inline script. -->
    <script src="popup.js"></script>
  </head>
  <!-- Sized as real popups size themselves (Phantom's is this, at 360 by
       600): a minimum on the root, and a line longer than that. Chrome's
       toolbar popup is as wide as the minimum, guard-extension-tray.sh's
       WIDTH by HEIGHT, and wraps the line; a <webview> that reports the
       line's whole length instead grows wider than the page means to be. -->
  <body style="margin: 0; min-width: 230px; min-height: 170px">
    <p style="margin: 0">the tray guard's popup, as wide as its minimum and not as this whole line</p>
  </body>
</html>
