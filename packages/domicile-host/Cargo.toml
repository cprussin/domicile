[package]
name = "domicile-host"
description = "Domicile host orchestrator: ties the Wayland world to the scene model and chrome protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
domicile-scene = { path = "../domicile-scene" }
domicile-protocol = { path = "../domicile-protocol" }
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
notify.workspace = true
# Signals and waits for the shell's processes (see `src/system.rs`).
libc.workspace = true
# The shell's D-Bus calls and matches (see `src/system.rs`).
zbus.workspace = true
lofty.workspace = true
# Encodes screenshots (see `src/screenshot.rs`).
png.workspace = true

[dev-dependencies]
# A D-Bus service on a socket pair, so the tests need no bus daemon.
zbus = { workspace = true, features = ["p2p"] }
libc.workspace = true
tempfile.workspace = true
