[package]
name = "domicile-host"
description = "Domicile host orchestrator: ties the Wayland world to the scene model and chrome protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
domicile-scene = { path = "../domicile-scene" }
domicile-protocol = { path = "../domicile-protocol" }
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
notify.workspace = true
lofty.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Gates the Smithay backend so the default build tests without the graphics
# toolchain.
[features]
default = []
smithay-backend = []
