# Portal routing for `XDG_CURRENT_DESKTOP=domicile`. Domicile handles the
# interfaces it implements (see `domicile.portal`); gtk handles the rest.
# An interface Domicile draws a dialog for names only domicile, so gtk never
# draws a second one. See `docs/architecture/PORTALS.md`.
[preferred]
default=domicile;gtk
org.freedesktop.impl.portal.Access=domicile
org.freedesktop.impl.portal.AppChooser=domicile
org.freedesktop.impl.portal.FileChooser=domicile
org.freedesktop.impl.portal.Notification=domicile
org.freedesktop.impl.portal.Inhibit=domicile
org.freedesktop.impl.portal.RemoteDesktop=domicile
org.freedesktop.impl.portal.Clipboard=domicile
org.freedesktop.impl.portal.InputCapture=domicile
org.freedesktop.impl.portal.Account=domicile
org.freedesktop.impl.portal.Email=domicile
org.freedesktop.impl.portal.Lockdown=domicile
