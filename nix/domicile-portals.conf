# Portal routing for `XDG_CURRENT_DESKTOP=domicile`. Domicile implements every
# interface but `Secret` (see `domicile.portal`), which goes to the keyring:
# its store has no UI and must outlive the session. `oo7-portal` works too:
# name `oo7-portal` instead of `gnome-keyring`. See
# `docs/PORTALS.md`.
[preferred]
default=domicile
org.freedesktop.impl.portal.Secret=gnome-keyring
