# Where xdg-desktop-portal routes a Domicile desk's calls, read where
# `XDG_CURRENT_DESKTOP` is `domicile`. Domicile first, because the one
# interface it implements -- `Settings`, see `domicile.portal` -- has to reach
# it; gtk for everything else, which Domicile does not implement.
[preferred]
default=domicile;gtk
